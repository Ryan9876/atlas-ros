[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atlas-ros"
version = "5.2.0rc1"
description = "Policy-driven executable core for Atlas Ryan Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Ryan Smith"}]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-cov==6.3.0", "hypothesis==6.148.7", "ruff==0.12.12", "mypy==1.18.2", "build==1.3.0", "pip-audit==2.9.0", "types-PyYAML==6.0.12.20250915"]

[project.scripts]
atlas = "atlas_ros.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_ros"]
include = ["src/atlas_ros/data/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=atlas_ros --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["atlas_ros"]
mypy_path = "src"
