[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atlas-ros"
version = "7.5.1"
description = "Policy-driven executable core for Atlas Ryan Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Ryan Smith"}]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
ci = ["pytest==9.0.2", "pytest-cov==6.3.0", "hypothesis==6.148.7", "ruff==0.12.12", "mypy==1.18.2", "build==1.3.0", "types-PyYAML==6.0.12.20250915"]
dev = ["pytest==9.0.2", "pytest-cov==6.3.0", "hypothesis==6.148.7", "ruff==0.12.12", "mypy==1.18.2", "build==1.3.0", "pip-audit==2.9.0", "types-PyYAML==6.0.12.20250915"]

[project.scripts]
atlas = "atlas_ros.entry_points.main:main"
atlas-dev = "atlas_ros.entry_points.dev:main"
atlas-evaluate = "atlas_ros.entry_points.evaluate:main"
atlas-release = "atlas_ros.entry_points.release:main"
atlas-migrate = "atlas_ros.entry_points.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_ros"]
include = ["src/atlas_ros/data/**/*.yaml", "src/atlas_ros/data/**/*.json"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.venv",
  "/build",
  "/clean-wheel",
  "/dist",
  "/extracted",
  "/source-verification",
  "/test-results",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=atlas_ros --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["atlas_ros"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_cli.py" = ["E501"]
"tests/unit/test_release_control_center.py" = ["E501"]
"tests/unit/test_v650_rollback_reconciliation.py" = ["I001"]
"tests/unit/test_v711_initialization_schemas.py" = ["I001"]
"tests/test_v62_adaptive_input_processing.py" = ["I001"]
"src/atlas_ros/engines/archetypes_v62.py" = ["I001", "E501"]
"src/atlas_ros/engines/canonical_intent_v62.py" = ["I001", "E501"]
"src/atlas_ros/engines/decision_support_v62.py" = ["E501"]
"src/atlas_ros/engines/intent_graph_v62.py" = ["I001", "E501"]
"src/atlas_ros/engines/multi_outcome_v62.py" = ["I001", "E501"]
"src/atlas_ros/intelligence/__init__.py" = ["E402"]
"src/atlas_ros/intelligence/release_control_center.py" = ["E501"]
"src/atlas_ros/contracts/advisory_v1.py" = ["UP035"]
"src/atlas_ros/contracts/__init__.py" = ["I001"]
"src/atlas_ros/engines/__init__.py" = ["I001"]
"src/atlas_ros/engines/governed_execution_v65.py" = ["E501", "F401", "UP035", "UP037"]
"src/atlas_ros/kernel/bootstrap.py" = ["UP047"]
"src/atlas_ros/runtime_performance/contracts.py" = ["E501", "UP035"]
"tests/test_v65_governed_execution_intelligence.py" = ["E501"]
"scripts/build_v510_candidate_evidence.py" = ["E501"]
"scripts/build_v530_candidate_evidence.py" = ["E501"]
"scripts/compare_v62_performance.py" = ["I001", "E501"]
"scripts/validate_v745_runtime_performance.py" = ["E501"]
"scripts/scan_candidate_secrets.py" = ["I001"]
"tools/assemble_v410_restoration.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "atlas_ros.engines.archetypes_v62"
disable_error_code = ["assignment", "attr-defined", "arg-type"]

[[tool.mypy.overrides]]
module = "atlas_ros.engines.intent_graph_v62"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "atlas_ros.engines.domain_knowledge_v62"
disable_error_code = ["assignment"]
