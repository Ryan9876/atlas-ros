[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atlas-ros"
version = "5.1.0rc1"
description = "Policy-driven executable core for Atlas Ryan Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Ryan Smith"}]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-cov==6.3.0", "hypothesis==6.148.7", "ruff==0.12.12", "mypy==1.18.2", "build==1.3.0", "pip-audit==2.9.0", "types-PyYAML==6.0.12.20250915"]

[project.scripts]
atlas = "atlas_ros.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_ros"]
include = ["src/atlas_ros/data/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=atlas_ros --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["atlas_ros"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_cli.py" = ["E501"]
"tests/unit/test_release_control_center.py" = ["E501"]
"src/atlas_ros/intelligence/__init__.py" = ["E402"]
"src/atlas_ros/intelligence/release_control_center.py" = ["E501"]
"src/atlas_ros/workflows/w03_todoist.py" = ["E501"]
"tools/assemble_v410_restoration.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
