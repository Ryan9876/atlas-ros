name: v611-apply-mypy-fix-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v611-reasoning-coherence'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/v611-reasoning-coherence
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - run: python -m pip install --disable-pip-version-check mypy==1.18.2 pydantic==2.12.5 types-PyYAML==6.0.12.20250915
      - name: Apply exact typing fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/atlas_ros/engines/reasoning_coherence.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from __future__ import annotations\n\n',
              'from __future__ import annotations\n\nfrom typing import Any\n\n',
              1,
          )
          text = text.replace(
              '        values: dict[str, object] = {\n',
              '        values: dict[str, Any] = {\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          mypy src
          rm .github/workflows/v611-apply-mypy-fix-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix v6.1.1 coherence result typing'
          git push origin HEAD:agent/v611-reasoning-coherence
