name: v7.5.1 import diagnostic

on:
  pull_request:
    paths:
      - "tests/unit/test_v751_manifest_binding.py"
      - ".github/workflows/v751-import-diagnostic.yml"

permissions:
  contents: read

jobs:
  ruff-import-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - run: python -m pip install --disable-pip-version-check ruff==0.12.12
      - run: ruff check --select I --fix --diff tests/unit/test_v751_manifest_binding.py
