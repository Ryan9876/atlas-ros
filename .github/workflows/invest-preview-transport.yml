name: Build encrypted INVEST preview transport

on:
  push:
    branches:
      - transport/invest-preview-20260805

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: transport/invest-preview-20260805

      - name: Retrieve private source export
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-0020-822f-83ed-1bb2f15ed6ef/raw?se=2026-08-05T02:50:50Z&sp=r&sv=2026-02-06&sr=b&scid=3d1f1374-1c1b-55ff-b9f4-fddb2c6ba414&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T22:08:42Z&ske=2026-08-05T22:08:42Z&sks=b&skv=2026-02-06&sig=eAXqbGMrkyXh12vHi8IWqeCHgCuJ4oIKl0XrV6MVuAI%3D' \
            -o /tmp/invest-source-export.zip
          unzip -t /tmp/invest-source-export.zip
          mkdir -p /tmp/invest-export /tmp/invest-source
          unzip -q /tmp/invest-source-export.zip -d /tmp/invest-export
          archive="$(find /tmp/invest-export -type f -name '*.tgz' -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" -C /tmp/invest-source
          test -f /tmp/invest-source/app/config.py

      - name: Create encrypted runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/invest-source
          python - <<'PY'
          from pathlib import Path
          import tarfile

          paths = [Path('.python-version'), Path('requirements.txt'), Path('vercel.json')]
          for prefix in (Path('app'), Path('data'), Path('src')):
              paths.extend(sorted(path for path in prefix.rglob('*') if path.is_file()))
          with tarfile.open('/tmp/invest-preview-runtime.tar.xz', 'w:xz', preset=9) as archive:
              for path in paths:
                  archive.add(path, arcname=path.as_posix())
          PY
          key="$(openssl rand -hex 32)"
          printf '%s' "$key" > /tmp/bundle-key.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in /tmp/invest-preview-runtime.tar.xz \
            -out /tmp/invest-preview-runtime.tar.xz.enc \
            -pass file:/tmp/bundle-key.txt
          sha256sum /tmp/invest-preview-runtime.tar.xz.enc | cut -d' ' -f1 > /tmp/bundle-sha256.txt

      - name: Commit ciphertext only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .transport/invest-preview-20260805
          cp /tmp/invest-preview-runtime.tar.xz.enc .transport/invest-preview-20260805/runtime.tar.xz.enc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .transport/invest-preview-20260805/runtime.tar.xz.enc
          git commit -m 'Publish encrypted INVEST preview runtime transport'
          git push origin HEAD:transport/invest-preview-20260805
          git rev-parse HEAD > /tmp/transport-commit.txt

      - name: Package private transport metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          commit = Path('/tmp/transport-commit.txt').read_text().strip()
          payload = {
              'url': f'https://raw.githubusercontent.com/Ryan9876/atlas-ros/{commit}/.transport/invest-preview-20260805/runtime.tar.xz.enc',
              'key': Path('/tmp/bundle-key.txt').read_text().strip(),
              'sha256': Path('/tmp/bundle-sha256.txt').read_text().strip(),
              'commit': commit,
          }
          Path('invest-preview-transport.json').write_text(json.dumps(payload), encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: invest-preview-transport-metadata
          path: invest-preview-transport.json
          if-no-files-found: error
          retention-days: 1
