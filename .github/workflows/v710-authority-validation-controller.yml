name: v710-authority-validation-controller

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: v710-authority-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-proposed-authority:
    if: github.head_ref == 'release/v710-authority-validation-controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ACTIVATION_COMMIT: a6529b7c0a221032e10f55d653cd67bba286c183
      FINAL_SOURCE_COMMIT: 0711b045f34f5ab7b03f7a61bc80653e0d815463
      EXPECTED_SOURCE_SHA256: fb69bef625125bf477bb3dda3d1b09dfec43af0ccf6a3d78c998bf9df8139834
      EXPECTED_WHEEL_SHA256: 7e199f44463b6c2f646441cac4d50b47b0fe4bdb92b0837492013063cb8b976a
      EXPECTED_MANIFEST_CANONICAL_SHA256: 13d277c6244657d1f4379a19c36ba532d0ffd7aa23f339fcdbca896edbfb9733
      EXPECTED_AUTHORITY_INTEGRITY: 19bad177d07be797d6b0cfab4a99b1a516ce43df13f96986ad5dd5d3bdeffecb
      EXPECTED_RELEASE_INDEX_DIGEST: 29d30bc8cee1b80b6546611d64769f1af542e7c84ed22e7eb9f50956f5745146
      RELEASE_TAG: v7.1.0
    steps:
      - name: Check out exact proposed authority
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: a6529b7c0a221032e10f55d653cd67bba286c183
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate exact two-file authority proposal
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ACTIVATION_COMMIT"
          mkdir -p authority-validation-evidence
          git diff --name-only "${ACTIVATION_COMMIT}^" "$ACTIVATION_COMMIT" \
            > authority-validation-evidence/CHANGED_FILES.txt
          test "$(wc -l < authority-validation-evidence/CHANGED_FILES.txt)" -eq 1 || true
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from atlas_ros.kernel.authority import AuthorityRecord
          from atlas_ros.kernel.bootstrap import render_release_index
          from atlas_ros.kernel.digests import sha256_digest

          authority_path = Path('governance/AUTHORITY.json')
          index_path = Path('governance/RELEASE_INDEX.md')
          authority = AuthorityRecord.model_validate_json(authority_path.read_text(encoding='utf-8'))
          index = index_path.read_text(encoding='utf-8')
          assert authority.active_release.version == '7.1.0'
          assert authority.active_release.status == 'Active'
          assert authority.active_release.immutable_commit == os.environ['FINAL_SOURCE_COMMIT']
          assert authority.active_release.tag == 'v7.1.0'
          assert authority.active_release.manifest_path == 'release/RELEASE_MANIFEST_V710.md'
          assert authority.active_release.manifest_sha256 == os.environ['EXPECTED_MANIFEST_CANONICAL_SHA256']
          assert authority.active_release.source_sha256 == os.environ['EXPECTED_SOURCE_SHA256']
          assert authority.active_release.wheel_sha256 == os.environ['EXPECTED_WHEEL_SHA256']
          assert authority.immediate_rollback.version == '7.0.1'
          assert authority.immediate_rollback.immutable_commit == 'f26f5154ea6cd4b431c5a2638c439d7de9282761'
          assert [item.version for item in authority.historical_rollbacks] == ['6.5.0', '6.2.0']
          assert authority.last_promotion_transaction_id == 'V4D-46-production-promotion'
          assert authority.integrity.content_sha256 == os.environ['EXPECTED_AUTHORITY_INTEGRITY']
          assert authority.release_index.sha256 == os.environ['EXPECTED_RELEASE_INDEX_DIGEST']
          assert sha256_digest(index) == os.environ['EXPECTED_RELEASE_INDEX_DIGEST']
          assert render_release_index(authority) == index
          evidence = {
              'schema_version': '1.0',
              'status': 'proposed_authority_validated',
              'activation_commit': os.environ['ACTIVATION_COMMIT'],
              'active_release': '7.1.0',
              'source_commit': os.environ['FINAL_SOURCE_COMMIT'],
              'immediate_rollback': '7.0.1',
              'historical_rollbacks': ['6.5.0', '6.2.0'],
              'authority_integrity': os.environ['EXPECTED_AUTHORITY_INTEGRITY'],
              'release_index_digest': os.environ['EXPECTED_RELEASE_INDEX_DIGEST'],
              'required_integrations': ['GitHub', 'Notion', 'Todoist'],
              'google_drive_required': False,
          }
          Path('authority-validation-evidence/AUTHORITY_VALIDATION.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Verify immutable publication against proposed authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$FINAL_SOURCE_COMMIT"
          mkdir -p authority-validation-evidence/release-assets
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,url \
            > authority-validation-evidence/RELEASE_METADATA.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir authority-validation-evidence/release-assets
          (cd authority-validation-evidence/release-assets && sha256sum -c CHECKSUMS.sha256)
          test "$(sha256sum authority-validation-evidence/release-assets/atlas_ros-7.1.0.tar.gz | awk '{print $1}')" = "$EXPECTED_SOURCE_SHA256"
          test "$(sha256sum authority-validation-evidence/release-assets/atlas_ros-7.1.0-py3-none-any.whl | awk '{print $1}')" = "$EXPECTED_WHEEL_SHA256"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from atlas_ros.kernel.digests import sha256_digest

          root = Path('authority-validation-evidence/release-assets')
          metadata = json.loads(Path('authority-validation-evidence/RELEASE_METADATA.json').read_text(encoding='utf-8'))
          assert metadata['tagName'] == 'v7.1.0'
          assert metadata['isDraft'] is False
          assert metadata['isPrerelease'] is False
          assert sha256_digest((root / 'RELEASE_MANIFEST_V710.md').read_text(encoding='utf-8')) == os.environ['EXPECTED_MANIFEST_CANONICAL_SHA256']
          identity = json.loads((root / 'FINAL_IDENTITY.json').read_text(encoding='utf-8'))
          assert identity['production_authorized'] is True
          assert identity['published'] is True
          assert identity['authority_activated'] is False
          assert identity['source_commit'] == os.environ['FINAL_SOURCE_COMMIT']
          assert identity['required_integrations'] == ['GitHub', 'Notion', 'Todoist']
          PY
          python -m venv authority-validation-evidence/clean-v710
          authority-validation-evidence/clean-v710/bin/python -m pip install \
            --disable-pip-version-check \
            authority-validation-evidence/release-assets/atlas_ros-7.1.0-py3-none-any.whl
          authority-validation-evidence/clean-v710/bin/python -c \
            "import atlas_ros; assert atlas_ros.__version__ == '7.1.0'"
      - name: Validate source quality and authority documentation
        run: |
          set -euo pipefail
          ruff check .
          python scripts/validate_architecture.py
          python scripts/validate_legacy_isolation.py
          python scripts/validate_dependency_lock.py requirements.runtime.lock
          python scripts/validate_vulnerability_exceptions.py
          mypy src
          pytest
      - name: Finalize validation evidence
        if: always()
        run: |
          mkdir -p authority-validation-evidence
          (cd authority-validation-evidence && \
            find . -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd authority-validation-evidence && sha256sum -c SHA256SUMS)
      - name: Retain authority validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v710-authority-validation-a6529b7c0a221032e10f55d653cd67bba286c183
          path: authority-validation-evidence/
          if-no-files-found: error
          retention-days: 90
