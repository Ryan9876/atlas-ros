name: v700-mixed-evidence-binding

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bind-mixed-evidence-to-exact-head:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/v700-canonical-architecture')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Resolve successful exact-head evidence workflows
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 720); do
            runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100")"
            exact_run="$(jq -r '[.workflow_runs[] | select(.name == "v700-exact-artifact-validation" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            documentation_run="$(jq -r '[.workflow_runs[] | select(.name == "v700-drive-documentation-supplement" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            internal_run="$(jq -r '[.workflow_runs[] | select(.name == "v700-drive-internal-package-supplement" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            if [[ -n "$exact_run" && -n "$documentation_run" && -n "$internal_run" ]]; then
              echo "exact_run_id=$exact_run" >> "$GITHUB_OUTPUT"
              echo "documentation_run_id=$documentation_run" >> "$GITHUB_OUTPUT"
              echo "internal_run_id=$internal_run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Exact-head evidence workflows did not all pass" >&2
          exit 1
      - name: Download and verify exact-head evidence artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXACT_RUN_ID: ${{ steps.sources.outputs.exact_run_id }}
          DOCUMENTATION_RUN_ID: ${{ steps.sources.outputs.documentation_run_id }}
          INTERNAL_RUN_ID: ${{ steps.sources.outputs.internal_run_id }}
        run: |
          set -euo pipefail

          download_artifact() {
            local run_id="$1"
            local artifact_name="$2"
            local prefix="$3"
            local artifacts
            local artifact_id
            local artifact_digest
            local normalized_digest

            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts")"
            artifact_id="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | last | .id // empty' <<<"$artifacts")"
            artifact_digest="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | last | .digest // empty' <<<"$artifacts")"
            [[ -n "$artifact_id" && -n "$artifact_digest" ]]
            normalized_digest="${artifact_digest#sha256:}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${prefix}.zip"
            echo "${normalized_digest}  ${prefix}.zip" | sha256sum -c -
            mkdir "$prefix"
            unzip -q "${prefix}.zip" -d "$prefix"
            echo "${prefix}_artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"
            echo "${prefix}_artifact_digest=${normalized_digest}" >> "$GITHUB_OUTPUT"
          }

          download_artifact \
            "$EXACT_RUN_ID" \
            "atlas-ros-v700-exact-artifact-${HEAD_SHA}" \
            exact
          download_artifact \
            "$DOCUMENTATION_RUN_ID" \
            "atlas-ros-v700-drive-documentation-${HEAD_SHA}" \
            documentation
          download_artifact \
            "$INTERNAL_RUN_ID" \
            "atlas-ros-v700-drive-internal-package-${HEAD_SHA}" \
            internal
      - name: Verify retained evidence checksums
        run: |
          set -euo pipefail

          verify_checksum_file() {
            local root="$1"
            local name="$2"
            local checksum_file
            checksum_file="$(find "$root" -name "$name" -print -quit)"
            [[ -n "$checksum_file" ]]
            (
              cd "$(dirname "$checksum_file")"
              sha256sum -c "$(basename "$checksum_file")"
            )
          }

          verify_checksum_file exact EXACT_ARTIFACT_CHECKSUMS.sha256
          verify_checksum_file documentation DOCUMENTATION_EVIDENCE_CHECKSUMS.sha256
          verify_checksum_file internal INTERNAL_PACKAGE_EVIDENCE_CHECKSUMS.sha256
      - name: Bind mixed evidence to the exact head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXACT_RUN_ID: ${{ steps.sources.outputs.exact_run_id }}
          DOCUMENTATION_RUN_ID: ${{ steps.sources.outputs.documentation_run_id }}
          INTERNAL_RUN_ID: ${{ steps.sources.outputs.internal_run_id }}
          EXACT_ARTIFACT_ID: ${{ steps.artifacts.outputs.exact_artifact_id }}
          EXACT_ARTIFACT_DIGEST: ${{ steps.artifacts.outputs.exact_artifact_digest }}
          DOCUMENTATION_ARTIFACT_ID: ${{ steps.artifacts.outputs.documentation_artifact_id }}
          DOCUMENTATION_ARTIFACT_DIGEST: ${{ steps.artifacts.outputs.documentation_artifact_digest }}
          INTERNAL_ARTIFACT_ID: ${{ steps.artifacts.outputs.internal_artifact_id }}
          INTERNAL_ARTIFACT_DIGEST: ${{ steps.artifacts.outputs.internal_artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p v700-mixed-evidence-binding
          exact_chain="$(find exact -name V700_DRIVE_RELEASE_SUPPLEMENT_CHAIN_VALIDATION.json -print -quit)"
          documentation_result="$(find documentation -name V700_DRIVE_DOCUMENTATION_SUPPLEMENT_VALIDATION.json -print -quit)"
          internal_result="$(find internal -name V700_DRIVE_INTERNAL_PACKAGE_SUPPLEMENT_VALIDATION.json -print -quit)"
          [[ -n "$exact_chain" && -n "$documentation_result" && -n "$internal_result" ]]

          python -m scripts.validate_v700_mixed_evidence_binding \
            --head-sha "$HEAD_SHA" \
            --exact-package-chain "$exact_chain" \
            --documentation-result "$documentation_result" \
            --internal-package-result "$internal_result" \
            --exact-run-id "$EXACT_RUN_ID" \
            --exact-artifact-id "$EXACT_ARTIFACT_ID" \
            --exact-artifact-digest "$EXACT_ARTIFACT_DIGEST" \
            --documentation-run-id "$DOCUMENTATION_RUN_ID" \
            --documentation-artifact-id "$DOCUMENTATION_ARTIFACT_ID" \
            --documentation-artifact-digest "$DOCUMENTATION_ARTIFACT_DIGEST" \
            --internal-run-id "$INTERNAL_RUN_ID" \
            --internal-artifact-id "$INTERNAL_ARTIFACT_ID" \
            --internal-artifact-digest "$INTERNAL_ARTIFACT_DIGEST" \
            --output v700-mixed-evidence-binding/V700_MIXED_EVIDENCE_BINDING.json

          (
            cd v700-mixed-evidence-binding
            sha256sum V700_MIXED_EVIDENCE_BINDING.json \
              > MIXED_EVIDENCE_BINDING_CHECKSUMS.sha256
            sha256sum -c MIXED_EVIDENCE_BINDING_CHECKSUMS.sha256
          )
      - name: Retain exact-head mixed evidence binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v700-mixed-evidence-binding-${{ github.event.pull_request.head.sha || github.sha }}
          path: v700-mixed-evidence-binding/
          if-no-files-found: warn
          retention-days: 90
