name: v700-drive-cutover-plan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-drive-cutover-plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/v700-canonical-architecture')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate promotion-scoped Drive evidence
        run: |
          set -euo pipefail
          rm -rf v700-drive-cutover-evidence
          mkdir -p v700-drive-cutover-evidence
          python -m scripts.validate_v700_drive_folder_tree \
            --input release/v700-drive-folder-traversal.json \
            --output v700-drive-cutover-evidence/V700_DRIVE_FOLDER_TREE.json
          python -m scripts.validate_v700_current_drive_authority \
            --input release/v700-current-drive-authority-migration.json \
            --output v700-drive-cutover-evidence/V700_CURRENT_DRIVE_AUTHORITY.json
          python -m tools.release.drive_migration_cli compile \
            release/v700-drive-migration-inventory.json \
            v700-drive-cutover-evidence/V700_CURRENT_DRIVE_MIGRATION_LEDGER.json \
            > v700-drive-cutover-evidence/V700_CURRENT_DRIVE_MIGRATION_SUMMARY.json
          python -m scripts.validate_v700_pre_v6_deletion_plan \
            --plan release/v700-pre-v6-deletion-plan.json \
            --folder-tree release/v700-drive-folder-traversal.json \
            --output v700-drive-cutover-evidence/V700_PRE_V6_DELETION_PLAN.json
          python -m scripts.validate_v700_pre_v6_exclusion_review \
            --review release/v700-pre-v6-exclusion-review.json \
            --plan release/v700-pre-v6-deletion-plan.json \
            --folder-tree release/v700-drive-folder-traversal.json \
            --output v700-drive-cutover-evidence/V700_PRE_V6_EXCLUSION_REVIEW.json
      - name: Enforce scoped promotion and deletion boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('v700-drive-cutover-evidence')
          authority = json.loads(
              (root / 'V700_CURRENT_DRIVE_AUTHORITY.json').read_text(encoding='utf-8')
          )
          ledger = json.loads(
              (root / 'V700_CURRENT_DRIVE_MIGRATION_SUMMARY.json')
              .read_text(encoding='utf-8')
          )
          deletion = json.loads(
              (root / 'V700_PRE_V6_DELETION_PLAN.json').read_text(encoding='utf-8')
          )
          exclusion = json.loads(
              (root / 'V700_PRE_V6_EXCLUSION_REVIEW.json').read_text(encoding='utf-8')
          )

          assert authority['status'] == 'current_drive_authority_migration_ready'
          assert authority['current_drive_dependency_count'] == 1
          assert authority['promotion_scope_complete'] is True
          assert authority['pre_v6_history_required_for_promotion'] is False
          assert authority['provider_writes'] == 0

          assert ledger['item_count'] == 1
          assert ledger['inventory_complete'] is True
          assert ledger['unresolved_authoritative_items'] == 0
          assert ledger['staged_current_dependencies'] == 1
          assert ledger['complete_for_promotion_readiness'] is True
          assert ledger['ready_for_post_promotion_retirement'] is False
          assert ledger['provider_actions_performed'] == 0
          assert ledger['destructive_actions_performed'] == 0

          assert deletion['status'] == 'pre_v6_deletion_planned_not_authorized'
          assert deletion['target_folder_count'] == 92
          assert deletion['preserved_release_family'] == '6.x_and_newer'
          assert deletion['promotion_blocking'] is False
          assert deletion['deletion_ready'] is False
          assert deletion['deletion_authorized'] is False
          assert deletion['provider_writes'] == 0
          assert deletion['destructive_actions_performed'] == 0

          assert exclusion['status'] == 'pre_v6_exclusion_review_open_not_authorized'
          assert exclusion['candidate_folder_count'] == 92
          assert exclusion['reviewed_folder_count'] == 0
          assert exclusion['pending_folder_review_count'] == 92
          assert exclusion['excluded_item_count'] == 0
          assert exclusion['file_candidates_complete'] is False
          assert exclusion['exclusion_review_complete'] is False
          assert exclusion['promotion_blocking'] is False
          assert exclusion['deletion_ready'] is False
          assert exclusion['deletion_authorized'] is False
          assert exclusion['provider_writes'] == 0
          assert exclusion['destructive_actions_performed'] == 0
          candidate_digest = exclusion['candidate_folder_set_sha256']
          assert isinstance(candidate_digest, str) and len(candidate_digest) == 64
          PY
      - name: Create and verify evidence checksums
        run: |
          set -euo pipefail
          (
            cd v700-drive-cutover-evidence
            find . -type f ! -name DRIVE_CUTOVER_CHECKSUMS.sha256 -print0 | sort -z |
              xargs -0 sha256sum > DRIVE_CUTOVER_CHECKSUMS.sha256
            sha256sum -c DRIVE_CUTOVER_CHECKSUMS.sha256
          )
      - name: Retain Drive cutover evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v700-drive-cutover-${{ github.event.pull_request.head.sha || github.sha }}
          path: v700-drive-cutover-evidence/
          if-no-files-found: warn
          retention-days: 90
