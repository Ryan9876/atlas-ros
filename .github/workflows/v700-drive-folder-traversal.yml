name: v700-drive-folder-traversal

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-drive-folder-traversal:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/v700-canonical-architecture')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate recursive Drive folder evidence
        run: |
          set -euo pipefail
          rm -rf v700-drive-folder-evidence
          python -m scripts.validate_v700_drive_folder_tree \
            --input release/v700-drive-folder-traversal.json \
            --output v700-drive-folder-evidence/V700_DRIVE_FOLDER_TRAVERSAL_VALIDATION.json
      - name: Validate partial Drive file inventory
        run: |
          python -m scripts.validate_v700_drive_file_inventory \
            --inventory release/v700-drive-file-inventory.json \
            --folder-tree release/v700-drive-folder-traversal.json \
            --output v700-drive-folder-evidence/V700_DRIVE_FILE_INVENTORY_VALIDATION.json
      - name: Validate per-folder Drive file listing receipts
        run: |
          python -m scripts.validate_v700_drive_file_listing_receipts \
            --receipts release/v700-drive-file-listing-receipts.json \
            --inventory release/v700-drive-file-inventory.json \
            --folder-tree release/v700-drive-folder-traversal.json \
            --output v700-drive-folder-evidence/V700_DRIVE_FILE_LISTING_RECEIPTS_VALIDATION.json
      - name: Validate complete v5.0 Drive release supplement
        run: |
          python -m scripts.validate_v700_drive_release_supplement \
            --supplement release/v700-drive-v500-file-supplement.json \
            --inventory release/v700-drive-file-inventory.json \
            --receipts release/v700-drive-file-listing-receipts.json \
            --folder-tree release/v700-drive-folder-traversal.json \
            --output v700-drive-folder-evidence/V700_DRIVE_V500_SUPPLEMENT_VALIDATION.json
      - name: Enforce fail-closed traversal and file-inventory results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('v700-drive-folder-evidence')
          folders = json.loads(
              (root / 'V700_DRIVE_FOLDER_TRAVERSAL_VALIDATION.json')
              .read_text(encoding='utf-8')
          )
          files = json.loads(
              (root / 'V700_DRIVE_FILE_INVENTORY_VALIDATION.json')
              .read_text(encoding='utf-8')
          )
          receipts = json.loads(
              (root / 'V700_DRIVE_FILE_LISTING_RECEIPTS_VALIDATION.json')
              .read_text(encoding='utf-8')
          )
          supplement = json.loads(
              (root / 'V700_DRIVE_V500_SUPPLEMENT_VALIDATION.json')
              .read_text(encoding='utf-8')
          )
          assert folders['status'] == (
              'folder_traversal_complete_item_inventory_incomplete'
          )
          assert folders['folder_count'] == 93
          assert folders['leaf_folder_count'] == 78
          assert folders['max_depth'] == 6
          assert folders['folder_traversal_complete'] is True
          assert folders['item_inventory_complete'] is False
          assert folders['file_content_checksums_complete'] is False
          assert folders['unconsumed_page_tokens'] == 0
          assert folders['inaccessible_child_ids'] == []
          assert folders['incomplete_listing_folder_ids'] == []
          assert folders['promotion_ready'] is False
          assert folders['provider_writes'] == 0
          assert folders['drive_retirement_authorized'] is False

          assert files['status'] == 'partial_file_inventory'
          assert files['known_folder_count'] == 93
          assert files['scanned_folder_count'] == 5
          assert files['unscanned_folder_count'] == 88
          assert files['file_count'] == 16
          assert files['content_hashed_count'] == 15
          assert files['sensitive_item_count'] == 1
          assert files['verified_github_equivalence_count'] == 1
          assert files['governed_legacy_exception_count'] == 14
          assert files['enumeration_complete'] is False
          assert files['content_checksums_complete'] is False
          assert files['promotion_ready'] is False
          assert files['provider_writes'] == 0
          assert files['drive_retirement_authorized'] is False
          assert files['credential_action_authorized'] is False

          assert receipts['status'] == 'partial_file_listing_receipts'
          assert receipts['known_folder_count'] == 93
          assert receipts['listed_folder_count'] == 5
          assert receipts['unscanned_folder_count'] == 88
          assert receipts['file_count'] == 16
          assert receipts['bound_file_count'] == 16
          assert receipts['enumeration_complete'] is False
          assert receipts['provider_writes'] == 0
          assert receipts['drive_retirement_authorized'] is False

          assert supplement['status'] == (
              'partial_file_inventory_with_complete_v500_supplement'
          )
          assert supplement['release'] == '5.0'
          assert supplement['supplement_sha256'] == (
              'de6d34904f1e926da1b9e27d7be4502ab255a50662dcc5b70da89ea081de1196'
          )
          assert supplement['v500_scanned_folder_count'] == 1
          assert supplement['v500_file_count'] == 18
          assert supplement['v500_content_hashed_count'] == 18
          assert supplement['v500_listing_count'] == 1
          assert supplement['v500_candidate_checksum_reconciled'] is True
          assert supplement['combined_known_folder_count'] == 93
          assert supplement['combined_scanned_folder_count'] == 6
          assert supplement['combined_unscanned_folder_count'] == 87
          assert supplement['combined_file_count'] == 34
          assert supplement['combined_content_hashed_count'] == 33
          assert supplement['combined_sensitive_item_count'] == 1
          assert supplement['combined_verified_github_equivalence_count'] == 1
          assert supplement['combined_governed_legacy_exception_count'] == 32
          assert supplement['enumeration_complete'] is False
          assert supplement['content_checksums_complete'] is False
          assert supplement['promotion_ready'] is False
          assert supplement['provider_writes'] == 0
          assert supplement['drive_retirement_authorized'] is False
          assert supplement['credential_action_authorized'] is False
          PY
      - name: Create and verify Drive evidence checksums
        run: |
          (
            cd v700-drive-folder-evidence
            find . -type f ! -name DRIVE_EVIDENCE_CHECKSUMS.sha256 -print0 | sort -z |
              xargs -0 sha256sum > DRIVE_EVIDENCE_CHECKSUMS.sha256
            sha256sum -c DRIVE_EVIDENCE_CHECKSUMS.sha256
          )
      - name: Retain Drive traversal and file-inventory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v700-drive-inventory-${{ github.event.pull_request.head.sha || github.sha }}
          path: v700-drive-folder-evidence/
          if-no-files-found: warn
          retention-days: 90
