name: v8.0.0 independent publication readback

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        default: v8.0.0
        type: string

permissions:
  contents: read
  actions: read

jobs:
  readback:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v8.0.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Resolve live rollback authority and published tag
        env:
          TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test "$TAG" = 'v8.0.0'
          git fetch --tags --force
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          printf '%s\n' "$TAG_COMMIT" > TAG_COMMIT.txt
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          authority = json.loads(Path('governance/AUTHORITY.json').read_text())
          active = authority['active_release']
          assert active['version'] == '7.8.0', 'publication readback occurs before v8 activation'
          print(f"RESTORE_TAG={active['tag']}")
          print(f"RESTORE_COMMIT={active['immutable_commit']}")
          PY
      - name: Download and verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets rollback-assets clean-install
          gh release download v8.0.0 --dir release-assets
          (cd release-assets && sed 's#  dist/#  #' CHECKSUMS.sha256 | sha256sum -c -)
          test -f release-assets/atlas_ros-8.0.0.tar.gz
          test -f release-assets/atlas_ros-8.0.0-py3-none-any.whl
          test -f release-assets/V800_SBOM.spdx.json
          test -f release-assets/V800_SOURCE_MANIFEST.json
          python -m venv clean-install/v800
          clean-install/v800/bin/python -m pip install release-assets/atlas_ros-8.0.0-py3-none-any.whl
          clean-install/v800/bin/python -c "import atlas_ros; assert atlas_ros.__version__ == '8.0.0'"
      - name: Restore and verify v7.8.0 rollback target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RESTORE_TAG" --dir rollback-assets
          (cd rollback-assets && sed 's#  dist/#  #' CHECKSUMS.sha256 | sha256sum -c -)
          test -n "$RESTORE_COMMIT"
      - name: Emit non-activating readback receipt
        run: |
          mkdir -p readback
          python - <<'PY'
          import json
          from pathlib import Path
          Path('readback/V800_PUBLICATION_READBACK.json').write_text(json.dumps({
              'tag': 'v8.0.0',
              'tag_commit': Path('TAG_COMMIT.txt').read_text().strip(),
              'assets_verified': True,
              'clean_install': 'passed',
              'rollback_v780_restoration': 'passed',
              'authority_activated': False,
              'provider_writes': 0,
          }, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v800-independent-publication-readback
          path: readback/
          if-no-files-found: error
          retention-days: 90
