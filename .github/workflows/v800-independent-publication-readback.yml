name: v8.0.0 independent publication readback

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

env:
  TAG: v8.0.0
  PACKAGE_SOURCE_COMMIT: 674f0c979dec8f83a1610c7435e633e2d33e673a
  SOURCE_SHA256: 2bfd6fda0879b9508809bdb28a41f43a664bee1098ce3325b3574223cd864047
  WHEEL_SHA256: 0a308d4b4d23a86b99fe66a1e17b89340ff5ab84091b9eca277f461d13f8f8a5
  SBOM_SHA256: 65c8642671b1729bb775540d7bcdb5af05d14659d39169c940b8c13b5a14d9ec
  SOURCE_MANIFEST_SHA256: 667774768014e45fb821964d2c78f8225b34f74869e7e5cb7398b1d7bb79cc05
  SOURCE_TREE_SHA256: a4c0ee2e4222979cbca4939fb38a405168b531f0bd6527574fe60d70205e9d8d
  VALIDATION_SHA256: 49bf52c882ca99cefe9b7a3fdf02c0578124c2771c1dde59aa729534e2d6f5dd
  MIGRATION_RECEIPT_SHA256: a87ed0b2b13bb1ebb84ec4f390bf872c777898f9dca3e365940d5aaf6bbc304a
  PROVIDER_DRY_RUN_SHA256: cab1a56b57350f5ba4d5e70d31a1917b24e712a4a310097aaf638f06ae5b7212
  MANIFEST_SHA256: fd84ef9386f471873c3943074d356ea2e6ba2278e00762c544efec38c9de1699
  AUTHORIZATION_SHA256: b9ee50cbf4958bd22075d4247e92635d12af8a70d5f7ea5bf9e1d4640f20f439
  MIGRATION_DIGEST: d153491cf626aa6628e186faf84b9643bf9f3f491a272c18df30e5d6916de5c9

jobs:
  readback:
    if: github.event.release.tag_name == 'v8.0.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: v8.0.0
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Resolve live rollback authority and verify tag controls
        run: |
          set -euo pipefail
          test "$(git describe --exact-match --tags HEAD)" = "$TAG"
          test "$(sha256sum release/RELEASE_MANIFEST_V800.md | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          test "$(sha256sum release/V800_EXACT_PACKAGE_AUTHORIZATION.md | cut -d' ' -f1)" = "$AUTHORIZATION_SHA256"
          git fetch origin main:refs/remotes/origin/main --force
          git show origin/main:governance/AUTHORITY.json > LIVE_AUTHORITY.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          authority = json.loads(Path('LIVE_AUTHORITY.json').read_text())
          active = authority['active_release']
          rollback = authority['immediate_rollback']
          assert active['version'] == '7.8.0', 'publication readback occurs before v8 activation'
          assert active['immutable_commit'] == '72974d1d7da9f07a4c8a41b73b22c0fae3770268'
          assert rollback['version'] == '7.7.0'
          print(f"RESTORE_TAG={active['tag']}")
          print(f"RESTORE_COMMIT={active['immutable_commit']}")
          print(f"RESTORE_MANIFEST={active['manifest_path']}")
          print(f"RESTORE_MANIFEST_SHA256={active['manifest_sha256']}")
          print(f"RESTORE_SOURCE_SHA256={active['source_sha256']}")
          print(f"RESTORE_WHEEL_SHA256={active['wheel_sha256']}")
          print(f"HISTORICAL_TAG={rollback['tag']}")
          print(f"HISTORICAL_COMMIT={rollback['immutable_commit']}")
          PY

      - name: Download and verify published v8.0.0 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p readback clean-install
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir readback
          test "$(sha256sum readback/atlas_ros-8.0.0.tar.gz | cut -d' ' -f1)" = "$SOURCE_SHA256"
          test "$(sha256sum readback/atlas_ros-8.0.0-py3-none-any.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum readback/V800_SBOM.spdx.json | cut -d' ' -f1)" = "$SBOM_SHA256"
          test "$(sha256sum readback/V800_SOURCE_MANIFEST.json | cut -d' ' -f1)" = "$SOURCE_MANIFEST_SHA256"
          test "$(sha256sum readback/SOURCE_TREE.txt | cut -d' ' -f1)" = "$SOURCE_TREE_SHA256"
          test "$(sha256sum readback/V800_VALIDATION_RECEIPT.json | cut -d' ' -f1)" = "$VALIDATION_SHA256"
          test "$(sha256sum readback/V800_MIGRATION_RECEIPT.json | cut -d' ' -f1)" = "$MIGRATION_RECEIPT_SHA256"
          test "$(sha256sum readback/V800_PROVIDER_DRY_RUN.json | cut -d' ' -f1)" = "$PROVIDER_DRY_RUN_SHA256"
          test "$(sha256sum readback/RELEASE_MANIFEST_V800.md | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          test "$(sha256sum readback/V800_EXACT_PACKAGE_AUTHORIZATION.md | cut -d' ' -f1)" = "$AUTHORIZATION_SHA256"
          sed 's#  dist/#  #' readback/CHECKSUMS.sha256 | (cd readback && sha256sum -c -)
          test "$(jq -r .candidate_commit readback/V800_VALIDATION_RECEIPT.json)" = "$PACKAGE_SOURCE_COMMIT"
          test "$(jq -r .migration_digest readback/V800_MIGRATION_RECEIPT.json)" = "$MIGRATION_DIGEST"
          test "$(jq -r .provider_writes readback/V800_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .notion_writes readback/V800_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .todoist_writes readback/V800_VALIDATION_RECEIPT.json)" = "0"

      - name: Verify clean source and wheel installations
        run: |
          set -euo pipefail
          for kind in sdist wheel; do
            package=readback/atlas_ros-8.0.0.tar.gz
            [ "$kind" = wheel ] && package=readback/atlas_ros-8.0.0-py3-none-any.whl
            python -m venv "clean-install/$kind"
            "clean-install/$kind/bin/python" -m pip install --disable-pip-version-check "$package"
            "clean-install/$kind/bin/python" -c "import atlas_ros; assert atlas_ros.__version__ == '8.0.0'"
            "clean-install/$kind/bin/atlas" status --json
            "clean-install/$kind/bin/atlas" verify --json
          done

      - name: Restore and verify v7.8.0 and historical v7.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$RESTORE_TAG")" = "$RESTORE_COMMIT"
          test "$(git rev-list -n 1 "$HISTORICAL_TAG")" = "$HISTORICAL_COMMIT"
          git show "$RESTORE_COMMIT:$RESTORE_MANIFEST" > readback/RESTORE_MANIFEST.md
          test "$(sha256sum readback/RESTORE_MANIFEST.md | cut -d' ' -f1)" = "$RESTORE_MANIFEST_SHA256"
          mkdir -p readback/rollback-v780 readback/historical-v770
          gh release download "$RESTORE_TAG" --repo "$GITHUB_REPOSITORY" --dir readback/rollback-v780
          gh release download "$HISTORICAL_TAG" --repo "$GITHUB_REPOSITORY" --dir readback/historical-v770
          restore_sdist="$(find readback/rollback-v780 -maxdepth 1 -type f -name 'atlas_ros-7.8.0.tar.gz' -print -quit)"
          restore_wheel="$(find readback/rollback-v780 -maxdepth 1 -type f -name 'atlas_ros-7.8.0-py3-none-any.whl' -print -quit)"
          test "$(sha256sum "$restore_sdist" | cut -d' ' -f1)" = "$RESTORE_SOURCE_SHA256"
          test "$(sha256sum "$restore_wheel" | cut -d' ' -f1)" = "$RESTORE_WHEEL_SHA256"
          git show "$HISTORICAL_COMMIT:release/RELEASE_MANIFEST_V770.md" > readback/HISTORICAL_MANIFEST.md
          historical_source="$(sed -n 's/^- Source distribution SHA-256: `\([0-9a-f]\{64\}\)`.*/\1/p' readback/HISTORICAL_MANIFEST.md)"
          historical_wheel="$(sed -n 's/^- Wheel SHA-256: `\([0-9a-f]\{64\}\)`.*/\1/p' readback/HISTORICAL_MANIFEST.md)"
          test -n "$historical_source"
          test -n "$historical_wheel"
          test "$(sha256sum readback/historical-v770/atlas_ros-7.7.0.tar.gz | cut -d' ' -f1)" = "$historical_source"
          test "$(sha256sum readback/historical-v770/atlas_ros-7.7.0-py3-none-any.whl | cut -d' ' -f1)" = "$historical_wheel"

      - name: Emit non-activating readback receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          receipt = {
              'schema_version': 'v800-publication-readback-v1',
              'tag': 'v8.0.0',
              'tag_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'package_source_commit': os.environ['PACKAGE_SOURCE_COMMIT'],
              'assets_verified': True,
              'clean_source_install': 'passed',
              'clean_wheel_install': 'passed',
              'rollback_v780_restoration': 'passed',
              'historical_v770_verification': 'passed',
              'migration_digest': os.environ['MIGRATION_DIGEST'],
              'authority_activated': False,
              'provider_writes': 0,
              'notion_writes': 0,
              'todoist_writes': 0,
          }
          Path('readback/V800_PUBLICATION_READBACK.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v800-independent-publication-readback-${{ github.run_id }}
          path: readback/V800_PUBLICATION_READBACK.json
          if-no-files-found: error
          retention-days: 90
