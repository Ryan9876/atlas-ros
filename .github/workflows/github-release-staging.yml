name: github-release-staging

on:
  workflow_run:
    workflows: [release-candidate]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: GitHub Actions run containing the validated release-candidate artifact
        required: true
        type: string
      artifact_name:
        description: Exact release-candidate artifact name
        required: true
        type: string
      tag:
        description: Draft release tag, for example v5.3.0-rc.1
        required: true
        type: string
      release_name:
        description: Human-readable draft release name
        required: true
        type: string
      target_commitish:
        description: Commit or branch that the draft release must target
        required: true
        type: string
      expected_package_sha256:
        description: Optional expected combined-package SHA-256
        required: false
        type: string

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: github-release-staging-v5.3.0-rc.1
  cancel-in-progress: false

jobs:
  stage-draft-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'release/v5.3-candidate')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.candidate_run_id }}
      ARTIFACT_NAME: ${{ inputs.artifact_name || 'atlas-ros-v5.3.0rc1-release-candidate' }}
      TAG: ${{ inputs.tag || 'v5.3.0-rc.1' }}
      RELEASE_NAME: ${{ inputs.release_name || 'Atlas ROS v5.3.0 Classification Intelligence Release Candidate 1' }}
      TARGET_COMMITISH: ${{ github.event.workflow_run.head_sha || inputs.target_commitish }}
      EXPECTED_PACKAGE_SHA256: ${{ inputs.expected_package_sha256 }}

    steps:
      - name: Check out release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_COMMITISH }}
          persist-credentials: false

      - name: Download validated candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${ARTIFACT_NAME}" --dir candidate

      - name: Verify candidate package and publication checksums
        run: |
          set -euo pipefail
          package="$(find candidate -maxdepth 3 -type f -name 'Atlas_ROS_v*_release_candidate.zip' -print -quit)"
          checksum_file="${package}.sha256"
          test -n "${package}"
          test -f "${checksum_file}"
          (cd "$(dirname "${package}")" && sha256sum -c "$(basename "${checksum_file}")")
          actual_sha256="$(sha256sum "${package}" | awk '{print $1}')"
          if [[ -n "${EXPECTED_PACKAGE_SHA256}" && "${actual_sha256}" != "${EXPECTED_PACKAGE_SHA256}" ]]; then
            echo "candidate package digest mismatch" >&2
            exit 1
          fi
          rm -rf verified-candidate
          mkdir verified-candidate
          unzip -q "${package}" -d verified-candidate
          (cd verified-candidate/publication && sha256sum -c CHECKSUMS.sha256)
          printf 'PACKAGE=%s\n' "${package}" >> "${GITHUB_ENV}"
          printf 'PACKAGE_SHA256=%s\n' "${actual_sha256}" >> "${GITHUB_ENV}"

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="verified-candidate/publication/RELEASE_MANIFEST.md"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft --title "${RELEASE_NAME}" --target "${TARGET_COMMITISH}" --notes-file "${notes_file}"
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft --title "${RELEASE_NAME}" --target "${TARGET_COMMITISH}" --notes-file "${notes_file}"
          fi

      - name: Upload checksum-bound draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find verified-candidate/publication -type f -print0 | sort -z)
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${PACKAGE}" "${PACKAGE}.sha256" "${assets[@]}"

      - name: Download and verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-readback
          mkdir release-readback
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-readback
          downloaded_package="$(find release-readback -maxdepth 1 -type f -name 'Atlas_ROS_v*_release_candidate.zip' -print -quit)"
          test -n "${downloaded_package}"
          test "$(sha256sum "${downloaded_package}" | awk '{print $1}')" = "${PACKAGE_SHA256}"
          (cd release-readback && sha256sum -c "$(basename "${downloaded_package}").sha256")
          test -f release-readback/CHECKSUMS.sha256
          (cd release-readback && sha256sum -c CHECKSUMS.sha256)

      - name: Prove restoration without Drive
        run: |
          set -euo pipefail
          rm -rf restored-source restored-venv
          mkdir restored-source
          unzip -q release-readback/Atlas_ROS_v*_release_candidate.zip -d restored-source
          source_archive="$(find restored-source -type f -name '*.tar.gz' -print -quit)"
          test -n "${source_archive}"
          python -m venv restored-venv
          restored-venv/bin/pip install --disable-pip-version-check "${source_archive}"
          restored-venv/bin/python -c "import atlas_ros; from atlas_ros.capabilities import ExecutionPlanner, ManagementReasoningEngine, ResponsibilityClassifier"

      - name: Verify draft release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,tagName,targetCommitish --jq 'select(.isDraft == true and .tagName == env.TAG and .targetCommitish == env.TARGET_COMMITISH)'
          echo "Draft release staged, downloaded, checksum-verified, and restored without Drive. Publication remains inactive until Ryan explicitly authorizes promotion."

      - name: Record staging receipt on promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment 13 --repo "${GITHUB_REPOSITORY}" --body "Draft GitHub Release staging passed for \`${TAG}\`. Staging run: \`${GITHUB_RUN_ID}\`. Candidate run: \`${RUN_ID}\`. Target: \`${TARGET_COMMITISH}\`. Package SHA-256: \`${PACKAGE_SHA256}\`. Assets were uploaded, downloaded, checksum-verified, and restored without Google Drive, including Classification Intelligence imports. Production promotion remains unauthorized."
