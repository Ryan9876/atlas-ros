name: v8.3.0 authority activation validation

on:
  pull_request:
    branches: [main]
    paths:
      - governance/AUTHORITY.json
      - governance/RELEASE_INDEX.md
      - release/V830_AUTHORITY_ACTIVATION.md
      - .github/workflows/v830-authority-activation.yml

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ACTIVE_COMMIT: 88ce7fecabdb20c62410e8af151653ec5e7dd511
      MANIFEST_SHA256: e9ec73a996e57224d39122f717c86fa53f62005ede88125664339b88651eb972
      SOURCE_SHA256: d180ac3367229b6bdf5ca160acb5221e8800807909bef85b30aa3615347fafbf
      WHEEL_SHA256: d76a43aa99e629fe8055920f325028a2b64eefa6f10e1d0497419805b622f5fe
      ROLLBACK_COMMIT: 38285a988ef0e265ad859474c3bdcb58a1744649
      HISTORICAL_COMMIT: 64c38eb4e83f6edf2d6cff28f7c7556a2c84c0c9
      RELEASE_INDEX_SHA256: b9b58f42fe1675204ed958371e93c5a3f965ad6a6eb7e834f05905e087713c11
      AUTHORITY_INTEGRITY_SHA256: 20dfd7883f6c8346dcc5e24cc5793636789cdab8a9b346e604e38dfb611f6494
      AUDIT_RUN_ID: '30657117807'
      AUDIT_ARTIFACT_ID: '8803677584'
      AUDIT_ARTIFACT_DIGEST: sha256:10fab327ac4ae997464db00a94f0b6530e8b23e230630bbfd1d170be43fbbbd5
      AUDIT_RECEIPT_SHA256: 28e9f8dd48062a7aa529ad7f82c41224c717830abb23a70b620c13873a3c0653
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - run: python -m pip install --disable-pip-version-check -e .

      - name: Validate canonical authority and immutable identities
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 v8.3.0)" = "$ACTIVE_COMMIT"
          test "$(sha256sum release/RELEASE_MANIFEST_V830.md | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          test "$(git show "$ACTIVE_COMMIT:release/RELEASE_MANIFEST_V830.md" | sha256sum | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          git fetch origin main:refs/remotes/origin/main --force
          git show origin/main:governance/AUTHORITY.json > PREACTIVATION_AUTHORITY.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from atlas_ros.kernel.authority import AuthorityRecord
          from atlas_ros.kernel.bootstrap import render_release_index
          from atlas_ros.kernel.digests import sha256_digest
          authority=AuthorityRecord.model_validate_json(Path('governance/AUTHORITY.json').read_text())
          active=authority.active_release; rollback=authority.immediate_rollback
          assert active.version=='8.3.0' and active.immutable_commit==os.environ['ACTIVE_COMMIT']
          assert active.tag=='v8.3.0' and active.manifest_path=='release/RELEASE_MANIFEST_V830.md'
          assert active.manifest_sha256==os.environ['MANIFEST_SHA256']
          assert active.source_sha256==os.environ['SOURCE_SHA256']
          assert active.wheel_sha256==os.environ['WHEEL_SHA256']
          assert rollback.version=='8.2.1' and rollback.immutable_commit==os.environ['ROLLBACK_COMMIT']
          assert authority.historical_rollbacks[0].version=='8.2.0'
          assert authority.historical_rollbacks[0].immutable_commit==os.environ['HISTORICAL_COMMIT']
          assert authority.last_promotion_transaction_id=='V830-software-release-promotion'
          assert authority.release_index.sha256==os.environ['RELEASE_INDEX_SHA256']
          assert authority.integrity.content_sha256==os.environ['AUTHORITY_INTEGRITY_SHA256']
          index=Path('governance/RELEASE_INDEX.md').read_text()
          assert index==render_release_index(authority)
          assert sha256_digest(index)==os.environ['RELEASE_INDEX_SHA256']
          pre=json.loads(Path('PREACTIVATION_AUTHORITY.json').read_text())
          assert pre['active_release']['version']=='8.2.1'
          assert pre['active_release']['immutable_commit']==os.environ['ROLLBACK_COMMIT']
          assert pre['immediate_rollback']['version']=='8.2.0'
          assert pre['immediate_rollback']['immutable_commit']==os.environ['HISTORICAL_COMMIT']
          PY

      - name: Verify independent audit receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUDIT_ARTIFACT_ID}" --jq .digest)" = "$AUDIT_ARTIFACT_DIGEST"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUDIT_ARTIFACT_ID}/zip" > audit.zip
          test "$(sha256sum audit.zip | cut -d' ' -f1)" = "${AUDIT_ARTIFACT_DIGEST#sha256:}"
          unzip -q audit.zip -d audit
          test "$(sha256sum audit/V830_POSTPUBLICATION_AUDIT.json | cut -d' ' -f1)" = "$AUDIT_RECEIPT_SHA256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('audit/V830_POSTPUBLICATION_AUDIT.json').read_text())
          assert r['result']=='passed' and r['tag']=='v8.3.0'
          assert r['tag_commit']==os.environ['ACTIVE_COMMIT']
          assert r['release_assets_verified']==11 and r['package_rebuilt'] is False
          assert r['clean_source_install']==r['clean_wheel_install']=='passed'
          assert r['rollback_v821_restoration']=='passed'
          assert r['historical_v820_verification']=='passed'
          assert r['production_event_controls']=='inactive'
          assert r['provider_writes']==r['notion_writes']==r['todoist_writes']==0
          PY

      - name: Verify release activation does not enable event runtime
        run: |
          python - <<'PY'
          from atlas_ros.reconciliation.event_http import EventReceiverConfig
          from atlas_ros.reconciliation.events import AutonomyMode, AutonomyPolicy
          policy=AutonomyPolicy()
          receiver=EventReceiverConfig(
              todoist_client_secret='unused',
              notion_verification_token='unused',
              policy_version=policy.version,
          )
          assert policy.mode is AutonomyMode.MONITOR_ONLY
          assert policy.kill_switch is True
          assert receiver.ingress_enabled is False
          PY

      - name: Emit activation receipt
        run: |
          mkdir -p activation-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          r={'schema_version':'v830-authority-activation-validation-v1','status':'passed',
             'active_version':'8.3.0','active_commit':'88ce7fecabdb20c62410e8af151653ec5e7dd511',
             'immediate_rollback_version':'8.2.1','immediate_rollback_commit':'38285a988ef0e265ad859474c3bdcb58a1744649',
             'historical_rollback_version':'8.2.0','historical_rollback_commit':'64c38eb4e83f6edf2d6cff28f7c7556a2c84c0c9',
             'release_index_sha256':'b9b58f42fe1675204ed958371e93c5a3f965ad6a6eb7e834f05905e087713c11',
             'authority_integrity_sha256':'20dfd7883f6c8346dcc5e24cc5793636789cdab8a9b346e604e38dfb611f6494',
             'publication_audit_run':30657117807,'publication_audit_artifact':8803677584,
             'production_event_controls':'inactive','provider_writes':0,
             'notion_writes':0,'todoist_writes':0}
          Path('activation-evidence/V830_AUTHORITY_ACTIVATION_VALIDATION.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v830-authority-activation-${{ github.run_id }}
          path: activation-evidence/V830_AUTHORITY_ACTIVATION_VALIDATION.json
          if-no-files-found: error
          retention-days: 90
