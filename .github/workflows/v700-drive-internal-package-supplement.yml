name: v700-drive-internal-package-supplement

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-drive-internal-package-supplement:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/v700-canonical-architecture')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate mixed Drive evidence ledger
        run: |
          set -euo pipefail
          rm -rf v700-drive-internal-package-evidence
          python -m scripts.validate_v700_drive_internal_package_supplement_chain \
            --package-supplement release/v700-drive-v500-file-supplement.json \
            --package-supplement release/v700-drive-v453-file-supplement.json \
            --package-supplement release/v700-drive-v450-file-supplement.json \
            --documentation-supplement release/v700-drive-v451-documentation-supplement.json \
            --internal-package-supplement release/v700-drive-v452-internal-package-supplement.json \
            --inventory release/v700-drive-file-inventory.json \
            --receipts release/v700-drive-file-listing-receipts.json \
            --folder-tree release/v700-drive-folder-traversal.json \
            --output v700-drive-internal-package-evidence/V700_DRIVE_INTERNAL_PACKAGE_SUPPLEMENT_VALIDATION.json
      - name: Enforce fail-closed mixed evidence results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  'v700-drive-internal-package-evidence/'
                  'V700_DRIVE_INTERNAL_PACKAGE_SUPPLEMENT_VALIDATION.json'
              ).read_text(encoding='utf-8')
          )
          assert result['status'] == (
              'partial_file_inventory_with_complete_mixed_evidence_supplements'
          )
          assert result['externally_reconciled_package_count'] == 3
          assert result['externally_reconciled_package_releases'] == [
              '5.0',
              '4.5.3',
              '4.5.0',
          ]
          assert result['documentation_supplement_count'] == 1
          assert result['documentation_releases'] == ['4.5.1']
          assert result['internally_closed_unreconciled_package_count'] == 1
          assert result['internally_closed_unreconciled_package_releases'] == [
              '4.5.2'
          ]
          supplement = result['internal_package_supplements'][0]
          assert supplement['supplement_sha256'] == (
              '7f87a1410cce585d0520027479a1e5448e04d7ed392c57437d79d905112ed4b4'
          )
          assert supplement['direct_file_count'] == 8
          assert supplement['archive_entry_count'] == 10
          assert supplement['checksum_covered_entry_count'] == 9
          assert supplement['direct_internal_binding_count'] == 7
          assert supplement['direct_folder_absent_internal_entry_count'] == 3
          assert supplement['package_sha256'] == (
              'e1843c194c3fe994123647949fb8ea81478cbbe54c8acf628fb77c61c94fd486'
          )
          assert supplement['internal_checksums_closed'] is True
          assert supplement['external_package_sidecar_present'] is False
          assert supplement['external_package_digest_reconciled'] is False
          assert supplement['package_promotion_claim_authorized'] is False
          assert result['combined_known_folder_count'] == 93
          assert result['combined_scanned_folder_count'] == 10
          assert result['combined_unscanned_folder_count'] == 83
          assert result['combined_file_count'] == 64
          assert result['combined_content_hashed_count'] == 63
          assert result['combined_sensitive_item_count'] == 1
          assert result['combined_verified_github_equivalence_count'] == 1
          assert result['combined_governed_legacy_exception_count'] == 62
          assert result['enumeration_complete'] is False
          assert result['content_checksums_complete'] is False
          assert result['promotion_ready'] is False
          assert result['provider_writes'] == 0
          assert result['drive_retirement_authorized'] is False
          assert result['credential_action_authorized'] is False
          assert result['unreconciled_package_promotion_authorized'] is False
          PY
      - name: Create and verify mixed evidence checksums
        run: |
          (
            cd v700-drive-internal-package-evidence
            find . -type f ! -name INTERNAL_PACKAGE_EVIDENCE_CHECKSUMS.sha256 -print0 | sort -z |
              xargs -0 sha256sum > INTERNAL_PACKAGE_EVIDENCE_CHECKSUMS.sha256
            sha256sum -c INTERNAL_PACKAGE_EVIDENCE_CHECKSUMS.sha256
          )
      - name: Retain mixed Drive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v700-drive-internal-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: v700-drive-internal-package-evidence/
          if-no-files-found: warn
          retention-days: 90
