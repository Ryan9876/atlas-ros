name: v8.1.0 independent publication readback

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

env:
  TAG: v8.1.0
  PACKAGE_SOURCE_COMMIT: 8843a97e58efe46e632335df95487855b7971a75
  SOURCE_SHA256: f95eb2bcfc7875f6920061d9c5124c5be2cd5dc6dbbbce1cb671f5acdd1bec95
  WHEEL_SHA256: 97a3da1e1e239f5c8fd5af89b38a5c4c1005459e0fc77f830ba4915c6f81fa31
  SBOM_SHA256: e60407aea084ad55cd287bfbf4feb0f61ed6c80036e6b91128f33f8ae73a0d0e
  VALIDATION_SHA256: 2ef1adc95b3d9e3ec268484fa1ab26c097d52d12f3b6061895ac3501a2f4fafc
  CLARIFICATION_SHA256: df2558d519c4bdc1ee151c0c062b6a25768e5117df6cd1a95a4bdc2f0132a33f
  PACKAGE_INDEX_SHA256: 6356de75fac2ac3142f6939d10d55ac80afc7485b621a75c7148fc4e3f7da520
  SOURCE_TREE_SHA256: 6af181fa96e4147241d4c8527124225271f648e1e56d0dd1339a0e920b93fd18
  MANIFEST_SHA256: bd1cd4ad0ad64c3a77a562e55ca334abcfedb0382a640e4c961bbd85372cff43
  AUTHORIZATION_SHA256: 830cc61af8b81097253a07dc4402875fd56f06e2fdc137cee00603e65d675455

jobs:
  readback:
    if: github.event.release.tag_name == 'v8.1.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: v8.1.0
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Resolve live rollback authority and verify tag controls
        run: |
          set -euo pipefail
          test "$(git describe --exact-match --tags HEAD)" = "$TAG"
          test "$(sha256sum release/RELEASE_MANIFEST_V810.md | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          test "$(sha256sum release/V810_EXACT_PACKAGE_AUTHORIZATION.md | cut -d' ' -f1)" = "$AUTHORIZATION_SHA256"
          git fetch origin main:refs/remotes/origin/main --force
          git show origin/main:governance/AUTHORITY.json > LIVE_AUTHORITY.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          authority = json.loads(Path('LIVE_AUTHORITY.json').read_text())
          active = authority['active_release']
          rollback = authority['immediate_rollback']
          assert active['version'] == '8.0.0', 'publication readback occurs before v8.1 activation'
          assert active['immutable_commit'] == '6f05b24fd410ab1f00578019e5336185181ee265'
          assert rollback['version'] == '7.8.0'
          assert rollback['immutable_commit'] == '72974d1d7da9f07a4c8a41b73b22c0fae3770268'
          print(f"RESTORE_TAG={active['tag']}")
          print(f"RESTORE_COMMIT={active['immutable_commit']}")
          print(f"RESTORE_MANIFEST={active['manifest_path']}")
          print(f"RESTORE_MANIFEST_SHA256={active['manifest_sha256']}")
          print(f"RESTORE_SOURCE_SHA256={active['source_sha256']}")
          print(f"RESTORE_WHEEL_SHA256={active['wheel_sha256']}")
          print(f"HISTORICAL_TAG={rollback['tag']}")
          print(f"HISTORICAL_COMMIT={rollback['immutable_commit']}")
          PY

      - name: Download and verify published v8.1.0 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p readback clean-install
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir readback
          test "$(sha256sum readback/atlas_ros-8.1.0.tar.gz | cut -d' ' -f1)" = "$SOURCE_SHA256"
          test "$(sha256sum readback/atlas_ros-8.1.0-py3-none-any.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum readback/V810_SBOM.spdx.json | cut -d' ' -f1)" = "$SBOM_SHA256"
          test "$(sha256sum readback/V810_VALIDATION_RECEIPT.json | cut -d' ' -f1)" = "$VALIDATION_SHA256"
          test "$(sha256sum readback/V810_CLARIFICATION_EVIDENCE.json | cut -d' ' -f1)" = "$CLARIFICATION_SHA256"
          test "$(sha256sum readback/V810_PACKAGE_INDEX.json | cut -d' ' -f1)" = "$PACKAGE_INDEX_SHA256"
          test "$(sha256sum readback/SOURCE_TREE.txt | cut -d' ' -f1)" = "$SOURCE_TREE_SHA256"
          test "$(sha256sum readback/RELEASE_MANIFEST_V810.md | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          test "$(sha256sum readback/V810_EXACT_PACKAGE_AUTHORIZATION.md | cut -d' ' -f1)" = "$AUTHORIZATION_SHA256"
          sed 's#  dist/#  #' readback/CHECKSUMS.sha256 | (cd readback && sha256sum -c -)
          test "$(jq -r .candidate_commit readback/V810_VALIDATION_RECEIPT.json)" = "$PACKAGE_SOURCE_COMMIT"
          test "$(jq -r .provider_writes readback/V810_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .notion_writes readback/V810_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .todoist_writes readback/V810_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .production_schema_changes readback/V810_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .routing_allowed readback/V810_CLARIFICATION_EVIDENCE.json)" = "false"
          test "$(jq -r .execution_authorized readback/V810_CLARIFICATION_EVIDENCE.json)" = "false"

      - name: Verify clean source and wheel installations
        run: |
          set -euo pipefail
          for kind in sdist wheel; do
            package=readback/atlas_ros-8.1.0.tar.gz
            [ "$kind" = wheel ] && package=readback/atlas_ros-8.1.0-py3-none-any.whl
            python -m venv "clean-install/$kind"
            "clean-install/$kind/bin/python" -m pip install --disable-pip-version-check "$package"
            "clean-install/$kind/bin/python" -c "import atlas_ros; assert atlas_ros.__version__ == '8.1.0'"
            "clean-install/$kind/bin/atlas" status --json
            "clean-install/$kind/bin/atlas" verify --json
          done

      - name: Restore and verify v8.0.0 and historical v7.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$RESTORE_TAG")" = "$RESTORE_COMMIT"
          test "$(git rev-list -n 1 "$HISTORICAL_TAG")" = "$HISTORICAL_COMMIT"
          git show "$RESTORE_COMMIT:$RESTORE_MANIFEST" > readback/RESTORE_MANIFEST.md
          test "$(sha256sum readback/RESTORE_MANIFEST.md | cut -d' ' -f1)" = "$RESTORE_MANIFEST_SHA256"
          mkdir -p readback/rollback-v800 readback/historical-v780
          gh release download "$RESTORE_TAG" --repo "$GITHUB_REPOSITORY" --dir readback/rollback-v800
          gh release download "$HISTORICAL_TAG" --repo "$GITHUB_REPOSITORY" --dir readback/historical-v780
          test "$(sha256sum readback/rollback-v800/atlas_ros-8.0.0.tar.gz | cut -d' ' -f1)" = "$RESTORE_SOURCE_SHA256"
          test "$(sha256sum readback/rollback-v800/atlas_ros-8.0.0-py3-none-any.whl | cut -d' ' -f1)" = "$RESTORE_WHEEL_SHA256"
          git show "$HISTORICAL_COMMIT:release/RELEASE_MANIFEST_V780.md" > readback/HISTORICAL_MANIFEST.md
          historical_source="$(sed -n 's/^- Source distribution SHA-256: `\([0-9a-f]\{64\}\)`.*/\1/p' readback/HISTORICAL_MANIFEST.md)"
          historical_wheel="$(sed -n 's/^- Wheel SHA-256: `\([0-9a-f]\{64\}\)`.*/\1/p' readback/HISTORICAL_MANIFEST.md)"
          test -n "$historical_source"
          test -n "$historical_wheel"
          test "$(sha256sum readback/historical-v780/atlas_ros-7.8.0.tar.gz | cut -d' ' -f1)" = "$historical_source"
          test "$(sha256sum readback/historical-v780/atlas_ros-7.8.0-py3-none-any.whl | cut -d' ' -f1)" = "$historical_wheel"

      - name: Emit non-activating readback receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          receipt = {
              'schema_version': 'v810-publication-readback-v1',
              'tag': 'v8.1.0',
              'tag_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'package_source_commit': os.environ['PACKAGE_SOURCE_COMMIT'],
              'assets_verified': True,
              'clean_source_install': 'passed',
              'clean_wheel_install': 'passed',
              'rollback_v800_restoration': 'passed',
              'historical_v780_verification': 'passed',
              'production_schema_changes': 0,
              'authority_activated': False,
              'provider_writes': 0,
              'notion_writes': 0,
              'todoist_writes': 0,
          }
          Path('readback/V810_PUBLICATION_READBACK.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v810-independent-publication-readback-${{ github.run_id }}
          path: readback/V810_PUBLICATION_READBACK.json
          if-no-files-found: error
          retention-days: 90
