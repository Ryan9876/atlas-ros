name: v740-authority-activation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: v740-authority-activation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-canonical-authority:
    if: github.head_ref == 'release/v740-authority-activation'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Full-history checkout with immutable tags
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install validation environment
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate exact v7.4.0 authority transaction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/validate_v740_authority_activation.py
          gh release view v7.4.0 --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,url \
            > authority-activation-evidence/V740_RELEASE_READBACK.json
          gh release view v7.3.0 --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,url \
            > authority-activation-evidence/V730_ROLLBACK_READBACK.json
      - name: Retain authority activation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v740-authority-activation-${{ github.event.pull_request.head.sha }}
          path: authority-activation-evidence/
          if-no-files-found: error
          retention-days: 90
