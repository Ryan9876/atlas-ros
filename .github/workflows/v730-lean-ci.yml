name: v7.3.0 lean candidate CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'src/atlas_ros/contracts/operational_awareness/**'
      - 'src/atlas_ros/capabilities/operational_awareness/**'
      - 'src/atlas_ros/application/operational_awareness.py'
      - 'src/atlas_ros/application/command_lifecycle.py'
      - 'src/atlas_ros/planning/operational_awareness.py'
      - 'src/atlas_ros/ports/**'
      - 'src/atlas_ros/adapters/*operational_state.py'
      - 'src/atlas_ros/adapters/todoist_command_source.py'
      - 'src/atlas_ros/entry_points/awareness.py'
      - 'src/atlas_ros/entry_points/lifecycle.py'
      - 'src/atlas_ros/entry_points/main.py'
      - 'src/atlas_ros/policy/operational_awareness.py'
      - 'src/atlas_ros/data/operational-awareness.yaml'
      - 'schemas/operational-awareness/**'
      - 'schemas/policy/operational-awareness-policy-v1.schema.json'
      - 'governance/architecture.yaml'
      - 'governance/capability-catalog.yaml'
      - 'governance/contract-catalog.yaml'
      - 'governance/policy-catalog.yaml'
      - 'release/v730-*'
      - 'release/RELEASE_MANIFEST_V730_CANDIDATE.md'
      - 'scripts/*v730*'
      - 'tests/unit/test_v730_*'
      - 'tests/fixtures/operational-awareness/**'
      - '.github/workflows/v730-lean-ci.yml'
      - '.github/workflows/v730-full-validation.yml'
      - '.github/workflows/ci.yml'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: v730-lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  focused-validation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'agent/v730-operational-awareness-impl'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Shallow checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Install pinned CI environment
        run: python -m pip install --disable-pip-version-check -e '.[ci]'

      - name: Focused lint, architecture, and typing
        run: |
          set -euo pipefail
          ruff check \
            src/atlas_ros/contracts/operational_awareness \
            src/atlas_ros/capabilities/operational_awareness \
            src/atlas_ros/application/operational_awareness.py \
            src/atlas_ros/application/command_lifecycle.py \
            src/atlas_ros/planning/operational_awareness.py \
            src/atlas_ros/ports/operational_state.py \
            src/atlas_ros/ports/command_intake.py \
            src/atlas_ros/ports/provider_readback.py \
            src/atlas_ros/ports/lifecycle_planning.py \
            src/atlas_ros/adapters/notion_operational_state.py \
            src/atlas_ros/adapters/todoist_operational_state.py \
            src/atlas_ros/adapters/todoist_command_source.py \
            src/atlas_ros/entry_points/awareness.py \
            src/atlas_ros/entry_points/lifecycle.py \
            src/atlas_ros/policy/operational_awareness.py \
            scripts/validate_v730_notion_migration.py \
            scripts/benchmark_v730_operational_awareness.py \
            scripts/finalize_v730_package.py \
            scripts/validate_v730_candidate.py \
            tests/unit/test_v730_operational_awareness.py \
            tests/unit/test_v730_release_controls.py
          python scripts/validate_architecture.py
          mypy src

      - name: Contract, policy, migration, and focused tests
        run: |
          set -euo pipefail
          python - <<'PY'
          from atlas_ros.contracts.schemas import validate_contract_schemas
          findings = validate_contract_schemas()
          assert not findings, findings
          PY
          python scripts/validate_v730_notion_migration.py \
            --output lean-evidence/migration-validation.json
          pytest -q -o addopts='' \
            tests/unit/test_v730_operational_awareness.py \
            tests/unit/test_v730_release_controls.py
          python scripts/benchmark_v730_operational_awareness.py \
            --records 100 --iterations 5 \
            --output lean-evidence/performance.json

      - name: Retain lean evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v730-lean-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: lean-evidence/
          if-no-files-found: warn
          retention-days: 7

  apply-ruff-corrections:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/v730-operational-awareness-impl'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact development branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/v730-operational-awareness-impl
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Install pinned CI environment
        run: python -m pip install --disable-pip-version-check -e '.[ci]'

      - name: Apply and verify exact Ruff corrections
        run: |
          set -euo pipefail
          ruff check --fix \
            src/atlas_ros/contracts/operational_awareness \
            src/atlas_ros/capabilities/operational_awareness \
            src/atlas_ros/application/operational_awareness.py \
            src/atlas_ros/application/command_lifecycle.py \
            src/atlas_ros/planning/operational_awareness.py \
            src/atlas_ros/ports/operational_state.py \
            src/atlas_ros/ports/command_intake.py \
            src/atlas_ros/ports/provider_readback.py \
            src/atlas_ros/ports/lifecycle_planning.py \
            src/atlas_ros/adapters/notion_operational_state.py \
            src/atlas_ros/adapters/todoist_operational_state.py \
            src/atlas_ros/adapters/todoist_command_source.py \
            src/atlas_ros/entry_points/awareness.py \
            src/atlas_ros/entry_points/lifecycle.py \
            src/atlas_ros/policy/operational_awareness.py \
            scripts/validate_v730_notion_migration.py \
            scripts/benchmark_v730_operational_awareness.py \
            scripts/finalize_v730_package.py \
            scripts/validate_v730_candidate.py \
            tests/unit/test_v730_operational_awareness.py \
            tests/unit/test_v730_release_controls.py
          ruff check \
            src/atlas_ros/contracts/operational_awareness \
            src/atlas_ros/capabilities/operational_awareness \
            src/atlas_ros/application/operational_awareness.py \
            src/atlas_ros/application/command_lifecycle.py \
            src/atlas_ros/planning/operational_awareness.py \
            src/atlas_ros/ports/operational_state.py \
            src/atlas_ros/ports/command_intake.py \
            src/atlas_ros/ports/provider_readback.py \
            src/atlas_ros/ports/lifecycle_planning.py \
            src/atlas_ros/adapters/notion_operational_state.py \
            src/atlas_ros/adapters/todoist_operational_state.py \
            src/atlas_ros/adapters/todoist_command_source.py \
            src/atlas_ros/entry_points/awareness.py \
            src/atlas_ros/entry_points/lifecycle.py \
            src/atlas_ros/policy/operational_awareness.py \
            scripts/validate_v730_notion_migration.py \
            scripts/benchmark_v730_operational_awareness.py \
            scripts/finalize_v730_package.py \
            scripts/validate_v730_candidate.py \
            tests/unit/test_v730_operational_awareness.py \
            tests/unit/test_v730_release_controls.py
          python - <<'PYFIX'
          from pathlib import Path

          root = Path('.')

          path = root / 'src/atlas_ros/contracts/operational_awareness/base.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        unsigned = cls.model_construct(**values, **{cls.digest_field: "0" * 64})\n'
              '        return sha256_digest(unsigned.digest_payload())\n',
              '        unsigned_values = dict(values)\n'
              '        unsigned_values[cls.digest_field] = "0" * 64\n'
              '        unsigned = cls.model_construct(**unsigned_values)\n'
              '        return sha256_digest(unsigned.digest_payload())\n',
          )
          text = text.replace(
              '    def verify_digest(self) -> bool:\n'
              '        return getattr(self, self.digest_field) == self.expected_digest()\n',
              '    def verify_digest(self) -> bool:\n'
              '        return bool(getattr(self, self.digest_field) == self.expected_digest())\n',
          )
          path.write_text(text, encoding='utf-8')

          path = root / 'src/atlas_ros/capabilities/operational_awareness/work_graph_hygiene/engine.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '            common = {\n'
              '                "affected_records": (record.record_ref,),\n'
              '                "confidence": ConfidenceAssessment(\n'
              '                    score=1.0, rationale="deterministic invariant evaluation"\n'
              '                ),\n'
              '                "protected_record_status": protected,\n'
              '            }\n',
              '            affected_records = (record.record_ref,)\n'
              '            confidence = ConfidenceAssessment(\n'
              '                score=1.0, rationale="deterministic invariant evaluation"\n'
              '            )\n',
          )
          text = text.replace(
              '                        **common,\n',
              '                        affected_records=affected_records,\n'
              '                        confidence=confidence,\n'
              '                        protected_record_status=protected,\n',
          )
          path.write_text(text, encoding='utf-8')

          path = root / 'src/atlas_ros/capabilities/operational_awareness/commitments/engine.py'
          text = path.read_text(encoding='utf-8').replace(
              '        elif overdue and estimate.effective_state != EffectiveWorkState.COMPLETED:\n',
              '        elif overdue:\n',
          )
          path.write_text(text, encoding='utf-8')

          path = root / 'src/atlas_ros/entry_points/awareness.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        service = ExecutionContextService(policy)\n'
              '        value = (\n'
              '            service.build(snapshot, states, record_id=args.record_reference)\n'
              '            if args.command == "context"\n'
              '            else service.resume(snapshot, states, record_id=args.record_reference)\n',
              '        context_service = ExecutionContextService(policy)\n'
              '        value = (\n'
              '            context_service.build(snapshot, states, record_id=args.record_reference)\n'
              '            if args.command == "context"\n'
              '            else context_service.resume(snapshot, states, record_id=args.record_reference)\n',
          )
          text = text.replace(
              '    service = WorkGraphHygieneService(policy)\n'
              '    findings = service.scan(snapshot, states)\n',
              '    hygiene_service = WorkGraphHygieneService(policy)\n'
              '    findings = hygiene_service.scan(snapshot, states)\n',
          )
          text = text.replace(
              '    _emit(service.propose(finding), output_format=args.format)\n',
              '    _emit(hygiene_service.propose(finding), output_format=args.format)\n',
          )
          path.write_text(text, encoding='utf-8')
          PYFIX
          ruff check \
            src/atlas_ros/contracts/operational_awareness \
            src/atlas_ros/capabilities/operational_awareness \
            src/atlas_ros/entry_points/awareness.py
          python scripts/validate_architecture.py
          mypy src
          PYTHONPATH=src:. pytest -q -o addopts='' \
            tests/unit/test_v730_operational_awareness.py \
            tests/unit/test_v730_release_controls.py

      - name: Commit source-only quality corrections
        run: |
          set -euo pipefail
          git config user.name 'atlas-ros-bot'
          git config user.email 'atlas-ros-bot@users.noreply.github.com'
          git add -u -- ':!.github/workflows/**'
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing to commit workflow changes.' >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'No source corrections required.'
            exit 0
          fi
          git commit -m 'fix: satisfy v7.3.0 lean quality gate'
          git push origin HEAD:agent/v730-operational-awareness-impl

