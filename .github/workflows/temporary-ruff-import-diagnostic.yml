name: temporary-ruff-import-diagnostic

on:
  pull_request:
    branches: [main]

concurrency:
  group: temporary-ruff-import-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emit-import-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check 'ruff==0.12.12'
      - name: Emit Ruff import patch
        run: |
          ruff check --select I --diff \
            tests/unit/test_current_drive_authority.py \
            tests/unit/test_pre_v6_deletion_plan.py \
            tests/unit/test_pre_v6_exclusion_review.py \
            | tee ruff-import-fix.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporary-ruff-import-fix
          path: ruff-import-fix.patch
          if-no-files-found: error
          retention-days: 1
