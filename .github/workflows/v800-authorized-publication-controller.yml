name: v8.0.0 authorized publication controller

on:
  push:
    branches: [main]
    paths:
      - release/V800_PUBLICATION_TRIGGER.json

permissions:
  contents: write
  actions: read

concurrency:
  group: v800-authorized-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-release
    env:
      TAG: v8.0.0
      TARGET_COMMIT: ${{ github.sha }}
      PACKAGE_SOURCE_COMMIT: 674f0c979dec8f83a1610c7435e633e2d33e673a
      IMPLEMENTATION_MERGE: b3283850c1bfb025b472f2e9e055317cc3a05f7d
      CANDIDATE_ARTIFACT_ID: '8772036696'
      CANDIDATE_ARTIFACT_DIGEST: sha256:9202086b86df6f727daa097d476a82099ebdbd97e8e85aa433160cb8f40464ea
      EVIDENCE_ARTIFACT_ID: '8771997275'
      EVIDENCE_ARTIFACT_DIGEST: sha256:e480e5f2ecda736fdabae36e71fba3a8628e1b9e7240085a24fc8a6eda999f95
      SOURCE_SHA256: 2bfd6fda0879b9508809bdb28a41f43a664bee1098ce3325b3574223cd864047
      WHEEL_SHA256: 0a308d4b4d23a86b99fe66a1e17b89340ff5ab84091b9eca277f461d13f8f8a5
      SBOM_SHA256: 65c8642671b1729bb775540d7bcdb5af05d14659d39169c940b8c13b5a14d9ec
      SOURCE_MANIFEST_SHA256: 667774768014e45fb821964d2c78f8225b34f74869e7e5cb7398b1d7bb79cc05
      SOURCE_TREE_SHA256: a4c0ee2e4222979cbca4939fb38a405168b531f0bd6527574fe60d70205e9d8d
      VALIDATION_SHA256: 49bf52c882ca99cefe9b7a3fdf02c0578124c2771c1dde59aa729534e2d6f5dd
      MIGRATION_RECEIPT_SHA256: a87ed0b2b13bb1ebb84ec4f390bf872c777898f9dca3e365940d5aaf6bbc304a
      PROVIDER_DRY_RUN_SHA256: cab1a56b57350f5ba4d5e70d31a1917b24e712a4a310097aaf638f06ae5b7212
      PACKAGE_INDEX_SHA256: 48337c17c1ea56560bd87e90479ad9a8e3e079d5ad8cd51f84303252db523b08
      RELEASE_MANIFEST_SHA256: fd84ef9386f471873c3943074d356ea2e6ba2278e00762c544efec38c9de1699
      AUTHORIZATION_SHA256: b9ee50cbf4958bd22075d4247e92635d12af8a70d5f7ea5bf9e1d4640f20f439
      DECISION_ID: V4D-61
      REVIEW_ID: V4V-111
      MIGRATION_DIGEST: d153491cf626aa6628e186faf84b9643bf9f3f491a272c18df30e5d6916de5c9
    steps:
      - name: Checkout exact publication transaction
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_COMMIT }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify live prepublication authority and exact controls
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(sha256sum release/RELEASE_MANIFEST_V800.md | cut -d' ' -f1)" = "$RELEASE_MANIFEST_SHA256"
          test "$(sha256sum release/V800_EXACT_PACKAGE_AUTHORIZATION.md | cut -d' ' -f1)" = "$AUTHORIZATION_SHA256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          authority = json.loads(Path('governance/AUTHORITY.json').read_text())
          assert authority['active_release']['version'] == '7.8.0'
          assert authority['active_release']['immutable_commit'] == '72974d1d7da9f07a4c8a41b73b22c0fae3770268'
          assert authority['immediate_rollback']['version'] == '7.7.0'
          assert authority['immediate_rollback']['immutable_commit'] == '71d849b77a53b8f0ba5a9379ff45b44869756819'
          trigger = json.loads(Path('release/V800_PUBLICATION_TRIGGER.json').read_text())
          assert trigger == {
              'authorization_sha256': os.environ['AUTHORIZATION_SHA256'],
              'candidate_artifact_id': int(os.environ['CANDIDATE_ARTIFACT_ID']),
              'candidate_artifact_sha256': os.environ['CANDIDATE_ARTIFACT_DIGEST'].removeprefix('sha256:'),
              'decision_id': os.environ['DECISION_ID'],
              'evidence_artifact_id': int(os.environ['EVIDENCE_ARTIFACT_ID']),
              'evidence_artifact_sha256': os.environ['EVIDENCE_ARTIFACT_DIGEST'].removeprefix('sha256:'),
              'implementation_merge': os.environ['IMPLEMENTATION_MERGE'],
              'migration_digest': os.environ['MIGRATION_DIGEST'],
              'package_source_commit': os.environ['PACKAGE_SOURCE_COMMIT'],
              'release_manifest_sha256': os.environ['RELEASE_MANIFEST_SHA256'],
              'review_id': os.environ['REVIEW_ID'],
              'schema_version': 'v800-publication-trigger-v1',
              'tag': 'v8.0.0',
          }
          manifest = Path('release/RELEASE_MANIFEST_V800.md').read_text()
          authorization = Path('release/V800_EXACT_PACKAGE_AUTHORIZATION.md').read_text()
          required = (
              os.environ['PACKAGE_SOURCE_COMMIT'], os.environ['IMPLEMENTATION_MERGE'],
              os.environ['CANDIDATE_ARTIFACT_ID'], os.environ['CANDIDATE_ARTIFACT_DIGEST'].removeprefix('sha256:'),
              os.environ['EVIDENCE_ARTIFACT_ID'], os.environ['EVIDENCE_ARTIFACT_DIGEST'].removeprefix('sha256:'),
              os.environ['SOURCE_SHA256'], os.environ['WHEEL_SHA256'], os.environ['SBOM_SHA256'],
              os.environ['SOURCE_MANIFEST_SHA256'], os.environ['SOURCE_TREE_SHA256'],
              os.environ['VALIDATION_SHA256'], os.environ['MIGRATION_RECEIPT_SHA256'],
              os.environ['PROVIDER_DRY_RUN_SHA256'], os.environ['PACKAGE_INDEX_SHA256'],
              os.environ['DECISION_ID'], os.environ['REVIEW_ID'], os.environ['MIGRATION_DIGEST'],
          )
          for value in required:
              assert value in manifest, value
              assert value in authorization, value
          PY

      - name: Download and verify exact retained artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p publication/candidate publication/evidence
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}" --jq .digest)" = "$CANDIDATE_ARTIFACT_DIGEST"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT_ID}" --jq .digest)" = "$EVIDENCE_ARTIFACT_DIGEST"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" > publication/candidate.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT_ID}/zip" > publication/evidence.zip
          test "$(sha256sum publication/candidate.zip | cut -d' ' -f1)" = "${CANDIDATE_ARTIFACT_DIGEST#sha256:}"
          test "$(sha256sum publication/evidence.zip | cut -d' ' -f1)" = "${EVIDENCE_ARTIFACT_DIGEST#sha256:}"
          unzip -q publication/candidate.zip -d publication/candidate
          unzip -q publication/evidence.zip -d publication/evidence
          test "$(cat publication/candidate/build/SOURCE_COMMIT.txt)" = "$PACKAGE_SOURCE_COMMIT"
          test "$(cat publication/evidence/SOURCE_COMMIT.txt)" = "$PACKAGE_SOURCE_COMMIT"
          test "$(cat publication/candidate/build/BUILD_COUNT.txt)" = "1"
          test "$(sha256sum publication/candidate/dist/atlas_ros-8.0.0.tar.gz | cut -d' ' -f1)" = "$SOURCE_SHA256"
          test "$(sha256sum publication/candidate/dist/atlas_ros-8.0.0-py3-none-any.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum publication/candidate/build/V800_VALIDATION_RECEIPT.json | cut -d' ' -f1)" = "$VALIDATION_SHA256"
          test "$(sha256sum publication/candidate/build/V800_MIGRATION_RECEIPT.json | cut -d' ' -f1)" = "$MIGRATION_RECEIPT_SHA256"
          test "$(sha256sum publication/candidate/build/V800_PROVIDER_DRY_RUN.json | cut -d' ' -f1)" = "$PROVIDER_DRY_RUN_SHA256"
          test "$(sha256sum publication/candidate/build/PACKAGE_CHECKSUMS.sha256 | cut -d' ' -f1)" = "$PACKAGE_INDEX_SHA256"
          test "$(sha256sum publication/evidence/V800_SBOM.spdx.json | cut -d' ' -f1)" = "$SBOM_SHA256"
          test "$(sha256sum publication/evidence/V800_SOURCE_MANIFEST.json | cut -d' ' -f1)" = "$SOURCE_MANIFEST_SHA256"
          test "$(sha256sum publication/evidence/SOURCE_TREE.txt | cut -d' ' -f1)" = "$SOURCE_TREE_SHA256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path('publication/candidate/build/V800_VALIDATION_RECEIPT.json').read_text())
          assert receipt['candidate_commit'] == os.environ['PACKAGE_SOURCE_COMMIT']
          assert receipt['version'] == '8.0.0'
          assert receipt['build_count'] == 1
          assert receipt['provider_writes'] == 0
          assert receipt['notion_writes'] == 0
          assert receipt['todoist_writes'] == 0
          assert receipt['migration_status'] == 'validated_unapplied'
          assert receipt['active_restoration'] == 'passed'
          assert receipt['rollback_restoration'] == 'passed'
          migration = json.loads(Path('publication/candidate/build/V800_MIGRATION_RECEIPT.json').read_text())
          assert migration['migration_digest'] == os.environ['MIGRATION_DIGEST']
          assert migration['status'] == 'validated_unapplied'
          assert migration['destructive_operations'] == 0
          assert migration['live_writes'] == 0
          assert migration['production_apply_authorized'] is False
          dry = json.loads(Path('publication/candidate/build/V800_PROVIDER_DRY_RUN.json').read_text())
          assert dry['provider_writes'] == dry['notion_writes'] == dry['todoist_writes'] == 0
          sbom = json.loads(Path('publication/evidence/V800_SBOM.spdx.json').read_text())
          source = json.loads(Path('publication/evidence/V800_SOURCE_MANIFEST.json').read_text())
          assert sbom['spdxVersion'] == 'SPDX-2.3'
          assert sbom['documentNamespace'].endswith(os.environ['PACKAGE_SOURCE_COMMIT'])
          assert source['source_commit'] == os.environ['PACKAGE_SOURCE_COMMIT']
          PY

      - name: Confirm tag and release do not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! git rev-parse "$TAG" >/dev/null 2>&1
          ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1

      - name: Publish immutable tag and GitHub Release without rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Atlas ROS Release Bot"
          git config user.email "atlas-ros-release@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_COMMIT" -m "Atlas ROS v8.0.0 immutable deterministic delegation release"
          git push origin "refs/tags/$TAG"
          cp release/RELEASE_MANIFEST_V800.md publication/RELEASE_MANIFEST_V800.md
          cp release/V800_EXACT_PACKAGE_AUTHORIZATION.md publication/V800_EXACT_PACKAGE_AUTHORIZATION.md
          cp publication/candidate/build/PACKAGE_CHECKSUMS.sha256 publication/CHECKSUMS.sha256
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$TARGET_COMMIT" \
            --title "Atlas ROS v8.0.0" --notes-file release/RELEASE_MANIFEST_V800.md \
            publication/candidate.zip publication/evidence.zip \
            publication/candidate/dist/atlas_ros-8.0.0.tar.gz \
            publication/candidate/dist/atlas_ros-8.0.0-py3-none-any.whl \
            publication/candidate/build/V800_VALIDATION_RECEIPT.json \
            publication/candidate/build/V800_MIGRATION_RECEIPT.json \
            publication/candidate/build/V800_PROVIDER_DRY_RUN.json \
            publication/evidence/V800_SBOM.spdx.json \
            publication/evidence/V800_SOURCE_MANIFEST.json \
            publication/evidence/SOURCE_TREE.txt \
            publication/RELEASE_MANIFEST_V800.md \
            publication/V800_EXACT_PACKAGE_AUTHORIZATION.md \
            publication/CHECKSUMS.sha256
