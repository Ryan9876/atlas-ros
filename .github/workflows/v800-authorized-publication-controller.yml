name: v8.0.0 authorized immutable publication

on:
  workflow_dispatch:
    inputs:
      exact_source_commit:
        description: Exact validated source commit
        required: true
        type: string
      candidate_run_id:
        description: Full candidate workflow run ID
        required: true
        type: string
      candidate_artifact_name:
        description: Exact retained candidate artifact name
        required: true
        type: string
      evidence_run_id:
        description: Evidence-completion workflow run ID
        required: true
        type: string
      evidence_artifact_name:
        description: Exact retained evidence artifact name
        required: true
        type: string
      governing_decision:
        description: Governing Decision identity
        required: true
        type: string
      acceptance_review:
        description: Passed Acceptance Review identity
        required: true
        type: string
      authorization_record_sha256:
        description: SHA-256 of finalized exact-package authorization record
        required: true
        type: string

concurrency:
  group: v800-immutable-publication
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  RELEASE_TAG: v8.0.0

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.exact_source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact finalized authorization
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.exact_source_commit }}"
          test -f release/V800_EXACT_PACKAGE_AUTHORIZATION.md
          ! grep -q 'PENDING' release/V800_EXACT_PACKAGE_AUTHORIZATION.md
          printf '%s  %s\n' "${{ inputs.authorization_record_sha256 }}" release/V800_EXACT_PACKAGE_AUTHORIZATION.md | sha256sum -c -
          grep -F "${{ inputs.exact_source_commit }}" release/V800_EXACT_PACKAGE_AUTHORIZATION.md
          grep -F "${{ inputs.governing_decision }}" release/V800_EXACT_PACKAGE_AUTHORIZATION.md
          grep -F "${{ inputs.acceptance_review }}" release/V800_EXACT_PACKAGE_AUTHORIZATION.md
      - name: Download retained exact artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p candidate evidence publish
          gh run download "${{ inputs.candidate_run_id }}" --name "${{ inputs.candidate_artifact_name }}" --dir candidate
          gh run download "${{ inputs.evidence_run_id }}" --name "${{ inputs.evidence_artifact_name }}" --dir evidence
          test "$(cat candidate/build/SOURCE_COMMIT.txt)" = "${{ inputs.exact_source_commit }}"
          test "$(cat candidate/build/BUILD_COUNT.txt)" = "1"
          test "$(jq -r .provider_writes candidate/build/V800_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .publication_authorized candidate/build/V800_VALIDATION_RECEIPT.json)" = "false"
          cp candidate/dist/atlas_ros-8.0.0.tar.gz publish/
          cp candidate/dist/atlas_ros-8.0.0-py3-none-any.whl publish/
          cp evidence/V800_SBOM.spdx.json publish/
          cp evidence/V800_SOURCE_MANIFEST.json publish/
          cp candidate/build/PACKAGE_CHECKSUMS.sha256 publish/CHECKSUMS.sha256
          cp release/RELEASE_MANIFEST_V800.md publish/
          (cd publish && sed 's#  dist/#  #' CHECKSUMS.sha256 | sha256sum -c -)
      - name: Confirm tag and release do not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1
          ! gh release view "$RELEASE_TAG" >/dev/null 2>&1
      - name: Publish immutable tag and GitHub Release without rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a "$RELEASE_TAG" "${{ inputs.exact_source_commit }}" -m "Atlas ROS v8.0.0 exact package"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" publish/* --verify-tag --title "Atlas ROS v8.0.0" --notes-file release/RELEASE_MANIFEST_V800.md

# Publication does not activate production authority. This workflow contains no
# authority, Notion schema, Todoist, messaging, calendar, credential, or deletion action.
