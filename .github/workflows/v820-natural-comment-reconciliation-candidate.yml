name: v8.2.0 natural comment reconciliation candidate

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact frozen candidate commit SHA
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: v820-natural-comment-${{ github.event.pull_request.number || inputs.candidate_commit || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  CANDIDATE_COMMIT: ${{ inputs.candidate_commit || github.event.pull_request.head.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  fix-restoration-exports:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/v8.2.0-natural-comment-reconciliation' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Export live restoration variables to receipt subprocesses
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/v820_candidate_validate.sh')
          text = path.read_text()
          old_active = 'source build/RESTORATION_ENV\n\ngit merge-base --is-ancestor'
          new_active = 'set -a\nsource build/RESTORATION_ENV\nset +a\n\ngit merge-base --is-ancestor'
          old_rollback = 'source build/ROLLBACK_PACKAGE_ENV\n\nactive_dir='
          new_rollback = 'set -a\nsource build/ROLLBACK_PACKAGE_ENV\nset +a\n\nactive_dir='
          if text.count(old_active) != 1:
              raise RuntimeError('active restoration source statement not found exactly once')
          if text.count(old_rollback) != 1:
              raise RuntimeError('rollback restoration source statement not found exactly once')
          text = text.replace(old_active, new_active, 1)
          text = text.replace(old_rollback, new_rollback, 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit exported restoration variables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v820_candidate_validate.sh
          git commit -m "Export v8.2.0 restoration receipt variables"
          git push origin HEAD:agent/v8.2.0-natural-comment-reconciliation

  lean:
    if: github.event_name == 'pull_request' && github.event.action != 'ready_for_review'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[ci]'
      - run: bash scripts/v820_validation_entrypoint.sh lean

  full-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'ready_for_review' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/v8.2.0-natural-comment-reconciliation')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.candidate_commit || github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: bash scripts/v820_validation_entrypoint.sh full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v820-candidate-${{ env.CANDIDATE_COMMIT }}
          path: |
            dist/
            build/
            release/RELEASE_MANIFEST_V820_DRAFT.md
            release/V820_FULL_VALIDATION_PLAN.md
            release/V820_SCHEMA_AND_MIGRATION_ASSESSMENT.md
            release/V820_EXACT_PACKAGE_AUTHORIZATION_TEMPLATE.md
          if-no-files-found: error
          retention-days: 90
