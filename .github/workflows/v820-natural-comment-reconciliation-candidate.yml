name: v8.2.0 natural comment reconciliation candidate

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact frozen candidate commit SHA
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: v820-natural-comment-${{ github.event.pull_request.number || inputs.candidate_commit || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  CANDIDATE_COMMIT: ${{ inputs.candidate_commit || github.event.pull_request.head.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  fix-restoration-controller:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/v8.2.0-natural-comment-reconciliation' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Replace opaque restoration assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/v820_candidate_validate.sh')
          text = path.read_text()
          old = '''  "clean-install/$kind/bin/atlas" status --json > "build/${kind}-status.json"
  "clean-install/$kind/bin/atlas" verify --json > "build/${kind}-verify.json"
done

git fetch --no-tags origin main:refs/remotes/origin/main
git show origin/main:governance/AUTHORITY.json > build/LIVE_AUTHORITY.json
python - <<'PY'
import json
from pathlib import Path
authority = json.loads(Path('build/LIVE_AUTHORITY.json').read_text())
active = authority['active_release']
rollback = authority['immediate_rollback']
assert active['status'] == 'Active'
for field in ('version', 'tag', 'immutable_commit', 'manifest_path', 'manifest_sha256'):
    assert active.get(field), (field, active)
for field in ('version', 'tag', 'immutable_commit'):
    assert rollback.get(field), (field, rollback)
assert active['immutable_commit'] != rollback['immutable_commit']
for key, value in {
    'ACTIVE_VERSION': active['version'],
    'ACTIVE_TAG': active['tag'],
    'ACTIVE_COMMIT': active['immutable_commit'],
    'ACTIVE_MANIFEST_PATH': active['manifest_path'],
    'ACTIVE_MANIFEST_SHA256': active['manifest_sha256'],
    'ACTIVE_SOURCE_SHA256': active['source_sha256'],
    'ACTIVE_WHEEL_SHA256': active['wheel_sha256'],
    'ROLLBACK_VERSION': rollback['version'],
    'ROLLBACK_TAG': rollback['tag'],
    'ROLLBACK_COMMIT': rollback['immutable_commit'],
}.items():
    print(f'{key}={value}')
PY
source build/RESTORATION_ENV
'''
          new = '''  echo "v820_stage=${kind}_installed_status"
  "clean-install/$kind/bin/atlas" status --json > "build/${kind}-status.json"
  echo "v820_stage=${kind}_installed_verify"
  "clean-install/$kind/bin/atlas" verify --json > "build/${kind}-verify.json"
done

echo "v820_stage=clean_install_complete"
echo "v820_stage=authority_restoration_resolution"
git fetch --no-tags origin main:refs/remotes/origin/main
git show origin/main:governance/AUTHORITY.json > build/LIVE_AUTHORITY.json
python - <<'PY' > build/RESTORATION_ENV
import json
from pathlib import Path


def require_text(mapping: dict[str, object], field: str, scope: str) -> str:
    value = mapping.get(field)
    if not isinstance(value, str) or not value.strip():
        raise RuntimeError(f'missing or invalid {scope}.{field}: {value!r}')
    return value


authority = json.loads(Path('build/LIVE_AUTHORITY.json').read_text())
active = authority.get('active_release')
rollback = authority.get('immediate_rollback')
if not isinstance(active, dict):
    raise RuntimeError('live authority active_release is missing or invalid')
if not isinstance(rollback, dict):
    raise RuntimeError('live authority immediate_rollback is missing or invalid')
if active.get('status') != 'Active':
    raise RuntimeError(f"live active release status is not Active: {active.get('status')!r}")
values = {
    'ACTIVE_VERSION': require_text(active, 'version', 'active_release'),
    'ACTIVE_TAG': require_text(active, 'tag', 'active_release'),
    'ACTIVE_COMMIT': require_text(active, 'immutable_commit', 'active_release'),
    'ACTIVE_MANIFEST_PATH': require_text(active, 'manifest_path', 'active_release'),
    'ACTIVE_MANIFEST_SHA256': require_text(active, 'manifest_sha256', 'active_release'),
    'ACTIVE_SOURCE_SHA256': require_text(active, 'source_sha256', 'active_release'),
    'ACTIVE_WHEEL_SHA256': require_text(active, 'wheel_sha256', 'active_release'),
    'ROLLBACK_VERSION': require_text(rollback, 'version', 'immediate_rollback'),
    'ROLLBACK_TAG': require_text(rollback, 'tag', 'immediate_rollback'),
    'ROLLBACK_COMMIT': require_text(rollback, 'immutable_commit', 'immediate_rollback'),
}
if values['ACTIVE_COMMIT'] == values['ROLLBACK_COMMIT']:
    raise RuntimeError('active and immediate rollback commits are identical')
for key, value in values.items():
    print(f'{key}={value}')
PY
echo "v820_stage=authority_restoration_resolved"
source build/RESTORATION_ENV
'''
          if text.count(old) != 1:
              raise RuntimeError('expected restoration controller block not found exactly once')
          path.write_text(text.replace(old, new, 1))
          Path('release/V820_RESTORATION_CONTROLLER_TRIGGER').unlink(missing_ok=True)
          PY
          git diff --check
      - name: Commit diagnostic restoration controller
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v820_candidate_validate.sh release/V820_RESTORATION_CONTROLLER_TRIGGER
          git commit -m "Make v8.2.0 restoration validation diagnostic"
          git push origin HEAD:agent/v8.2.0-natural-comment-reconciliation

  lean:
    if: github.event_name == 'pull_request' && github.event.action != 'ready_for_review'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[ci]'
      - run: bash scripts/v820_validation_entrypoint.sh lean

  full-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'ready_for_review' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/v8.2.0-natural-comment-reconciliation')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.candidate_commit || github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: bash scripts/v820_validation_entrypoint.sh full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v820-candidate-${{ env.CANDIDATE_COMMIT }}
          path: |
            dist/
            build/
            release/RELEASE_MANIFEST_V820_DRAFT.md
            release/V820_FULL_VALIDATION_PLAN.md
            release/V820_SCHEMA_AND_MIGRATION_ASSESSMENT.md
            release/V820_EXACT_PACKAGE_AUTHORIZATION_TEMPLATE.md
          if-no-files-found: error
          retention-days: 90
