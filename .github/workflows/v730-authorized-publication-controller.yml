name: v730-authorized-publication-controller

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main]

concurrency:
  group: v730-authorized-publication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-publication-controller:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v730-authorized-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install validation tooling
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate controller and rehearse exact publication
        env: &publication-env
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          FINAL_MANIFEST_COMMIT: 51fdeefda8330c8e11bd74336d5f6a569a78e789
          PACKAGE_SOURCE_COMMIT: 3082a8c4b4124167b5b5219a943a519fdfd63779
          FINAL_ARTIFACT_ID: '8709808300'
          FINAL_ARTIFACT_DIGEST: sha256:690f28b097e4b01b94388e765029eb18f49ddd7d78e724c45c107b0cd449f388
          EXPECTED_SOURCE_SHA256: 6e152ca6f5c1cd1644937ed9eea6582966f18bb3e558ec6c851fa2c7a6c6306e
          EXPECTED_WHEEL_SHA256: 5be3ea8af13e70d7bf2e2fa54fc07532d8182c90ee1121e3a881c4214f7a3890
          EXPECTED_SBOM_SHA256: 3c7c729cbeeeeff322d5940aeed0d3ef5c501e88b1094f2947f33185e281bc99
          EXPECTED_SOURCE_MANIFEST_SHA256: 58858c92825cdca7c48d91b358953392a5e8da451b4fa4555dc1aacde97b9180
          EXPECTED_PACKAGE_MANIFEST_DIGEST: eef7451b019f5a6c8de2c8daffb089d03fdbbce5178e3657cfdb1d56a23ca195
          DECISION_URL: https://app.notion.com/p/3acb8344ad2c816e9e81ca692886a87c
          PACKAGE_REVIEW_URL: https://app.notion.com/p/3acb8344ad2c816d9f14df4609dc0431
          PREPUBLICATION_REVIEW_URL: https://app.notion.com/p/3acb8344ad2c81999f32f2eacad9e1e7
          RELEASE_TAG: v7.3.0
          ROLLBACK_TAG: v7.1.1
          PUBLISH: 'false'
        run: |
          set -euo pipefail
          bash -n scripts/publish_v730_final.sh
          python scripts/validate_architecture.py
          python scripts/validate_legacy_isolation.py
          bash scripts/publish_v730_final.sh
      - name: Retain controller rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v730-publication-controller-${{ github.event.pull_request.head.sha }}
          path: |
            final-publication/
            final-evidence/
          if-no-files-found: warn
          retention-days: 90

  publish-v730-final:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      startsWith(github.event.head_commit.message,
      'release: execute exact Atlas ROS v7.3.0 publication')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Publish immutable release and perform initial readback
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          FINAL_MANIFEST_COMMIT: 51fdeefda8330c8e11bd74336d5f6a569a78e789
          PACKAGE_SOURCE_COMMIT: 3082a8c4b4124167b5b5219a943a519fdfd63779
          FINAL_ARTIFACT_ID: '8709808300'
          FINAL_ARTIFACT_DIGEST: sha256:690f28b097e4b01b94388e765029eb18f49ddd7d78e724c45c107b0cd449f388
          EXPECTED_SOURCE_SHA256: 6e152ca6f5c1cd1644937ed9eea6582966f18bb3e558ec6c851fa2c7a6c6306e
          EXPECTED_WHEEL_SHA256: 5be3ea8af13e70d7bf2e2fa54fc07532d8182c90ee1121e3a881c4214f7a3890
          EXPECTED_SBOM_SHA256: 3c7c729cbeeeeff322d5940aeed0d3ef5c501e88b1094f2947f33185e281bc99
          EXPECTED_SOURCE_MANIFEST_SHA256: 58858c92825cdca7c48d91b358953392a5e8da451b4fa4555dc1aacde97b9180
          EXPECTED_PACKAGE_MANIFEST_DIGEST: eef7451b019f5a6c8de2c8daffb089d03fdbbce5178e3657cfdb1d56a23ca195
          DECISION_URL: https://app.notion.com/p/3acb8344ad2c816e9e81ca692886a87c
          PACKAGE_REVIEW_URL: https://app.notion.com/p/3acb8344ad2c816d9f14df4609dc0431
          PREPUBLICATION_REVIEW_URL: https://app.notion.com/p/3acb8344ad2c81999f32f2eacad9e1e7
          RELEASE_TAG: v7.3.0
          ROLLBACK_TAG: v7.1.1
          PUBLISH: 'true'
        run: bash scripts/publish_v730_final.sh
      - name: Retain final publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v730-final-publication-${{ github.sha }}
          path: |
            final-publication/
            final-evidence/
            release-readback/
          if-no-files-found: warn
          retention-days: 90
