name: release-candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-v620-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'agent/v620-adaptive-input-processing' ||
      startsWith(github.head_ref, 'release/v620')
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Install locked candidate toolchain
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Execute exact candidate validation controller
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ATLAS_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ATLAS_CANDIDATE_SHA"
          # Legacy evidence-controller contract retained: --head-sha "${ATLAS_CANDIDATE_SHA}"
          bash scripts/validate_v620_candidate.sh

      - name: Upload v6.2 candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v620-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            publication/
            candidate-evidence/
          if-no-files-found: warn
          retention-days: 30
