name: v710-authorized-publication-controller

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main]

concurrency:
  group: v710-authorized-publication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-publication-controller:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v710-authorized-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate controller source and security
        run: |
          set -euo pipefail
          ruff check .
          python scripts/validate_architecture.py
          python scripts/validate_legacy_isolation.py
          python scripts/validate_dependency_lock.py requirements.runtime.lock
          python scripts/validate_vulnerability_exceptions.py
          mypy src
          pytest
          python scripts/evaluate_execution_planning.py \
            --dataset benchmarks/execution-planning-v1.json \
            --output v710-publication-controller-execution-planning.json
          python scripts/scan_candidate_secrets.py \
            --root . \
            --output v710-publication-controller-secret-scan.json
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service pypi \
            --requirement requirements.runtime.lock --format json \
            --output v710-publication-controller-pypi.json
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service osv \
            --requirement requirements.runtime.lock --format json \
            --output v710-publication-controller-osv.json
          python scripts/evaluate_dependency_audit.py \
            v710-publication-controller-pypi.json \
            v710-publication-controller-osv.json
      - name: Rehearse exact authorized publication without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          FINAL_SOURCE_COMMIT: 0711b045f34f5ab7b03f7a61bc80653e0d815463
          FINAL_ARTIFACT_ID: '8700442825'
          FINAL_ARTIFACT_DIGEST: bb1d2a735ef6c175dd5a41fda067c8d1301883eaa9d413b38fa56346ae8fa483
          EXPECTED_SOURCE_SHA256: fb69bef625125bf477bb3dda3d1b09dfec43af0ccf6a3d78c998bf9df8139834
          EXPECTED_WHEEL_SHA256: 7e199f44463b6c2f646441cac4d50b47b0fe4bdb92b0837492013063cb8b976a
          EXPECTED_MANIFEST_CANONICAL_SHA256: 13d277c6244657d1f4379a19c36ba532d0ffd7aa23f339fcdbca896edbfb9733
          EXPECTED_MANIFEST_RAW_SHA256: 687d8374841d62f3c119f6970b418559d044d04d28088d76b5c7d2c26ff6738b
          EXPECTED_SBOM_SHA256: ea20c3717eeb22415847ff57a6953378139d69fbd78950f010ab75115c46a7b7
          EXPECTED_SOURCE_MANIFEST_SHA256: 6d9d326a97723b8c5ad3741caced3bd8a26d1508c3f66e46c7b2bf1e9082bcb3
          EXPECTED_STAGED_AUTHORITY_SHA256: 1ae67d92eb344abc68ee0cadced08af5d025f82b013853a0da59e0144f128881
          EXPECTED_STAGED_INDEX_SHA256: 29d30bc8cee1b80b6546611d64769f1af542e7c84ed22e7eb9f50956f5745146
          DECISION_URL: https://app.notion.com/p/3abb8344ad2c81cb8925f732895b8d6a
          PACKAGE_REVIEW_URL: https://app.notion.com/p/3abb8344ad2c8160b9e7c8ca5e6a165e
          PREPUBLICATION_REVIEW_URL: https://app.notion.com/p/3abb8344ad2c810bb1afe9770db60947
          RELEASE_TAG: v7.1.0
          ROLLBACK_TAG: v7.0.1
          HISTORICAL_ROLLBACK_TAG_1: v6.5.0
          HISTORICAL_ROLLBACK_TAG_2: v6.2.0
          PUBLISH: 'false'
        run: bash scripts/publish_v710_final.sh
      - name: Retain controller rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v710-publication-controller-${{ github.event.pull_request.head.sha }}
          path: |
            final-publication/
            final-evidence/
            v710-publication-controller-execution-planning.json
            v710-publication-controller-secret-scan.json
            v710-publication-controller-pypi.json
            v710-publication-controller-osv.json
          if-no-files-found: warn
          retention-days: 90

  publish-v710-final:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      startsWith(github.event.head_commit.message,
      'release: execute exact Atlas ROS v7.1.0 publication')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Publish and perform initial readback
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          FINAL_SOURCE_COMMIT: 0711b045f34f5ab7b03f7a61bc80653e0d815463
          FINAL_ARTIFACT_ID: '8700442825'
          FINAL_ARTIFACT_DIGEST: bb1d2a735ef6c175dd5a41fda067c8d1301883eaa9d413b38fa56346ae8fa483
          EXPECTED_SOURCE_SHA256: fb69bef625125bf477bb3dda3d1b09dfec43af0ccf6a3d78c998bf9df8139834
          EXPECTED_WHEEL_SHA256: 7e199f44463b6c2f646441cac4d50b47b0fe4bdb92b0837492013063cb8b976a
          EXPECTED_MANIFEST_CANONICAL_SHA256: 13d277c6244657d1f4379a19c36ba532d0ffd7aa23f339fcdbca896edbfb9733
          EXPECTED_MANIFEST_RAW_SHA256: 687d8374841d62f3c119f6970b418559d044d04d28088d76b5c7d2c26ff6738b
          EXPECTED_SBOM_SHA256: ea20c3717eeb22415847ff57a6953378139d69fbd78950f010ab75115c46a7b7
          EXPECTED_SOURCE_MANIFEST_SHA256: 6d9d326a97723b8c5ad3741caced3bd8a26d1508c3f66e46c7b2bf1e9082bcb3
          EXPECTED_STAGED_AUTHORITY_SHA256: 1ae67d92eb344abc68ee0cadced08af5d025f82b013853a0da59e0144f128881
          EXPECTED_STAGED_INDEX_SHA256: 29d30bc8cee1b80b6546611d64769f1af542e7c84ed22e7eb9f50956f5745146
          DECISION_URL: https://app.notion.com/p/3abb8344ad2c81cb8925f732895b8d6a
          PACKAGE_REVIEW_URL: https://app.notion.com/p/3abb8344ad2c8160b9e7c8ca5e6a165e
          PREPUBLICATION_REVIEW_URL: https://app.notion.com/p/3abb8344ad2c810bb1afe9770db60947
          RELEASE_TAG: v7.1.0
          ROLLBACK_TAG: v7.0.1
          HISTORICAL_ROLLBACK_TAG_1: v6.5.0
          HISTORICAL_ROLLBACK_TAG_2: v6.2.0
          PUBLISH: 'true'
        run: bash scripts/publish_v710_final.sh
      - name: Retain final publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v710-final-publication-${{ github.sha }}
          path: |
            final-publication/
            final-evidence/
            release-readback/
          if-no-files-found: warn
          retention-days: 90
