name: sync-notion-release-surfaces

on:
  workflow_dispatch:
    inputs:
      active_release:
        description: Active release label, for example v5.2.0
        required: true
        type: string
      package_version:
        description: Python package version, for example 5.2.0
        required: true
        type: string
      rollback_release:
        description: Immediate rollback release label
        required: true
        type: string
      active_package_url:
        description: Authoritative Google Drive Active package folder URL
        required: true
        type: string
      review_date:
        description: Promotion review date in YYYY-MM-DD format
        required: true
        type: string
      authorization_ref:
        description: Authoritative release-decision URL or identifier
        required: false
        type: string
      apply:
        description: Apply after dry-run and production approval
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      active_release:
        required: true
        type: string
      package_version:
        required: true
        type: string
      rollback_release:
        required: true
        type: string
      active_package_url:
        required: true
        type: string
      review_date:
        required: true
        type: string
      authorization_ref:
        required: false
        type: string
        default: ""
      apply:
        required: false
        type: boolean
        default: false
    secrets:
      ATLAS_NOTION_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: atlas-production-notion-release-surfaces
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      ATLAS_NOTION_TOKEN: ${{ secrets.ATLAS_NOTION_TOKEN }}
      ACTIVE_RELEASE: ${{ inputs.active_release }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
      ACTIVE_PACKAGE_URL: ${{ inputs.active_package_url }}
      REVIEW_DATE: ${{ inputs.review_date }}
      AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
    steps:
      - name: Check out governed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Install Atlas ROS
        run: python -m pip install --disable-pip-version-check .

      - name: Produce fail-closed dry-run evidence
        run: |
          set -euo pipefail
          python scripts/sync_notion_release_surfaces.py \
            --active-release "${ACTIVE_RELEASE}" \
            --package-version "${PACKAGE_VERSION}" \
            --rollback-release "${ROLLBACK_RELEASE}" \
            --active-package-url "${ACTIVE_PACKAGE_URL}" \
            --review-date "${REVIEW_DATE}" \
            > notion-release-surface-plan.json
          cat notion-release-surface-plan.json

      - name: Apply and verify authoritative surfaces
        if: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          test -n "${AUTHORIZATION_REF}"
          python scripts/sync_notion_release_surfaces.py \
            --active-release "${ACTIVE_RELEASE}" \
            --package-version "${PACKAGE_VERSION}" \
            --rollback-release "${ROLLBACK_RELEASE}" \
            --active-package-url "${ACTIVE_PACKAGE_URL}" \
            --review-date "${REVIEW_DATE}" \
            --authorization-ref "${AUTHORIZATION_REF}" \
            --apply \
            > notion-release-surface-apply.json
          cat notion-release-surface-apply.json

      - name: Retain promotion-surface evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notion-release-surface-evidence
          path: notion-release-surface-*.json
          if-no-files-found: error
          retention-days: 90
