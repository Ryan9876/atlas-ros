name: v700-architecture-diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v700-architecture:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/v700-canonical-architecture')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate and retain exact architecture diagnostics
        id: architecture
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/validate_architecture.py 2>&1 | tee v700-architecture-diagnostics.json
      - name: Upload architecture diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v700-architecture-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: v700-architecture-diagnostics.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce architecture result
        if: steps.architecture.outcome == 'failure'
        run: exit 1
