name: Fix v8.2.0 candidate source

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix-source:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/v8.2.0-natural-comment-reconciliation' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact source corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('src/atlas_ros/reconciliation/service.py')
          text = service.read_text()
          assert text.count('\nimport json\n') == 1
          service.write_text(text.replace('\nimport json\n', '\n', 1))

          init = Path('src/atlas_ros/reconciliation/__init__.py')
          text = init.read_text()
          additions = [
              '    "CompositeIngressPlan",\n',
              '    "CompositeIngressReconciler",\n',
              '    "ReconciliationInvocation",\n',
              '    "ReconciliationScope",\n',
              '    "UniversalInboxDryRun",\n',
              '    "parse_reconciliation_invocation",\n',
          ]
          assert '    "CanonicalReconciliationService",\n' in text
          assert '    "parse_reconciliation_invocation",\n' not in text
          text = text.replace(
              '    "CanonicalReconciliationService",\n',
              '    "CanonicalReconciliationService",\n' + ''.join(additions[:2]),
              1,
          )
          text = text.replace(
              '    "ReconciliationMutation",\n',
              ''.join(additions[2:4]) + '    "ReconciliationMutation",\n',
              1,
          )
          text = text.replace(
              '    "TodoistReconciliationService",\n',
              '    "TodoistReconciliationService",\n' + additions[4],
              1,
          )
          text = text.replace(
              '    "parse_atlas_command",\n',
              '    "parse_atlas_command",\n' + additions[5],
              1,
          )
          init.write_text(text)
          PY
          git diff --check
      - name: Commit corrected candidate source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atlas_ros/reconciliation/__init__.py src/atlas_ros/reconciliation/service.py
          git commit -m "Fix v8.2.0 candidate source lint defects"
          git push origin HEAD:agent/v8.2.0-natural-comment-reconciliation
