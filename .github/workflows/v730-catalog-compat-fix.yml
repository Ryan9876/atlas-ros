name: v7.3.0 catalog compatibility repair

on:
  push:
    branches: [agent/v730-operational-awareness]
    paths:
      - '.github/workflows/v730-catalog-compat-fix.yml'

permissions:
  contents: write

concurrency:
  group: v730-catalog-compat-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out canonical candidate branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/v730-operational-awareness
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Install pinned CI environment
        run: python -m pip install --disable-pip-version-check -e '.[ci]'

      - name: Apply exact catalog and expectation repairs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} exact matches, found {actual}")
              target.write_text(text.replace(old, new, count))

          replace_exact(
              "src/atlas_ros/capabilities/registry.py",
              "    advisory_only: bool\n    may_create_execution_intent: bool | None\n    digest: str\n",
              "    advisory_only: bool\n"
              "    may_create_execution_intent: bool | None\n"
              "    explicit_intent_required: bool\n"
              "    authorization_required: bool\n"
              "    digest: str\n",
          )
          replace_exact(
              "src/atlas_ros/capabilities/registry.py",
              "        if reconciliation.may_create_execution_intent is not False:\n"
              "            raise ValueError(\"reconciliation cannot create execution intent\")\n"
              "        return cls(\n",
              "        if reconciliation.may_create_execution_intent is not False:\n"
              "            raise ValueError(\"reconciliation cannot create execution intent\")\n"
              "        command_lifecycle = values.get(\"atlas.command-lifecycle\")\n"
              "        if command_lifecycle is not None and not (\n"
              "            command_lifecycle.explicit_intent_required\n"
              "            and command_lifecycle.authorization_required\n"
              "        ):\n"
              "            raise ValueError(\n"
              "                \"command lifecycle requires explicit intent and attended authorization\"\n"
              "            )\n"
              "        return cls(\n",
          )

          replace_exact(
              "src/atlas_ros/capabilities/compiler.py",
              '        "may_create_execution_intent",\n    }\n',
              '        "may_create_execution_intent",\n'
              '        "explicit_intent_required",\n'
              '        "authorization_required",\n'
              '    }\n',
          )
          replace_exact(
              "src/atlas_ros/capabilities/compiler.py",
              "    may_create_execution_intent = _nullable_bool(\n"
              "        payload, \"may_create_execution_intent\", capability_id\n"
              "    )\n"
              "    canonical: dict[str, Any] = {\n",
              "    may_create_execution_intent = _nullable_bool(\n"
              "        payload, \"may_create_execution_intent\", capability_id\n"
              "    )\n"
              "    explicit_intent_required = _optional_bool(\n"
              "        payload, \"explicit_intent_required\", capability_id, default=False\n"
              "    )\n"
              "    authorization_required = _optional_bool(\n"
              "        payload, \"authorization_required\", capability_id, default=False\n"
              "    )\n"
              "    canonical: dict[str, Any] = {\n",
          )
          replace_exact(
              "src/atlas_ros/capabilities/compiler.py",
              "    if may_create_execution_intent is not None:\n"
              "        canonical[\"may_create_execution_intent\"] = may_create_execution_intent\n\n"
              "    descriptor = CapabilityDescriptor(\n",
              "    if may_create_execution_intent is not None:\n"
              "        canonical[\"may_create_execution_intent\"] = may_create_execution_intent\n"
              "    if explicit_intent_required:\n"
              "        canonical[\"explicit_intent_required\"] = True\n"
              "    if authorization_required:\n"
              "        canonical[\"authorization_required\"] = True\n\n"
              "    descriptor = CapabilityDescriptor(\n",
          )
          replace_exact(
              "src/atlas_ros/capabilities/compiler.py",
              "        advisory_only=advisory_only,\n"
              "        may_create_execution_intent=may_create_execution_intent,\n"
              "        digest=sha256_digest(canonical),\n",
              "        advisory_only=advisory_only,\n"
              "        may_create_execution_intent=may_create_execution_intent,\n"
              "        explicit_intent_required=explicit_intent_required,\n"
              "        authorization_required=authorization_required,\n"
              "        digest=sha256_digest(canonical),\n",
          )

          replace_exact(
              "tests/unit/test_v700_capability_compiler.py",
              "    assert len(registry.capabilities) == 15\n"
              "    assert registry.planning_authority_id == \"atlas.execution-planning\"\n"
              "    assert registry.require(\"atlas.reconciliation\").may_create_execution_intent is False\n"
              "    assert all(not item.writes_providers for item in registry.capabilities.values())\n",
              "    assert len(registry.capabilities) == 21\n"
              "    assert registry.planning_authority_id == \"atlas.execution-planning\"\n"
              "    assert registry.require(\"atlas.reconciliation\").may_create_execution_intent is False\n"
              "    command_lifecycle = registry.require(\"atlas.command-lifecycle\")\n"
              "    assert command_lifecycle.explicit_intent_required is True\n"
              "    assert command_lifecycle.authorization_required is True\n"
              "    assert all(not item.writes_providers for item in registry.capabilities.values())\n",
          )
          replace_exact(
              "tests/unit/test_v700_contract_compiler.py",
              "    assert len(registry.contracts) == 13\n",
              "    assert len(registry.contracts) == 43\n",
          )
          replace_exact(
              "tests/unit/test_v700_entry_points.py",
              '    assert payload["version"] == "7.1.1"\n'
              '    assert payload["active_production_version"] == "7.1.0"\n',
              '    assert payload["version"] == "7.3.0"\n'
              '    assert payload["active_production_version"] == "7.1.1"\n',
          )
          replace_exact(
              "tests/unit/test_v700_entry_points.py",
              '        "active_production_version": "7.1.0",\n'
              '        "scope": "installed_candidate_runtime_identity",\n'
              '        "valid": True,\n'
              '        "version": "7.1.1",\n',
              '        "active_production_version": "7.1.1",\n'
              '        "scope": "installed_candidate_runtime_identity",\n'
              '        "valid": True,\n'
              '        "version": "7.3.0",\n',
          )
          replace_exact(
              "tests/unit/test_v710_lazy_warm_runtime.py",
              '    assert payload["version"] == "7.1.1"\n'
              '    assert payload["active_production_version"] == "7.1.0"\n',
              '    assert payload["version"] == "7.3.0"\n'
              '    assert payload["active_production_version"] == "7.1.1"\n',
          )
          PY

      - name: Validate catalog compatibility repair
        run: |
          set -euo pipefail
          ruff check .
          python scripts/validate_architecture.py
          mypy src
          pytest -q -o addopts='' \
            tests/unit/test_v700_capability_compiler.py \
            tests/unit/test_v700_contract_compiler.py \
            tests/unit/test_v700_entry_points.py \
            tests/unit/test_v710_lazy_warm_runtime.py

      - name: Commit source and test repair
        run: |
          set -euo pipefail
          git config user.name 'atlas-ros-bot'
          git config user.email 'atlas-ros-bot@users.noreply.github.com'
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m 'fix: compile v7.3.0 command lifecycle governance'
          git push origin HEAD:agent/v730-operational-awareness
