name: v701-github-only-bootstrap

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  workflow_dispatch:

concurrency:
  group: v701-github-only-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  full-ci-security:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'release/v701-github-only-bootstrap')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install full validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Quality, architecture, typing, and complete test suite
        run: |
          set -euo pipefail
          mkdir -p v701-ci
          ruff check .
          python scripts/validate_architecture.py
          mypy src
          pytest --junitxml=v701-ci/pytest.xml --cov-report=json:v701-ci/coverage.json
      - name: Execution planning and secret scan
        run: |
          set -euo pipefail
          python scripts/evaluate_execution_planning.py \
            --dataset benchmarks/execution-planning-v1.json \
            --output v701-ci/EXECUTION_PLANNING_REPORT.json
          python scripts/scan_candidate_secrets.py \
            --root . \
            --output v701-ci/secret-scan.json
      - name: Dependency policy and vulnerability exceptions
        run: |
          set -euo pipefail
          python scripts/validate_dependency_lock.py requirements.runtime.lock
          python scripts/validate_vulnerability_exceptions.py
      - name: Audit PyPI and OSV advisory services
        run: |
          set -euo pipefail
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service pypi \
            --requirement requirements.runtime.lock --format json \
            --output v701-ci/pip-audit-pypi.json
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service osv \
            --requirement requirements.runtime.lock --format json \
            --output v701-ci/pip-audit-osv.json
          python scripts/evaluate_dependency_audit.py \
            v701-ci/pip-audit-pypi.json \
            v701-ci/pip-audit-osv.json
      - name: Checksum CI evidence
        if: always()
        run: |
          if [[ -d v701-ci ]]; then
            (cd v701-ci && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          fi
      - name: Retain CI and security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v701-ci-${{ github.event.pull_request.head.sha || github.sha }}
          path: v701-ci/
          if-no-files-found: warn
          retention-days: 90

  validate-corrective-package:
    needs: full-ci-security
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'release/v701-github-only-bootstrap')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install package validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate exact v7.0.1 corrective package without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DECISION_RECORD_URL: https://app.notion.com/p/3abb8344ad2c818284bec8bfb3ce5552
        run: bash scripts/validate_v701_candidate.sh
      - name: Retain exact package and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v701-corrective-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            v701-publication/
            v701-evidence/
          if-no-files-found: warn
          retention-days: 90
