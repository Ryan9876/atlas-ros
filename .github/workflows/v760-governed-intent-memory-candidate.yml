name: v7.6.0 governed intent memory candidate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - '.github/workflows/v760-governed-intent-memory-candidate.yml'
      - 'pyproject.toml'
      - 'src/atlas_ros/__init__.py'
      - 'src/atlas_ros/entry_points/main.py'
      - 'src/atlas_ros/intent_memory*_v760.py'
      - 'scripts/build_v760_*'
      - 'tests/test_v760_intent_memory.py'
      - 'tests/unit/test_v700_entry_points.py'
      - 'tests/unit/test_v710_lazy_warm_runtime.py'
      - 'tests/fixtures/v760_*.json'
      - 'docs/**/V760_*'
      - 'release/RELEASE_MANIFEST_V760_DRAFT_TEMPLATE.md'

concurrency:
  group: v760-governed-intent-memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_VERSION: 7.6.0

jobs:
  lean:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[ci]'
      - run: |
          ruff check \
            src/atlas_ros/intent_memory*_v760.py \
            scripts/build_v760_* \
            tests/test_v760_intent_memory.py
      - run: mypy src/atlas_ros/intent_memory*_v760.py
      - run: pytest --no-cov -q tests/test_v760_intent_memory.py
      - run: |
          python scripts/build_v760_intent_memory_evidence.py \
            --output-directory build/lean-v760-evidence
          test -s build/lean-v760-evidence/V760_CONTRACT_SCHEMAS.json
          test -s build/lean-v760-evidence/V760_SCHEMA_PLAN.json
          test -s build/lean-v760-evidence/V760_MIGRATION_PROPOSAL.json
          test -s build/lean-v760-evidence/V760_FEATURE_POLICY_TARGET.json
          test -s build/lean-v760-evidence/V760_PRIVACY_REVIEW_RECEIPT.json

  full-candidate:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Bind source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          mkdir -p build dist clean-install restoration
          git rev-parse HEAD > build/SOURCE_COMMIT.txt
          git ls-tree -r --full-tree HEAD > build/SOURCE_TREE.txt

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Install validation environment
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Resolve live restoration authority
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          authority = json.loads(Path('governance/AUTHORITY.json').read_text())
          print(f"ACTIVE_VERSION={authority['active_release']['version']}")
          print(f"ACTIVE_TAG={authority['active_release']['tag']}")
          print(f"ACTIVE_COMMIT={authority['active_release']['immutable_commit']}")
          print(f"ROLLBACK_VERSION={authority['immediate_rollback']['version']}")
          print(f"ROLLBACK_TAG={authority['immediate_rollback']['tag']}")
          print(f"ROLLBACK_COMMIT={authority['immediate_rollback']['immutable_commit']}")
          PY

      - name: Run complete correctness gates
        run: |
          set -euo pipefail
          ruff check .
          mypy src/atlas_ros
          python scripts/validate_architecture.py
          python scripts/validate_devtools_boundary.py
          pytest

      - name: Build deterministic proposal evidence
        run: |
          python scripts/build_v760_intent_memory_evidence.py --output-directory build
          python - <<'PY'
          import json
          from pathlib import Path

          schemas = json.loads(Path('build/V760_CONTRACT_SCHEMAS.json').read_text())
          migration = json.loads(Path('build/V760_MIGRATION_PROPOSAL.json').read_text())
          policy = json.loads(Path('build/V760_FEATURE_POLICY_TARGET.json').read_text())
          privacy = json.loads(Path('build/V760_PRIVACY_REVIEW_RECEIPT.json').read_text())
          index = json.loads(Path('build/V760_PROPOSAL_EVIDENCE_INDEX.json').read_text())
          assert len(schemas) == 12
          assert index['regression_case_count'] == 11
          assert migration['create_count'] == 0
          assert migration['update_count'] == 0
          assert migration['skip_count'] == 13
          assert migration['provider_write_count'] == 0
          assert policy['after_release_activation'] == 'disabled'
          assert policy['inference_enable_target'].startswith('disabled')
          assert privacy['status'] == 'passed'
          PY

      - name: Scan candidate change set and audit dependencies
        run: |
          set -euo pipefail
          rm -rf secret-scan-root
          mkdir -p secret-scan-root
          while IFS= read -r -d '' file; do
            mkdir -p "secret-scan-root/$(dirname "$file")"
            cp "$file" "secret-scan-root/$file"
          done < <(
            git diff --name-only -z --diff-filter=ACMR \
              "origin/${GITHUB_BASE_REF:-main}"...HEAD -- \
              '*.cfg' '*.ini' '*.json' '*.md' '*.py' '*.toml' '*.txt' \
              '*.yaml' '*.yml'
          )
          python scripts/scan_candidate_secrets.py \
            --root secret-scan-root --output build/V760_SECRET_SCAN.json
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service pypi \
            --requirement requirements.runtime.lock --format json \
            --output build/V760_PIP_AUDIT_PYPI.json
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service osv \
            --requirement requirements.runtime.lock --format json \
            --output build/V760_PIP_AUDIT_OSV.json
          python scripts/evaluate_dependency_audit.py \
            build/V760_PIP_AUDIT_PYPI.json build/V760_PIP_AUDIT_OSV.json

      - name: Build exact package once
        run: |
          set -euo pipefail
          rm -rf dist
          python -m build
          test -f dist/atlas_ros-7.6.0.tar.gz
          test -f dist/atlas_ros-7.6.0-py3-none-any.whl
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          printf '1\n' > build/BUILD_COUNT.txt

      - name: Clean install exact artifacts
        run: |
          set -euo pipefail
          for kind in sdist wheel; do
            if [ "$kind" = wheel ]; then
              package=dist/atlas_ros-7.6.0-py3-none-any.whl
            else
              package=dist/atlas_ros-7.6.0.tar.gz
            fi
            env_dir="clean-install/$kind"
            python -m venv "$env_dir"
            "$env_dir/bin/python" -m pip install \
              --disable-pip-version-check "$package"
            "$env_dir/bin/python" -c \
              "import atlas_ros; assert atlas_ros.__version__ == '7.6.0'"
            "$env_dir/bin/atlas" status --json > "build/${kind}-status.json"
            "$env_dir/bin/atlas" verify --json > "build/${kind}-verify.json"
          done

      - name: Restore Active and immediate rollback
        run: |
          set -euo pipefail
          mkdir -p "restoration/active-${ACTIVE_VERSION}" \
            "restoration/rollback-${ROLLBACK_VERSION}"
          gh release download "$ACTIVE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "restoration/active-${ACTIVE_VERSION}"
          gh release download "$ROLLBACK_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "restoration/rollback-${ROLLBACK_VERSION}"
          (
            cd "restoration/active-${ACTIVE_VERSION}"
            sed 's#  dist/#  #' CHECKSUMS.sha256 | sha256sum -c -
          )
          (
            cd "restoration/rollback-${ROLLBACK_VERSION}"
            sed 's#  dist/#  #' CHECKSUMS.sha256 | sha256sum -c -
          )
          active_wheel=$(find \
            "restoration/active-${ACTIVE_VERSION}" -name '*.whl' -print -quit)
          rollback_wheel=$(find \
            "restoration/rollback-${ROLLBACK_VERSION}" -name '*.whl' -print -quit)
          test -n "$active_wheel"
          test -n "$rollback_wheel"
          python -m venv restoration/active-clean
          python -m venv restoration/rollback-clean
          restoration/active-clean/bin/python -m pip install \
            --disable-pip-version-check "$active_wheel"
          restoration/rollback-clean/bin/python -m pip install \
            --disable-pip-version-check "$rollback_wheel"
          restoration/active-clean/bin/python -c \
            "import atlas_ros; assert atlas_ros.__version__ == '${ACTIVE_VERSION}'"
          restoration/rollback-clean/bin/python -c \
            "import atlas_ros; assert atlas_ros.__version__ == '${ROLLBACK_VERSION}'"
          printf '%s\n' "$ACTIVE_COMMIT" > build/ACTIVE_RESTORATION_COMMIT.txt
          printf '%s\n' "$ROLLBACK_COMMIT" > build/ROLLBACK_RESTORATION_COMMIT.txt

      - name: Build and verify complete candidate evidence
        run: |
          set -euo pipefail
          python scripts/build_v760_candidate_evidence.py
          sha256sum -c build/CHECKSUMS.sha256
          sha256sum -c build/EVIDENCE_CHECKSUMS.sha256
          sha256sum -c build/NESTED_CHECKSUMS.sha256
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          package = json.loads(Path('build/V760_PACKAGE_INDEX.json').read_text())
          validation = json.loads(Path('build/V760_VALIDATION_RECEIPT.json').read_text())
          zero_writes = json.loads(
              Path('build/V760_ZERO_PROVIDER_WRITE_RECEIPT.json').read_text()
          )
          assert package['candidate_commit'] == os.environ['CANDIDATE_COMMIT']
          assert package['candidate_version'] == '7.6.0'
          assert package['build_count'] == 1
          assert validation['status'] == 'passed'
          assert validation['active_restoration_version'] == os.environ['ACTIVE_VERSION']
          assert validation['rollback_restoration_version'] == os.environ['ROLLBACK_VERSION']
          assert zero_writes['provider_writes'] == 0
          assert zero_writes['todoist_writes'] == 0
          assert zero_writes['forgetting_executions'] == 0
          PY

      - name: Retain exact candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v760-governed-intent-memory-${{ env.CANDIDATE_COMMIT }}
          path: |
            dist/
            build/
          if-no-files-found: error
          retention-days: 90
