name: v740-authorized-publication-controller

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main]

concurrency:
  group: v740-authorized-publication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-publication-controller:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v740-authorized-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install validation tooling
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate controller and rehearse exact publication
        env: &publication-env
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          FINAL_MANIFEST_COMMIT: 6d48b93c195b7b1761df561760d04aea67d28a55
          PACKAGE_SOURCE_COMMIT: d3641e2c967ed4a592736171dce5b88e51c9117a
          FINAL_ARTIFACT_ID: '8711718012'
          FINAL_ARTIFACT_DIGEST: sha256:270f9e4443536ce83c5bc4e0bf6af867db7cae087f24f1eff272d80ccd872d4b
          EXPECTED_SOURCE_SHA256: 12d555568ad451d4f8316290b5b0a6d8b83289feba04aa7fccaa293d4d772ae7
          EXPECTED_WHEEL_SHA256: 22fe5269a24454a42824838e49c1ec1d0c86521954c4e6947d98917e9450c882
          EXPECTED_SBOM_SHA256: 178d1cf7828c9a9888c4abc4fe0c0c11267153595b20cb33dcbecfe241fff88c
          EXPECTED_SOURCE_MANIFEST_SHA256: 8dbad420d6745404e70cbf35a8d9a94629e067808ff63b37a62ae4c2ae004658
          EXPECTED_EVIDENCE_PACKAGE_SHA256: f6bf9b6de0d31086981c36f5bc80f933d7da746d0fe4a58fd3f34cda5371ce74
          DECISION_URL: https://app.notion.com/p/3acb8344ad2c810baec7c6eb6bbaff6d
          PACKAGE_REVIEW_URL: https://app.notion.com/p/3acb8344ad2c81b99363cbd55f2cc8e9
          PREPUBLICATION_REVIEW_URL: https://app.notion.com/p/3acb8344ad2c817ab62bc305c640af9d
          RELEASE_TAG: v7.4.0
          ROLLBACK_TAG: v7.3.0
          PUBLISH: 'false'
        run: |
          set -euo pipefail
          bash -n scripts/publish_v740_final.sh
          python scripts/validate_architecture.py
          python scripts/validate_legacy_isolation.py
          bash scripts/publish_v740_final.sh
      - name: Retain controller rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v740-publication-controller-${{ github.event.pull_request.head.sha }}
          path: |
            final-publication/
            final-evidence/
          if-no-files-found: warn
          retention-days: 90

  publish-v740-final:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      startsWith(github.event.head_commit.message,
      'release: execute exact Atlas ROS v7.4.0 publication')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Publish immutable release and perform initial readback
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          FINAL_MANIFEST_COMMIT: 6d48b93c195b7b1761df561760d04aea67d28a55
          PACKAGE_SOURCE_COMMIT: d3641e2c967ed4a592736171dce5b88e51c9117a
          FINAL_ARTIFACT_ID: '8711718012'
          FINAL_ARTIFACT_DIGEST: sha256:270f9e4443536ce83c5bc4e0bf6af867db7cae087f24f1eff272d80ccd872d4b
          EXPECTED_SOURCE_SHA256: 12d555568ad451d4f8316290b5b0a6d8b83289feba04aa7fccaa293d4d772ae7
          EXPECTED_WHEEL_SHA256: 22fe5269a24454a42824838e49c1ec1d0c86521954c4e6947d98917e9450c882
          EXPECTED_SBOM_SHA256: 178d1cf7828c9a9888c4abc4fe0c0c11267153595b20cb33dcbecfe241fff88c
          EXPECTED_SOURCE_MANIFEST_SHA256: 8dbad420d6745404e70cbf35a8d9a94629e067808ff63b37a62ae4c2ae004658
          EXPECTED_EVIDENCE_PACKAGE_SHA256: f6bf9b6de0d31086981c36f5bc80f933d7da746d0fe4a58fd3f34cda5371ce74
          DECISION_URL: https://app.notion.com/p/3acb8344ad2c810baec7c6eb6bbaff6d
          PACKAGE_REVIEW_URL: https://app.notion.com/p/3acb8344ad2c81b99363cbd55f2cc8e9
          PREPUBLICATION_REVIEW_URL: https://app.notion.com/p/3acb8344ad2c817ab62bc305c640af9d
          RELEASE_TAG: v7.4.0
          ROLLBACK_TAG: v7.3.0
          PUBLISH: 'true'
        run: bash scripts/publish_v740_final.sh
      - name: Retain final publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v740-final-publication-${{ github.sha }}
          path: |
            final-publication/
            final-evidence/
            release-readback/
          if-no-files-found: warn
          retention-days: 90
