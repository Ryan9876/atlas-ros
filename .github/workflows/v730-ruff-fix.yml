name: v7.3.0 mechanical Ruff repair

on:
  push:
    branches: [agent/v730-operational-awareness]
    paths:
      - '.github/workflows/v730-ruff-fix.yml'

permissions:
  contents: write

concurrency:
  group: v730-ruff-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out canonical candidate branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/v730-operational-awareness
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Install pinned CI environment
        run: python -m pip install --disable-pip-version-check -e '.[ci]'

      - name: Apply exact Ruff fixes
        run: |
          set -euo pipefail
          ruff check --fix \
            src/atlas_ros/contracts/operational_awareness \
            src/atlas_ros/capabilities/operational_awareness \
            src/atlas_ros/application/operational_awareness.py \
            src/atlas_ros/application/command_lifecycle.py \
            src/atlas_ros/planning/operational_awareness.py \
            src/atlas_ros/ports/operational_state.py \
            src/atlas_ros/ports/command_intake.py \
            src/atlas_ros/ports/provider_readback.py \
            src/atlas_ros/ports/lifecycle_planning.py \
            src/atlas_ros/adapters/notion_operational_state.py \
            src/atlas_ros/adapters/todoist_operational_state.py \
            src/atlas_ros/adapters/todoist_command_source.py \
            src/atlas_ros/entry_points/awareness.py \
            src/atlas_ros/entry_points/lifecycle.py \
            src/atlas_ros/policy/operational_awareness.py \
            scripts/validate_v730_notion_migration.py \
            scripts/benchmark_v730_operational_awareness.py \
            scripts/finalize_v730_package.py \
            scripts/validate_v730_candidate.py \
            tests/unit/test_v730_operational_awareness.py \
            tests/unit/test_v730_release_controls.py
          ruff check \
            src/atlas_ros/contracts/operational_awareness \
            src/atlas_ros/capabilities/operational_awareness \
            src/atlas_ros/application/operational_awareness.py \
            src/atlas_ros/application/command_lifecycle.py \
            src/atlas_ros/planning/operational_awareness.py \
            src/atlas_ros/ports/operational_state.py \
            src/atlas_ros/ports/command_intake.py \
            src/atlas_ros/ports/provider_readback.py \
            src/atlas_ros/ports/lifecycle_planning.py \
            src/atlas_ros/adapters/notion_operational_state.py \
            src/atlas_ros/adapters/todoist_operational_state.py \
            src/atlas_ros/adapters/todoist_command_source.py \
            src/atlas_ros/entry_points/awareness.py \
            src/atlas_ros/entry_points/lifecycle.py \
            src/atlas_ros/policy/operational_awareness.py \
            scripts/validate_v730_notion_migration.py \
            scripts/benchmark_v730_operational_awareness.py \
            scripts/finalize_v730_package.py \
            scripts/validate_v730_candidate.py \
            tests/unit/test_v730_operational_awareness.py \
            tests/unit/test_v730_release_controls.py

      - name: Commit source-only mechanical repair
        run: |
          set -euo pipefail
          git config user.name 'atlas-ros-bot'
          git config user.email 'atlas-ros-bot@users.noreply.github.com'
          git add src scripts tests
          git diff --cached --quiet && exit 0
          git commit -m 'style: apply v7.3.0 Ruff fixes'
          git push origin HEAD:agent/v730-operational-awareness
