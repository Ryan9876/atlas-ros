name: v7.4.5 independent publication readback

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.release.tag_name == 'v7.4.5'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: v7.4.5
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag target and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.release.target_commitish }}" || true
          test -f release/RELEASE_MANIFEST_V745.md
          mkdir -p readback
          gh release download v7.4.5 --repo "$GITHUB_REPOSITORY" --dir readback
          test -f readback/atlas_ros-7.4.5.tar.gz
          test -f readback/atlas_ros-7.4.5-py3-none-any.whl
          test -f readback/CHECKSUMS.sha256
          test -f readback/RELEASE_MANIFEST_V745.md
          (cd readback && sha256sum -c CHECKSUMS.sha256)
          test "$(sha256sum readback/atlas_ros-7.4.5.tar.gz | cut -d' ' -f1)" = "dc31dbdba07c63f16d7c1df7344ea4760b751cbf8a7f02f7441e1946afca9c15"
          test "$(sha256sum readback/atlas_ros-7.4.5-py3-none-any.whl | cut -d' ' -f1)" = "bb718dcfa808add92eb612115f3040f1eb4da0490c766eb2603a2c37ac5c1be6"
          cmp release/RELEASE_MANIFEST_V745.md readback/RELEASE_MANIFEST_V745.md

      - name: Clean-install published wheel and source
        run: |
          set -euo pipefail
          for kind in wheel source; do
            python -m venv "readback-$kind"
            if [ "$kind" = wheel ]; then
              package=readback/atlas_ros-7.4.5-py3-none-any.whl
            else
              package=readback/atlas_ros-7.4.5.tar.gz
            fi
            "readback-$kind/bin/python" -m pip install --disable-pip-version-check "$package"
            "readback-$kind/bin/python" -c "import atlas_ros; assert atlas_ros.__version__ == '7.4.5'"
            "readback-$kind/bin/atlas" status --json
            "readback-$kind/bin/atlas" verify --json
          done
