name: v701-authority-activation

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

concurrency:
  group: v701-authority-activation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify-publication-and-authority:
    if: github.head_ref == 'release/v701-authority-activation'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate source, security, and current documentation
        run: |
          set -euo pipefail
          ruff check .
          python scripts/validate_architecture.py
          mypy src
          pytest
          python scripts/validate_dependency_lock.py requirements.runtime.lock
          python scripts/validate_vulnerability_exceptions.py
          python scripts/validate_documentation_authority.py
      - name: Inspect immutable v7.0.1 Release metadata and asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p authority-activation-evidence release-diagnostic
          printf '%s\n' metadata-started > authority-activation-evidence/STAGE.txt
          gh release view v7.0.1 --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish,assets \
            > authority-activation-evidence/RELEASE_METADATA.json
          printf '%s\n' metadata-read > authority-activation-evidence/STAGE.txt
          git rev-list -n 1 v7.0.1 > authority-activation-evidence/TAG_TARGET.txt
          test "$(cat authority-activation-evidence/TAG_TARGET.txt)" = f26f5154ea6cd4b431c5a2638c439d7de9282761
          printf '%s\n' tag-target-passed > authority-activation-evidence/STAGE.txt
          gh release download v7.0.1 --repo "$GITHUB_REPOSITORY" --dir release-diagnostic
          find release-diagnostic -maxdepth 1 -type f -printf '%f\n' | sort \
            > authority-activation-evidence/ASSET_FILES.txt
          test -s authority-activation-evidence/ASSET_FILES.txt
          printf '%s\n' assets-downloaded > authority-activation-evidence/STAGE.txt
      - name: Independently verify published v7.0.1 assets and rollback
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v7.0.1
          EXPECTED_SOURCE_COMMIT: f26f5154ea6cd4b431c5a2638c439d7de9282761
          EXPECTED_SOURCE_SHA256: 21d266963231bc1b2a2eb2ea2ed3b5f38a17d7e447fb2c1a74f4e98fe2389629
          EXPECTED_WHEEL_SHA256: 213def6ff15874e525eeb6e74687b915dcb2ec13b57b7726bea188cd703d8be1
          EXPECTED_MANIFEST_SHA256: 3ccda11f3ebf72457d82d7fd92d0ea2e3076fae593ee7abaeba6d80f836ea366
        run: |
          bash scripts/verify_v701_publication.sh
          printf '%s\n' publication-readback-passed > authority-activation-evidence/STAGE.txt
      - name: Validate proposed live GitHub authority
        run: |
          python scripts/validate_v701_authority_activation.py
          printf '%s\n' authority-validation-passed > authority-activation-evidence/STAGE.txt
      - name: Finalize evidence checksums
        if: always()
        run: |
          mkdir -p authority-activation-evidence
          if [[ -d post-publication-evidence ]]; then
            cp -R post-publication-evidence/. authority-activation-evidence/
          fi
          (cd authority-activation-evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd authority-activation-evidence && sha256sum -c SHA256SUMS)
      - name: Retain publication and authority-activation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v701-authority-activation-${{ github.event.pull_request.head.sha }}
          path: authority-activation-evidence/
          if-no-files-found: error
          retention-days: 90
