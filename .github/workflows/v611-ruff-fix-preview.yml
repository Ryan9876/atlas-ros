name: v611-ruff-fix-preview

on:
  push:
    branches: [agent/v611-reasoning-coherence]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    if: github.head_ref == 'agent/v611-reasoning-coherence' || github.ref_name == 'agent/v611-reasoning-coherence'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - run: python -m pip install --disable-pip-version-check ruff==0.12.12
      - name: Generate Ruff fix patch without writing repository state
        run: |
          ruff check --fix src/atlas_ros/contracts/coherence_v1.py src/atlas_ros/engines/reasoning_coherence.py tests/test_contract_schemas_v611.py || true
          git diff --check
          git diff > ruff-fix.patch
          test -s ruff-fix.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v611-ruff-fix-preview
          path: ruff-fix.patch
          if-no-files-found: error
          retention-days: 7
