name: v700-final-controller-validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-v700-final-controller:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/v700-canonical-architecture')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install final-controller validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Resolve successful exact-artifact validation at the exact head
        id: prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100")"
            exact_run="$(jq -r '[.workflow_runs[] | select(.name == "v700-exact-artifact-validation" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            if [[ -n "$exact_run" ]]; then
              echo "exact_run_id=$exact_run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Exact-head exact-artifact validation did not pass" >&2
          exit 1
      - name: Download and verify exact-artifact Full Validation evidence
        id: exact
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXACT_RUN_ID: ${{ steps.prerequisite.outputs.exact_run_id }}
        run: |
          set -euo pipefail
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_RUN_ID}/artifacts")"
          name="atlas-ros-v700-exact-artifact-${HEAD_SHA}"
          artifact_id="$(jq -r --arg name "$name" '[.artifacts[] | select(.name == $name and .expired == false)] | last | .id // empty' <<<"$artifacts")"
          artifact_digest="$(jq -r --arg name "$name" '[.artifacts[] | select(.name == $name and .expired == false)] | last | .digest // empty' <<<"$artifacts")"
          [[ -n "$artifact_id" && -n "$artifact_digest" ]]
          normalized_digest="${artifact_digest#sha256:}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > exact-artifact.zip
          echo "${normalized_digest}  exact-artifact.zip" | sha256sum -c -
          rm -rf exact-artifact
          mkdir exact-artifact
          unzip -q exact-artifact.zip -d exact-artifact
          checksum_file="$(find exact-artifact -name EXACT_ARTIFACT_CHECKSUMS.sha256 -print -quit)"
          validation_file="$(find exact-artifact -name EXACT_ARTIFACT_VALIDATION.json -print -quit)"
          [[ -n "$checksum_file" && -n "$validation_file" ]]
          evidence_root="$(dirname "$checksum_file")"
          (cd "$evidence_root" && sha256sum -c EXACT_ARTIFACT_CHECKSUMS.sha256)
          echo "validation_file=$validation_file" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$normalized_digest" >> "$GITHUB_OUTPUT"
      - name: Generate and verify immutable v6.5 rollback evidence
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -rf v650-assets exact-v650 v700-final-controller-evidence
          mkdir -p v650-assets v700-final-controller-evidence
          gh release download v6.5.0 --repo "$GITHUB_REPOSITORY" --dir v650-assets
          (cd v650-assets && sha256sum -c CHECKSUMS.sha256)
          v650_wheel="$(find v650-assets -name 'atlas_ros-6.5.0*.whl' -print -quit)"
          [[ -n "$v650_wheel" ]]
          python -m venv exact-v650
          exact-v650/bin/python -m pip install --disable-pip-version-check "$v650_wheel"
          clean_version="$(exact-v650/bin/python -c 'import atlas_ros; print(atlas_ros.__version__)')"
          [[ "$clean_version" == "6.5.0" ]]
          python scripts/validate_v650_rollback_evidence.py \
            --source-commit bb6d6fea70d6824c9bc6a42e63ba36cc88029260 \
            --release-assets-dir v650-assets \
            --clean-install-version "$clean_version" \
            --restoration-passed \
            --metadata-exception-record-url "https://github.com/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/docs/validation/V650_IMMUTABLE_SOURCE_RECONCILIATION.md" \
            --output v700-final-controller-evidence/V650_ROLLBACK_EVIDENCE.json
          python - <<'PY'
          from pathlib import Path
          from tools.release.rollback_evidence import load_receipt

          receipt = load_receipt(
              Path("v700-final-controller-evidence/V650_ROLLBACK_EVIDENCE.json")
          )
          assert receipt.status == "ready"
          assert receipt.verified_version == "6.5.0"
          assert receipt.provider_writes == 0
          assert receipt.immutable_history_rewritten is False
          assert receipt.authority_changed is False
          PY
      - name: Validate the non-publishing final controller
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATION_FILE: ${{ steps.exact.outputs.validation_file }}
        run: |
          set -euo pipefail
          python scripts/validate_v700_final_controller.py \
            --exact-artifact-validation "$VALIDATION_FILE" \
            --final-source-commit "$HEAD_SHA" \
            --decision-record-url https://app.notion.com/p/3aab8344ad2c81399ff7e6f5c5ce644d \
            --review-record-url https://app.notion.com/p/3aab8344ad2c819e93bce697d6ee8ae1 \
            --v650-rollback-evidence v700-final-controller-evidence/V650_ROLLBACK_EVIDENCE.json \
            --output-dir v700-final-controller-evidence
      - name: Enforce fail-closed controller result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("v700-final-controller-evidence/V700_FINAL_CONTROLLER_VALIDATION.json")
              .read_text(encoding="utf-8")
          )
          assert result["status"] == "validated_not_authorized"
          final = result["final_controller"]
          assert final["status"] == "blocked"
          assert "candidate PR merge has not passed" in final["blockers"]
          assert "Drive migration ledger has not passed" in final["blockers"]
          assert "live authority readback has not passed" in final["blockers"]
          assert "v6.5 rollback evidence reconciliation has not passed" not in final["blockers"]
          assert "v6.5 rollback evidence digest is required" not in final["blockers"]
          assert "exact-package Ryan authorization is required" in final["blockers"]
          assert result["v650_rollback_evidence_present"] is True
          rollback_digest = result["v650_rollback_evidence_sha256"]
          assert isinstance(rollback_digest, str) and len(rollback_digest) == 64
          assert all(character in "0123456789abcdef" for character in rollback_digest)
          assert result["post_publication_verification"]["status"] == "blocked"
          assert result["authority_activation"]["status"] == "blocked"
          assert result["provider_writes"] == 0
          assert result["publication_performed"] is False
          assert result["tag_created"] is False
          assert result["authority_activated"] is False
          assert result["drive_retired"] is False
          PY
      - name: Create and verify final-controller evidence checksums
        run: |
          set -euo pipefail
          (
            cd v700-final-controller-evidence
            find . -type f ! -name FINAL_CONTROLLER_CHECKSUMS.sha256 -print0 | sort -z |
              xargs -0 sha256sum > FINAL_CONTROLLER_CHECKSUMS.sha256
            sha256sum -c FINAL_CONTROLLER_CHECKSUMS.sha256
          )
      - name: Retain non-publishing final-controller evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v700-final-controller-${{ github.event.pull_request.head.sha || github.sha }}
          path: v700-final-controller-evidence/
          if-no-files-found: warn
          retention-days: 90
