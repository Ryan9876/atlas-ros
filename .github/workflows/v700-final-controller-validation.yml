name: v700-final-controller-validation

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  workflow_dispatch:

concurrency:
  group: v700-final-controller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-v700-final-controller:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'release/v700-final')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install final-controller validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Resolve successful final-package validation at the exact head
        id: prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          runs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${FINAL_SHA}&per_page=100")"
          final_run="$(jq -r '[.workflow_runs[] | select(.name == "v700-final-package" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
          if [[ -z "$final_run" ]]; then
            echo "Exact-head final-package validation has not passed; retry this job after it succeeds." >&2
            exit 1
          fi
          echo "final_run_id=$final_run" >> "$GITHUB_OUTPUT"
      - name: Download and verify exact final package
        id: final
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FINAL_RUN_ID: ${{ steps.prerequisite.outputs.final_run_id }}
        run: |
          set -euo pipefail
          artifacts="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${FINAL_RUN_ID}/artifacts")"
          name="atlas-ros-v700-final-package-${FINAL_SHA}"
          artifact_id="$(jq -r --arg name "$name" '[.artifacts[] | select(.name == $name and .expired == false)] | last | .id // empty' <<<"$artifacts")"
          artifact_digest="$(jq -r --arg name "$name" '[.artifacts[] | select(.name == $name and .expired == false)] | last | .digest // empty' <<<"$artifacts")"
          test -n "$artifact_id"
          test -n "$artifact_digest"
          normalized_digest="${artifact_digest#sha256:}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > final-package.zip
          echo "${normalized_digest}  final-package.zip" | sha256sum -c -
          rm -rf final-package
          mkdir final-package
          unzip -q final-package.zip -d final-package
          checksum_file="$(find final-package -name PUBLICATION_CHECKSUMS.sha256 -print -quit)"
          validation_file="$(find final-package -name FINAL_PACKAGE_VALIDATION.json -print -quit)"
          test -n "$checksum_file"
          test -n "$validation_file"
          package_root="$(dirname "$checksum_file")"
          (cd "$package_root" && sha256sum -c PUBLICATION_CHECKSUMS.sha256)
          evidence_root="$(dirname "$validation_file")"
          (cd "$evidence_root" && sha256sum -c EVIDENCE_CHECKSUMS.sha256)
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$normalized_digest" >> "$GITHUB_OUTPUT"
          echo "validation_file=$validation_file" >> "$GITHUB_OUTPUT"
      - name: Download and verify validated RC exact-artifact evidence
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_EXACT_ARTIFACT_ID: '8675702886'
          CANDIDATE_EXACT_ARTIFACT_DIGEST: b1c537e6fda16bc4e79120daa4fd6ec94c9216d39b794d2f4ee040b8f76848b9
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_EXACT_ARTIFACT_ID}/zip" \
            > candidate-exact.zip
          echo "${CANDIDATE_EXACT_ARTIFACT_DIGEST}  candidate-exact.zip" | \
            sha256sum -c -
          rm -rf candidate-exact
          mkdir candidate-exact
          unzip -q candidate-exact.zip -d candidate-exact
          checksum_file="$(find candidate-exact \
            -name EXACT_ARTIFACT_CHECKSUMS.sha256 -print -quit)"
          validation_file="$(find candidate-exact \
            -name EXACT_ARTIFACT_VALIDATION.json -print -quit)"
          rollback_file="$(find candidate-exact \
            -name V650_ROLLBACK_EVIDENCE.json -print -quit)"
          test -n "$checksum_file"
          test -n "$validation_file"
          test -n "$rollback_file"
          evidence_root="$(dirname "$checksum_file")"
          (cd "$evidence_root" && sha256sum -c EXACT_ARTIFACT_CHECKSUMS.sha256)
          echo "validation_file=$validation_file" >> "$GITHUB_OUTPUT"
          echo "rollback_file=$rollback_file" >> "$GITHUB_OUTPUT"
      - name: Compile promotion-scoped Drive ledger
        run: |
          mkdir -p v700-final-controller-evidence
          python -m tools.release.drive_migration_cli compile \
            release/v700-drive-migration-inventory.json \
            v700-final-controller-evidence/V700_DRIVE_MIGRATION_LEDGER.json \
            > v700-final-controller-evidence/V700_DRIVE_MIGRATION_SUMMARY.json
      - name: Validate non-publishing final controller
        env:
          FINAL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FINAL_PACKAGE_VALIDATION: ${{ steps.final.outputs.validation_file }}
          FINAL_PACKAGE_ARTIFACT_ID: ${{ steps.final.outputs.artifact_id }}
          FINAL_PACKAGE_ARTIFACT_DIGEST: ${{ steps.final.outputs.artifact_digest }}
          CANDIDATE_EXACT_VALIDATION: ${{ steps.candidate.outputs.validation_file }}
          V650_ROLLBACK_EVIDENCE: ${{ steps.candidate.outputs.rollback_file }}
        run: |
          python -m scripts.validate_v700_final_controller \
            --exact-artifact-validation "$CANDIDATE_EXACT_VALIDATION" \
            --final-package-validation "$FINAL_PACKAGE_VALIDATION" \
            --final-package-artifact-id "$FINAL_PACKAGE_ARTIFACT_ID" \
            --final-package-artifact-digest "$FINAL_PACKAGE_ARTIFACT_DIGEST" \
            --final-source-commit "$FINAL_SHA" \
            --candidate-pr-merged \
            --decision-record-url \
              https://app.notion.com/p/3aab8344ad2c81399ff7e6f5c5ce644d \
            --review-record-url \
              https://app.notion.com/p/3aab8344ad2c819e93bce697d6ee8ae1 \
            --drive-ledger \
              v700-final-controller-evidence/V700_DRIVE_MIGRATION_LEDGER.json \
            --v650-rollback-evidence "$V650_ROLLBACK_EVIDENCE" \
            --output-dir v700-final-controller-evidence
      - name: Enforce authorization hold and passed package gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path('v700-final-controller-evidence/V700_FINAL_CONTROLLER_VALIDATION.json')
              .read_text(encoding='utf-8')
          )
          assert result['status'] == 'validated_not_authorized'
          final = result['final_controller']
          assert final['status'] == 'blocked'
          assert 'candidate PR merge has not passed' not in final['blockers']
          assert 'final-package validation has not passed' not in final['blockers']
          assert 'Drive migration ledger has not passed' not in final['blockers']
          assert 'required integrations has not passed' not in final['blockers']
          assert 'v6.5 rollback restoration has not passed' not in final['blockers']
          assert 'v6.5 rollback evidence reconciliation has not passed' not in final['blockers']
          assert 'live authority readback has not passed' in final['blockers']
          assert 'exact-package Ryan authorization is required' in final['blockers']
          assert result['final_package_validation_present'] is True
          assert result['provider_writes'] == 0
          assert result['publication_performed'] is False
          assert result['tag_created'] is False
          assert result['authority_activated'] is False
          assert result['drive_retired'] is False
          PY
      - name: Create and verify final-controller checksums
        run: |
          (cd v700-final-controller-evidence && \
            find . -type f ! -name FINAL_CONTROLLER_CHECKSUMS.sha256 -print0 | \
            sort -z | xargs -0 sha256sum > FINAL_CONTROLLER_CHECKSUMS.sha256 && \
            sha256sum -c FINAL_CONTROLLER_CHECKSUMS.sha256)
      - name: Retain non-publishing final-controller evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v700-final-controller-${{ github.event.pull_request.head.sha || github.sha }}
          path: v700-final-controller-evidence/
          if-no-files-found: warn
          retention-days: 90