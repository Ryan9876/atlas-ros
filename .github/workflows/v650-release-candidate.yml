name: v650-release-candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'release/RELEASE_SCOPE_V650.md'
      - 'release/RELEASE_NOTES_V650.md'
      - 'release/SBOM_V650_CANDIDATE.cdx.json'
      - 'scripts/validate_v650_candidate.sh'
      - '.github/workflows/v650-release-candidate.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v650-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-exact-v650-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'agent/v650-') ||
      startsWith(github.head_ref, 'release/v650-')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install locked candidate toolchain
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate exact candidate package
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          bash scripts/validate_v650_candidate.sh
      - name: Upload v6.5 candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v650-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            publication/
            candidate-evidence/
          if-no-files-found: warn
          retention-days: 90
