name: v8.2.1 authority activation validation

on:
  pull_request:
    branches: [main]
    paths:
      - governance/AUTHORITY.json
      - governance/RELEASE_INDEX.md
      - release/V821_AUTHORITY_ACTIVATION.md
      - .github/workflows/v821-authority-activation.yml

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ACTIVE_COMMIT: 38285a988ef0e265ad859474c3bdcb58a1744649
      MANIFEST_SHA256: 09dc00c200e5f3f0ab2707b84f886e79e9058f4c490a0a7c6a9151b8fcbf2c04
      SOURCE_SHA256: 2ebddbfacf772f40f5bf3514d3f09a691259304775bafe497685a652675961da
      WHEEL_SHA256: fe9db86412a88acaf2f9860c5ab4a044f296880e19f787ece601a92bd5f282f0
      ROLLBACK_COMMIT: 64c38eb4e83f6edf2d6cff28f7c7556a2c84c0c9
      HISTORICAL_COMMIT: a46619c4b806a63ea1426f06171b53ee219d9d77
      RELEASE_INDEX_SHA256: 438208eea6f53ae5c1a0e875ec28b782226721cbb73afc723e39f26c9cefe0ef
      AUTHORITY_INTEGRITY_SHA256: 79c33430fbfa3e21b3b4af7c2e2a9da2a8fb655dcac037204aef9cd04647f916
      AUDIT_RUN_ID: '30650261814'
      AUDIT_ARTIFACT_ID: '8801087160'
      AUDIT_ARTIFACT_DIGEST: sha256:92177a6d8c4b777a1935f0b4f947addc5d78ed4c46b83b64dff7cd372139afff
      AUDIT_RECEIPT_SHA256: ba26ea9da468ed86c39e75f42b913119c5120d5f148926f610ffe71d7654e93d
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - run: python -m pip install --disable-pip-version-check -e .

      - name: Validate canonical authority and immutable identities
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 v8.2.1)" = "$ACTIVE_COMMIT"
          test "$(sha256sum release/RELEASE_MANIFEST_V821.md | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          test "$(git show "$ACTIVE_COMMIT:release/RELEASE_MANIFEST_V821.md" | sha256sum | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          git fetch origin main:refs/remotes/origin/main --force
          git show origin/main:governance/AUTHORITY.json > PREACTIVATION_AUTHORITY.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from atlas_ros.kernel.authority import AuthorityRecord
          from atlas_ros.kernel.bootstrap import render_release_index
          from atlas_ros.kernel.digests import sha256_digest
          authority=AuthorityRecord.model_validate_json(Path('governance/AUTHORITY.json').read_text())
          active=authority.active_release; rollback=authority.immediate_rollback
          assert active.version=='8.2.1' and active.immutable_commit==os.environ['ACTIVE_COMMIT']
          assert active.tag=='v8.2.1' and active.manifest_path=='release/RELEASE_MANIFEST_V821.md'
          assert active.manifest_sha256==os.environ['MANIFEST_SHA256']
          assert active.source_sha256==os.environ['SOURCE_SHA256']
          assert active.wheel_sha256==os.environ['WHEEL_SHA256']
          assert rollback.version=='8.2.0' and rollback.immutable_commit==os.environ['ROLLBACK_COMMIT']
          assert authority.historical_rollbacks[0].version=='8.1.0'
          assert authority.historical_rollbacks[0].immutable_commit==os.environ['HISTORICAL_COMMIT']
          assert authority.last_promotion_transaction_id=='V821-production-promotion'
          assert authority.release_index.sha256==os.environ['RELEASE_INDEX_SHA256']
          assert authority.integrity.content_sha256==os.environ['AUTHORITY_INTEGRITY_SHA256']
          index=Path('governance/RELEASE_INDEX.md').read_text()
          assert index==render_release_index(authority)
          assert sha256_digest(index)==os.environ['RELEASE_INDEX_SHA256']
          pre=json.loads(Path('PREACTIVATION_AUTHORITY.json').read_text())
          assert pre['active_release']['version']=='8.2.0'
          assert pre['active_release']['immutable_commit']==os.environ['ROLLBACK_COMMIT']
          assert pre['immediate_rollback']['version']=='8.1.0'
          assert pre['immediate_rollback']['immutable_commit']==os.environ['HISTORICAL_COMMIT']
          PY

      - name: Verify independent audit receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUDIT_ARTIFACT_ID}" --jq .digest)" = "$AUDIT_ARTIFACT_DIGEST"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUDIT_ARTIFACT_ID}/zip" > audit.zip
          test "$(sha256sum audit.zip | cut -d' ' -f1)" = "${AUDIT_ARTIFACT_DIGEST#sha256:}"
          unzip -q audit.zip -d audit
          test "$(sha256sum audit/V821_POSTPUBLICATION_AUDIT.json | cut -d' ' -f1)" = "$AUDIT_RECEIPT_SHA256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('audit/V821_POSTPUBLICATION_AUDIT.json').read_text())
          assert r['result']=='passed' and r['tag']=='v8.2.1'
          assert r['tag_commit']==os.environ['ACTIVE_COMMIT']
          assert r['release_assets_verified']==12 and r['package_rebuilt'] is False
          assert r['clean_source_install']==r['clean_wheel_install']=='passed'
          assert r['rollback_v820_restoration']=='passed'
          assert r['historical_v810_verification']=='passed'
          assert r['ledger_baseline_readback']=='passed'
          assert r['provider_writes']==r['todoist_writes']==0
          PY

      - name: Emit activation receipt
        run: |
          mkdir -p activation-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          r={'schema_version':'v821-authority-activation-validation-v1','status':'passed',
             'active_version':'8.2.1','active_commit':'38285a988ef0e265ad859474c3bdcb58a1744649',
             'immediate_rollback_version':'8.2.0','immediate_rollback_commit':'64c38eb4e83f6edf2d6cff28f7c7556a2c84c0c9',
             'historical_rollback_version':'8.1.0','historical_rollback_commit':'a46619c4b806a63ea1426f06171b53ee219d9d77',
             'release_index_sha256':'438208eea6f53ae5c1a0e875ec28b782226721cbb73afc723e39f26c9cefe0ef',
             'authority_integrity_sha256':'79c33430fbfa3e21b3b4af7c2e2a9da2a8fb655dcac037204aef9cd04647f916',
             'publication_audit_run':30650261814,'publication_audit_artifact':8801087160,
             'provider_writes':0,'notion_writes':0,'todoist_writes':0}
          Path('activation-evidence/V821_AUTHORITY_ACTIVATION_VALIDATION.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v821-authority-activation-${{ github.run_id }}
          path: activation-evidence/V821_AUTHORITY_ACTIVATION_VALIDATION.json
          if-no-files-found: error
          retention-days: 90
