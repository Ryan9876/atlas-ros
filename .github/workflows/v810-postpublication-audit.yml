name: v8.1.0 post-publication audit

on:
  pull_request:
    paths:
      - .github/workflows/v810-postpublication-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: v8.1.0
      TAG_COMMIT: a46619c4b806a63ea1426f06171b53ee219d9d77
      PACKAGE_SOURCE_COMMIT: 8843a97e58efe46e632335df95487855b7971a75
      SOURCE_SHA256: f95eb2bcfc7875f6920061d9c5124c5be2cd5dc6dbbbce1cb671f5acdd1bec95
      WHEEL_SHA256: 97a3da1e1e239f5c8fd5af89b38a5c4c1005459e0fc77f830ba4915c6f81fa31
      SBOM_SHA256: e60407aea084ad55cd287bfbf4feb0f61ed6c80036e6b91128f33f8ae73a0d0e
      VALIDATION_SHA256: 2ef1adc95b3d9e3ec268484fa1ab26c097d52d12f3b6061895ac3501a2f4fafc
      CLARIFICATION_SHA256: df2558d519c4bdc1ee151c0c062b6a25768e5117df6cd1a95a4bdc2f0132a33f
      PACKAGE_INDEX_SHA256: 6356de75fac2ac3142f6939d10d55ac80afc7485b621a75c7148fc4e3f7da520
      SOURCE_TREE_SHA256: 6af181fa96e4147241d4c8527124225271f648e1e56d0dd1339a0e920b93fd18
      MANIFEST_SHA256: bd1cd4ad0ad64c3a77a562e55ca334abcfedb0382a640e4c961bbd85372cff43
      AUTHORIZATION_SHA256: 830cc61af8b81097253a07dc4402875fd56f06e2fdc137cee00603e65d675455
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Verify published tag, Release metadata, and preactivation authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          test "$(git rev-list -n 1 "$TAG")" = "$TAG_COMMIT"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish,assets > release.json
          test "$(jq -r .tagName release.json)" = "$TAG"
          test "$(jq -r .isDraft release.json)" = "false"
          test "$(jq -r .isPrerelease release.json)" = "false"
          test "$(jq -r .targetCommitish release.json)" = "$TAG_COMMIT"
          test "$(jq '.assets | length' release.json)" = "11"
          git show origin/main:governance/AUTHORITY.json > LIVE_AUTHORITY.json
          python - <<'PY'
          import json
          from pathlib import Path
          authority = json.loads(Path('LIVE_AUTHORITY.json').read_text())
          assert authority['active_release']['version'] == '8.0.0'
          assert authority['active_release']['immutable_commit'] == '6f05b24fd410ab1f00578019e5336185181ee265'
          assert authority['immediate_rollback']['version'] == '7.8.0'
          assert authority['immediate_rollback']['immutable_commit'] == '72974d1d7da9f07a4c8a41b73b22c0fae3770268'
          PY

      - name: Download and verify every published v8.1.0 asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit/v810 clean-install
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir audit/v810
          expected=(
            CHECKSUMS.sha256
            RELEASE_MANIFEST_V810.md
            SOURCE_TREE.txt
            V810_CLARIFICATION_EVIDENCE.json
            V810_EXACT_PACKAGE_AUTHORIZATION.md
            V810_PACKAGE_INDEX.json
            V810_SBOM.spdx.json
            V810_VALIDATION_RECEIPT.json
            atlas-ros-v810-candidate.zip
            atlas_ros-8.1.0-py3-none-any.whl
            atlas_ros-8.1.0.tar.gz
          )
          for asset in "${expected[@]}"; do test -f "audit/v810/$asset"; done
          test "$(find audit/v810 -maxdepth 1 -type f | wc -l)" = "11"
          test "$(sha256sum audit/v810/atlas_ros-8.1.0.tar.gz | cut -d' ' -f1)" = "$SOURCE_SHA256"
          test "$(sha256sum audit/v810/atlas_ros-8.1.0-py3-none-any.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum audit/v810/V810_SBOM.spdx.json | cut -d' ' -f1)" = "$SBOM_SHA256"
          test "$(sha256sum audit/v810/V810_VALIDATION_RECEIPT.json | cut -d' ' -f1)" = "$VALIDATION_SHA256"
          test "$(sha256sum audit/v810/V810_CLARIFICATION_EVIDENCE.json | cut -d' ' -f1)" = "$CLARIFICATION_SHA256"
          test "$(sha256sum audit/v810/V810_PACKAGE_INDEX.json | cut -d' ' -f1)" = "$PACKAGE_INDEX_SHA256"
          test "$(sha256sum audit/v810/SOURCE_TREE.txt | cut -d' ' -f1)" = "$SOURCE_TREE_SHA256"
          test "$(sha256sum audit/v810/RELEASE_MANIFEST_V810.md | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          test "$(sha256sum audit/v810/V810_EXACT_PACKAGE_AUTHORIZATION.md | cut -d' ' -f1)" = "$AUTHORIZATION_SHA256"
          sed 's#  dist/#  #' audit/v810/CHECKSUMS.sha256 | (cd audit/v810 && sha256sum -c -)
          test "$(jq -r .candidate_commit audit/v810/V810_VALIDATION_RECEIPT.json)" = "$PACKAGE_SOURCE_COMMIT"
          test "$(jq -r .version audit/v810/V810_VALIDATION_RECEIPT.json)" = "8.1.0"
          test "$(jq -r .build_count audit/v810/V810_VALIDATION_RECEIPT.json)" = "1"
          test "$(jq -r .provider_writes audit/v810/V810_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .notion_writes audit/v810/V810_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .todoist_writes audit/v810/V810_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .production_schema_changes audit/v810/V810_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .routing_allowed audit/v810/V810_CLARIFICATION_EVIDENCE.json)" = "false"
          test "$(jq -r .execution_authorized audit/v810/V810_CLARIFICATION_EVIDENCE.json)" = "false"

      - name: Independently clean-install source and wheel
        run: |
          set -euo pipefail
          for kind in sdist wheel; do
            package=audit/v810/atlas_ros-8.1.0.tar.gz
            [ "$kind" = wheel ] && package=audit/v810/atlas_ros-8.1.0-py3-none-any.whl
            python -m venv "clean-install/$kind"
            "clean-install/$kind/bin/python" -m pip install --disable-pip-version-check "$package"
            "clean-install/$kind/bin/python" -c "import atlas_ros; assert atlas_ros.__version__ == '8.1.0'"
            "clean-install/$kind/bin/atlas" status --json
            "clean-install/$kind/bin/atlas" verify --json
          done

      - name: Restore current Active v8.0.0 and verify historical v7.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit/v800 audit/v780
          gh release download v8.0.0 --repo "$GITHUB_REPOSITORY" --dir audit/v800
          gh release download v7.8.0 --repo "$GITHUB_REPOSITORY" --dir audit/v780
          test "$(sha256sum audit/v800/atlas_ros-8.0.0.tar.gz | cut -d' ' -f1)" = "2bfd6fda0879b9508809bdb28a41f43a664bee1098ce3325b3574223cd864047"
          test "$(sha256sum audit/v800/atlas_ros-8.0.0-py3-none-any.whl | cut -d' ' -f1)" = "0a308d4b4d23a86b99fe66a1e17b89340ff5ab84091b9eca277f461d13f8f8a5"
          git show 72974d1d7da9f07a4c8a41b73b22c0fae3770268:release/RELEASE_MANIFEST_V780.md > audit/V780_MANIFEST.md
          source780="$(sed -n 's/^- Source distribution SHA-256: `\([0-9a-f]\{64\}\)`.*/\1/p' audit/V780_MANIFEST.md)"
          wheel780="$(sed -n 's/^- Wheel SHA-256: `\([0-9a-f]\{64\}\)`.*/\1/p' audit/V780_MANIFEST.md)"
          test -n "$source780"
          test -n "$wheel780"
          test "$(sha256sum audit/v780/atlas_ros-7.8.0.tar.gz | cut -d' ' -f1)" = "$source780"
          test "$(sha256sum audit/v780/atlas_ros-7.8.0-py3-none-any.whl | cut -d' ' -f1)" = "$wheel780"

      - name: Emit independent post-publication receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = {
              'schema_version': 'v810-postpublication-audit-v1',
              'tag': 'v8.1.0',
              'tag_commit': 'a46619c4b806a63ea1426f06171b53ee219d9d77',
              'package_source_commit': '8843a97e58efe46e632335df95487855b7971a75',
              'release_assets_verified': 11,
              'package_rebuilt': False,
              'clean_source_install': 'passed',
              'clean_wheel_install': 'passed',
              'rollback_v800_restoration': 'passed',
              'historical_v780_verification': 'passed',
              'production_schema_changes': 0,
              'authority_activated': False,
              'provider_writes': 0,
              'notion_writes': 0,
              'todoist_writes': 0,
              'result': 'passed',
          }
          Path('audit/V810_POSTPUBLICATION_AUDIT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v810-postpublication-audit-${{ github.run_id }}
          path: audit/V810_POSTPUBLICATION_AUDIT.json
          if-no-files-found: error
          retention-days: 90
