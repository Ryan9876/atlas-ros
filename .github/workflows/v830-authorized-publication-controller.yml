name: v8.3.0 authorized publication controller

on:
  push:
    branches: [main]
    paths:
      - release/V830_PUBLICATION_TRIGGER.json

permissions:
  contents: write
  actions: read

concurrency:
  group: v830-authorized-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production-release
    env:
      TAG: v8.3.0
      PACKAGE_SOURCE_COMMIT: ac546f10ee4c1e140d17beaae32f7ea77eb12a51
      IMPLEMENTATION_MERGE: 3e0bf74bf92ab49b6325ab9754a9b258eb23243f
      CANDIDATE_ARTIFACT_ID: '8803236640'
      CANDIDATE_ARTIFACT_DIGEST: sha256:93c4486dd588890b17fcbce2f8703df5dcb60268a1195a5a5bdb472304679d15
      SOURCE_SHA256: d180ac3367229b6bdf5ca160acb5221e8800807909bef85b30aa3615347fafbf
      WHEEL_SHA256: d76a43aa99e629fe8055920f325028a2b64eefa6f10e1d0497419805b622f5fe
      SBOM_SHA256: 77d3d0bbc6b118703aba007cf3068b9d1c83eedefcae1a58ecaeba28fed4f28d
      VALIDATION_SHA256: 85c2748c154c48df9a57d68bd2690eafa8dc3e941c4588b2227382dc55d9f0e8
      PACKAGE_INDEX_SHA256: 6fa7abe238f9e9cf7a26b697a8718b77e1a6b7cfa5e95d13c3cae0f6701c7162
      SOURCE_TREE_SHA256: 104c468cdcb73c14672bb5558046f38ede12c385d5ad22513c8541666fbbd936
      PACKAGE_CHECKSUMS_SHA256: f082d42eee941740052281beee987470f0524d3cb0b324eed20105ae65aef9f1
      EVIDENCE_CHECKSUMS_SHA256: 759e305065c815618b241de2995dca449cf58d532897310d5273e9ec85573eb1
      MANIFEST_SHA256: e9ec73a996e57224d39122f717c86fa53f62005ede88125664339b88651eb972
      AUTHORIZATION_SHA256: 35a4582a7fd059be63e67425b89976b090e9b349cbbfc42c1915ced0f014bd7f
      PREPUBLICATION_ACTIVE_COMMIT: 38285a988ef0e265ad859474c3bdcb58a1744649
      PREPUBLICATION_ROLLBACK_COMMIT: 64c38eb4e83f6edf2d6cff28f7c7556a2c84c0c9
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Verify exact authorized controls
        run: |
          set -euo pipefail
          test "$(sha256sum release/RELEASE_MANIFEST_V830.md | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          test "$(sha256sum release/V830_EXACT_PACKAGE_AUTHORIZATION.md | cut -d' ' -f1)" = "$AUTHORIZATION_SHA256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          authority=json.loads(Path('governance/AUTHORITY.json').read_text())
          assert authority['active_release']['version']=='8.2.1'
          assert authority['active_release']['immutable_commit']==os.environ['PREPUBLICATION_ACTIVE_COMMIT']
          assert authority['immediate_rollback']['version']=='8.2.0'
          assert authority['immediate_rollback']['immutable_commit']==os.environ['PREPUBLICATION_ROLLBACK_COMMIT']
          trigger=json.loads(Path('release/V830_PUBLICATION_TRIGGER.json').read_text())
          assert trigger['candidate_artifact_id']==int(os.environ['CANDIDATE_ARTIFACT_ID'])
          assert trigger['candidate_artifact_sha256']==os.environ['CANDIDATE_ARTIFACT_DIGEST'].removeprefix('sha256:')
          assert trigger['package_source_commit']==os.environ['PACKAGE_SOURCE_COMMIT']
          assert trigger['implementation_merge']==os.environ['IMPLEMENTATION_MERGE']
          assert trigger['release_manifest_sha256']==os.environ['MANIFEST_SHA256']
          assert trigger['authorization_sha256']==os.environ['AUTHORIZATION_SHA256']
          assert trigger['decision_id']=='V4D-65' and trigger['review_id']=='V4V-122'
          assert trigger['automation_id']=='V4M-6' and trigger['runtime_activation']=='held'
          assert trigger['tag']=='v8.3.0'
          PY

      - name: Download and verify retained package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p publication/candidate
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}" --jq .digest)" = "$CANDIDATE_ARTIFACT_DIGEST"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" > publication/atlas-ros-v830-candidate.zip
          test "$(sha256sum publication/atlas-ros-v830-candidate.zip | cut -d' ' -f1)" = "${CANDIDATE_ARTIFACT_DIGEST#sha256:}"
          unzip -q publication/atlas-ros-v830-candidate.zip -d publication/candidate
          test "$(cat publication/candidate/build/V830_SOURCE_COMMIT.txt)" = "$PACKAGE_SOURCE_COMMIT"
          test "$(cat publication/candidate/build/V830_BUILD_COUNT.txt)" = "1"
          test "$(sha256sum publication/candidate/dist/atlas_ros-8.3.0.tar.gz | cut -d' ' -f1)" = "$SOURCE_SHA256"
          test "$(sha256sum publication/candidate/dist/atlas_ros-8.3.0-py3-none-any.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum publication/candidate/build/V830_SBOM.spdx.json | cut -d' ' -f1)" = "$SBOM_SHA256"
          test "$(sha256sum publication/candidate/build/V830_VALIDATION_RECEIPT.json | cut -d' ' -f1)" = "$VALIDATION_SHA256"
          test "$(sha256sum publication/candidate/build/V830_PACKAGE_INDEX.json | cut -d' ' -f1)" = "$PACKAGE_INDEX_SHA256"
          test "$(sha256sum publication/candidate/build/V830_SOURCE_TREE.txt | cut -d' ' -f1)" = "$SOURCE_TREE_SHA256"
          test "$(sha256sum publication/candidate/build/V830_PACKAGE_CHECKSUMS.sha256 | cut -d' ' -f1)" = "$PACKAGE_CHECKSUMS_SHA256"
          test "$(sha256sum publication/candidate/build/V830_EVIDENCE_CHECKSUMS.sha256 | cut -d' ' -f1)" = "$EVIDENCE_CHECKSUMS_SHA256"
          (cd publication/candidate && sha256sum -c build/V830_PACKAGE_CHECKSUMS.sha256)
          (cd publication/candidate && sha256sum -c build/V830_EVIDENCE_CHECKSUMS.sha256)
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt=json.loads(Path('publication/candidate/build/V830_VALIDATION_RECEIPT.json').read_text())
          assert receipt['candidate_commit']==os.environ['PACKAGE_SOURCE_COMMIT']
          assert receipt['version']=='8.3.0' and receipt['build_count']==1
          assert receipt['tests']==1114 and receipt['failures']==receipt['errors']==receipt['skipped']==0
          assert receipt['total_coverage']>=85
          assert receipt['production_provider_writes']==0
          assert receipt['production_webhooks_activated'] is False
          assert receipt['production_policy_activated'] is False
          assert receipt['monitor_only_default'] is True and receipt['kill_switch_default'] is True
          assert receipt['w04_restored_or_written'] is False
          assert receipt['active_restoration_commit']==os.environ['PREPUBLICATION_ACTIVE_COMMIT']
          assert receipt['rollback_restoration_commit']==os.environ['PREPUBLICATION_ROLLBACK_COMMIT']
          PY

      - name: Publish immutable software release without rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! git rev-parse "$TAG" >/dev/null 2>&1
          ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          git config user.name "Atlas ROS Release Bot"
          git config user.email "atlas-ros-release@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Atlas ROS v8.3.0 event reconciliation software release"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
            --title "Atlas ROS v8.3.0" --notes-file release/RELEASE_MANIFEST_V830.md \
            publication/atlas-ros-v830-candidate.zip \
            publication/candidate/dist/atlas_ros-8.3.0.tar.gz \
            publication/candidate/dist/atlas_ros-8.3.0-py3-none-any.whl \
            publication/candidate/build/V830_VALIDATION_RECEIPT.json \
            publication/candidate/build/V830_SBOM.spdx.json \
            publication/candidate/build/V830_PACKAGE_INDEX.json \
            publication/candidate/build/V830_SOURCE_TREE.txt \
            publication/candidate/build/V830_PACKAGE_CHECKSUMS.sha256 \
            publication/candidate/build/V830_EVIDENCE_CHECKSUMS.sha256 \
            release/RELEASE_MANIFEST_V830.md \
            release/V830_EXACT_PACKAGE_AUTHORIZATION.md

