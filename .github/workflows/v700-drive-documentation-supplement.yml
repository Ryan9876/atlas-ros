name: v700-drive-documentation-supplement

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-drive-documentation-supplement:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/v700-canonical-architecture')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate package and documentation evidence chains
        run: |
          set -euo pipefail
          rm -rf v700-drive-documentation-evidence
          python -m scripts.validate_v700_drive_documentation_supplement_chain \
            --package-supplement release/v700-drive-v500-file-supplement.json \
            --package-supplement release/v700-drive-v453-file-supplement.json \
            --package-supplement release/v700-drive-v450-file-supplement.json \
            --documentation-supplement release/v700-drive-v451-documentation-supplement.json \
            --inventory release/v700-drive-file-inventory.json \
            --receipts release/v700-drive-file-listing-receipts.json \
            --folder-tree release/v700-drive-folder-traversal.json \
            --output v700-drive-documentation-evidence/V700_DRIVE_DOCUMENTATION_SUPPLEMENT_VALIDATION.json
      - name: Enforce fail-closed documentation evidence results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  'v700-drive-documentation-evidence/'
                  'V700_DRIVE_DOCUMENTATION_SUPPLEMENT_VALIDATION.json'
              ).read_text(encoding='utf-8')
          )
          assert result['status'] == (
              'partial_file_inventory_with_complete_package_and_'
              'documentation_supplements'
          )
          assert result['package_supplement_count'] == 3
          assert result['package_releases'] == ['5.0', '4.5.3', '4.5.0']
          assert result['documentation_supplement_count'] == 1
          assert result['documentation_releases'] == ['4.5.1']
          assert result['documentation_supplements'][0]['supplement_sha256'] == (
              'def3823e4f69ce1553896f45fe401889046e71a74b99e0dc0bb36e45284c201b'
          )
          assert result['documentation_supplements'][0]['evidence_class'] == (
              'documentation_only'
          )
          assert result['documentation_supplements'][0][
              'package_claims_authorized'
          ] is False
          assert result['combined_known_folder_count'] == 93
          assert result['combined_scanned_folder_count'] == 9
          assert result['combined_unscanned_folder_count'] == 84
          assert result['combined_file_count'] == 56
          assert result['combined_content_hashed_count'] == 55
          assert result['combined_sensitive_item_count'] == 1
          assert result['combined_verified_github_equivalence_count'] == 1
          assert result['combined_governed_legacy_exception_count'] == 54
          assert result['documentation_export_size_bytes'] == 8001
          assert result['enumeration_complete'] is False
          assert result['content_checksums_complete'] is False
          assert result['promotion_ready'] is False
          assert result['provider_writes'] == 0
          assert result['drive_retirement_authorized'] is False
          assert result['credential_action_authorized'] is False
          assert result['package_claims_authorized_for_documentation'] is False
          PY
      - name: Create and verify documentation evidence checksums
        run: |
          (
            cd v700-drive-documentation-evidence
            find . -type f ! -name DOCUMENTATION_EVIDENCE_CHECKSUMS.sha256 -print0 | sort -z |
              xargs -0 sha256sum > DOCUMENTATION_EVIDENCE_CHECKSUMS.sha256
            sha256sum -c DOCUMENTATION_EVIDENCE_CHECKSUMS.sha256
          )
      - name: Retain documentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v700-drive-documentation-${{ github.event.pull_request.head.sha || github.sha }}
          path: v700-drive-documentation-evidence/
          if-no-files-found: warn
          retention-days: 90
