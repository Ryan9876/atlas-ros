name: v8.2.1 independent publication readback

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  readback:
    if: github.event.release.tag_name == 'v8.2.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TAG: v8.2.1
      PACKAGE_SOURCE_COMMIT: 5a71c043292faab39df084e9eeeb0d10634d2627
      SOURCE_SHA256: 2ebddbfacf772f40f5bf3514d3f09a691259304775bafe497685a652675961da
      WHEEL_SHA256: fe9db86412a88acaf2f9860c5ab4a044f296880e19f787ece601a92bd5f282f0
      SBOM_SHA256: f0560023159d28799b897e9fbcd1196edaac3411fd50e47b01acbac565d0a458
      VALIDATION_SHA256: 8214da5cde9b50e76cac96551764da510ffa37e56a9f2660707c36fd6fc9dc00
      PACKAGE_INDEX_SHA256: 8d150bc3331fd071f444991e65119004c7e7e201d764f3ce55af3b1a15fbd8b2
      SOURCE_TREE_SHA256: df700f8fbb8d7dbe6e993d0b55d4bf507bb9818d0f082e16ada284baac25abac
      PACKAGE_CHECKSUMS_SHA256: f5fcf005a2cb0fc14191cec569326c80daa0834df81d38a115af6f3ac9079d01
      EVIDENCE_CHECKSUMS_SHA256: 7b783de7cac6043997cddf34cb23bed2617a19db05df35ab0f551b4f21fd4249
      BASELINE_READBACK_SHA256: 0848a17317a7830eaea41ae5a565c9c3e2300e57d01c5b43f250d1fe7efc6ef1
      MANIFEST_SHA256: 09dc00c200e5f3f0ab2707b84f886e79e9058f4c490a0a7c6a9151b8fcbf2c04
      AUTHORIZATION_SHA256: f3c7fc86b8b91a7cbd7d94418f29039fc0d659a6cd9ba08a2e079def27cba3c0
      CANDIDATE_ZIP_SHA256: 979f030eaecbc5961bd2c8701a87ce8e752908d87312127b8314fb3a85890843
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: v8.2.1
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Verify tag controls and live preactivation authority
        run: |
          set -euo pipefail
          test "$(git describe --exact-match --tags HEAD)" = "$TAG"
          test "$(sha256sum release/RELEASE_MANIFEST_V821.md | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          test "$(sha256sum release/V821_EXACT_PACKAGE_AUTHORIZATION.md | cut -d' ' -f1)" = "$AUTHORIZATION_SHA256"
          test "$(sha256sum release/V821_LEDGER_BASELINE_READBACK.json | cut -d' ' -f1)" = "$BASELINE_READBACK_SHA256"
          git fetch origin main:refs/remotes/origin/main --force
          git show origin/main:governance/AUTHORITY.json > LIVE_AUTHORITY.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('LIVE_AUTHORITY.json').read_text())
          assert a['active_release']['version']=='8.2.0'
          assert a['active_release']['immutable_commit']=='64c38eb4e83f6edf2d6cff28f7c7556a2c84c0c9'
          assert a['immediate_rollback']['version']=='8.1.0'
          assert a['immediate_rollback']['immutable_commit']=='a46619c4b806a63ea1426f06171b53ee219d9d77'
          PY

      - name: Verify all published assets and clean installations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p readback source-install wheel-install rollback-v820 rollback-v810
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir readback
          test "$(sha256sum readback/atlas-ros-v821-candidate.zip | cut -d' ' -f1)" = "$CANDIDATE_ZIP_SHA256"
          test "$(sha256sum readback/atlas_ros-8.2.1.tar.gz | cut -d' ' -f1)" = "$SOURCE_SHA256"
          test "$(sha256sum readback/atlas_ros-8.2.1-py3-none-any.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum readback/V821_SBOM.spdx.json | cut -d' ' -f1)" = "$SBOM_SHA256"
          test "$(sha256sum readback/V821_VALIDATION_RECEIPT.json | cut -d' ' -f1)" = "$VALIDATION_SHA256"
          test "$(sha256sum readback/V821_PACKAGE_INDEX.json | cut -d' ' -f1)" = "$PACKAGE_INDEX_SHA256"
          test "$(sha256sum readback/V821_SOURCE_TREE.txt | cut -d' ' -f1)" = "$SOURCE_TREE_SHA256"
          test "$(sha256sum readback/V821_PACKAGE_CHECKSUMS.sha256 | cut -d' ' -f1)" = "$PACKAGE_CHECKSUMS_SHA256"
          test "$(sha256sum readback/V821_EVIDENCE_CHECKSUMS.sha256 | cut -d' ' -f1)" = "$EVIDENCE_CHECKSUMS_SHA256"
          test "$(sha256sum readback/V821_LEDGER_BASELINE_READBACK.json | cut -d' ' -f1)" = "$BASELINE_READBACK_SHA256"
          test "$(sha256sum readback/RELEASE_MANIFEST_V821.md | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          test "$(sha256sum readback/V821_EXACT_PACKAGE_AUTHORIZATION.md | cut -d' ' -f1)" = "$AUTHORIZATION_SHA256"
          python -m venv source-install
          source-install/bin/python -m pip install --disable-pip-version-check readback/atlas_ros-8.2.1.tar.gz
          source-install/bin/python -c "import atlas_ros; assert atlas_ros.__version__=='8.2.1'"
          python -m venv wheel-install
          wheel-install/bin/python -m pip install --disable-pip-version-check readback/atlas_ros-8.2.1-py3-none-any.whl
          wheel-install/bin/python -c "import atlas_ros; assert atlas_ros.__version__=='8.2.1'"
          gh release download v8.2.0 --repo "$GITHUB_REPOSITORY" --dir rollback-v820
          gh release download v8.1.0 --repo "$GITHUB_REPOSITORY" --dir rollback-v810
          test "$(sha256sum rollback-v820/atlas_ros-8.2.0.tar.gz | cut -d' ' -f1)" = "f38c4b71f9d64be8bb76f61f9519209ee02fb0038827bef7f10ec4c03b345bfe"
          test "$(sha256sum rollback-v820/atlas_ros-8.2.0-py3-none-any.whl | cut -d' ' -f1)" = "a227516a3918d666f29abeb7e1ccc4d0c6a4db5f4564305477aaad8bad6aca45"
          git show a46619c4b806a63ea1426f06171b53ee219d9d77:release/RELEASE_MANIFEST_V810.md > V810_MANIFEST.md
          v810_source="$(sed -n 's/^- Source distribution SHA-256: `\([0-9a-f]\{64\}\)`.*/\1/p' V810_MANIFEST.md)"
          v810_wheel="$(sed -n 's/^- Wheel SHA-256: `\([0-9a-f]\{64\}\)`.*/\1/p' V810_MANIFEST.md)"
          test "$(sha256sum rollback-v810/atlas_ros-8.1.0.tar.gz | cut -d' ' -f1)" = "$v810_source"
          test "$(sha256sum rollback-v810/atlas_ros-8.1.0-py3-none-any.whl | cut -d' ' -f1)" = "$v810_wheel"

      - name: Emit independent readback receipt
        run: |
          mkdir -p readback-evidence
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          receipt={
            'schema_version':'v821-publication-readback-v1','status':'passed','tag':'v8.2.1',
            'tag_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'package_source_commit':'5a71c043292faab39df084e9eeeb0d10634d2627',
            'release_assets_verified':12,'package_rebuilt':False,
            'clean_source_install':'passed','clean_wheel_install':'passed',
            'rollback_v820_restoration':'passed','historical_v810_verification':'passed',
            'ledger_baseline_readback':'passed','provider_writes':0,'todoist_writes':0,
            'authority_activated':False
          }
          Path('readback-evidence/V821_PUBLICATION_READBACK.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v821-independent-publication-readback-${{ github.run_id }}
          path: readback-evidence/V821_PUBLICATION_READBACK.json
          if-no-files-found: error
          retention-days: 90
