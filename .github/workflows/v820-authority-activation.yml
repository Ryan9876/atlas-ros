name: v8.2.0 authority activation validation

on:
  pull_request:
    branches: [main]
    paths:
      - governance/AUTHORITY.json
      - governance/RELEASE_INDEX.md
      - .github/workflows/v820-authority-activation.yml

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ACTIVE_VERSION: 8.2.0
      ACTIVE_COMMIT: 64c38eb4e83f6edf2d6cff28f7c7556a2c84c0c9
      PACKAGE_SOURCE_COMMIT: 887ac2e58e69bcba9ad4bac8ef4345819f88a70a
      MANIFEST_PATH: release/RELEASE_MANIFEST_V820.md
      MANIFEST_SHA256: e7f083d16516a12fa1061ebfa59725e9d651f723e294f958adfecbbb0d8ea250
      SOURCE_SHA256: f38c4b71f9d64be8bb76f61f9519209ee02fb0038827bef7f10ec4c03b345bfe
      WHEEL_SHA256: a227516a3918d666f29abeb7e1ccc4d0c6a4db5f4564305477aaad8bad6aca45
      ROLLBACK_VERSION: 8.1.0
      ROLLBACK_COMMIT: a46619c4b806a63ea1426f06171b53ee219d9d77
      HISTORICAL_VERSION: 8.0.0
      HISTORICAL_COMMIT: 6f05b24fd410ab1f00578019e5336185181ee265
      RELEASE_INDEX_SHA256: 8c37f311f31a80736fdf7bca07b8701b51a468764825e350d4abced53d5cbfc9
      AUTHORITY_INTEGRITY_SHA256: db89f7fa605b80edd26c1d2adb15a8aa7fd8fec3f152c396275d60e1ffa6ef50
      AUDIT_RUN_ID: '30606920311'
      AUDIT_ARTIFACT_ID: '8783939337'
      AUDIT_ARTIFACT_DIGEST: sha256:672c80bf5842db556b4822b04da5966e09632f9f52ca2a60af961987384b0cdb
      AUDIT_RECEIPT_SHA256: 2e6b553e0f50ef7bd5f0fe041b234ed55b644fde04d2bb8d302e695e6c590405
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - run: python -m pip install --disable-pip-version-check -e .

      - name: Validate canonical authority and immutable identities
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          test "$(git rev-list -n 1 v8.2.0)" = "$ACTIVE_COMMIT"
          test "$(sha256sum "$MANIFEST_PATH" | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          test "$(git show "$ACTIVE_COMMIT:$MANIFEST_PATH" | sha256sum | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          git show origin/main:governance/AUTHORITY.json > PREACTIVATION_AUTHORITY.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from atlas_ros.kernel.authority import AuthorityRecord
          from atlas_ros.kernel.bootstrap import render_release_index
          from atlas_ros.kernel.digests import sha256_digest

          authority = AuthorityRecord.model_validate_json(
              Path('governance/AUTHORITY.json').read_text()
          )
          active = authority.active_release
          rollback = authority.immediate_rollback
          assert active.version == os.environ['ACTIVE_VERSION']
          assert active.immutable_commit == os.environ['ACTIVE_COMMIT']
          assert active.tag == 'v8.2.0'
          assert active.manifest_path == os.environ['MANIFEST_PATH']
          assert active.manifest_sha256 == os.environ['MANIFEST_SHA256']
          assert active.source_sha256 == os.environ['SOURCE_SHA256']
          assert active.wheel_sha256 == os.environ['WHEEL_SHA256']
          assert rollback.version == os.environ['ROLLBACK_VERSION']
          assert rollback.immutable_commit == os.environ['ROLLBACK_COMMIT']
          assert authority.historical_rollbacks[0].version == os.environ['HISTORICAL_VERSION']
          assert authority.historical_rollbacks[0].immutable_commit == os.environ['HISTORICAL_COMMIT']
          assert authority.last_promotion_transaction_id == 'V820-production-promotion'
          assert authority.release_index.sha256 == os.environ['RELEASE_INDEX_SHA256']
          assert authority.integrity.content_sha256 == os.environ['AUTHORITY_INTEGRITY_SHA256']
          index = Path('governance/RELEASE_INDEX.md').read_text()
          assert index == render_release_index(authority)
          assert sha256_digest(index) == os.environ['RELEASE_INDEX_SHA256']
          pre = json.loads(Path('PREACTIVATION_AUTHORITY.json').read_text())
          assert pre['active_release']['version'] == '8.1.0'
          assert pre['active_release']['immutable_commit'] == os.environ['ROLLBACK_COMMIT']
          assert pre['immediate_rollback']['version'] == '8.0.0'
          assert pre['immediate_rollback']['immutable_commit'] == os.environ['HISTORICAL_COMMIT']
          manifest = Path(os.environ['MANIFEST_PATH']).read_text()
          for value in (
              os.environ['PACKAGE_SOURCE_COMMIT'], 'V4D-63', 'V4V-118',
              os.environ['ROLLBACK_COMMIT'], os.environ['HISTORICAL_COMMIT'],
          ):
              assert value in manifest
          assert 'No production Notion schema migration is required.' in manifest
          assert 'Required production integrations remain exactly **GitHub, Notion, and Todoist**' in manifest
          PY

      - name: Verify independent publication receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUDIT_ARTIFACT_ID}" --jq .digest)" = "$AUDIT_ARTIFACT_DIGEST"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUDIT_ARTIFACT_ID}/zip" > audit.zip
          test "$(sha256sum audit.zip | cut -d' ' -f1)" = "${AUDIT_ARTIFACT_DIGEST#sha256:}"
          unzip -q audit.zip -d audit
          test "$(sha256sum audit/V820_POSTPUBLICATION_AUDIT.json | cut -d' ' -f1)" = "$AUDIT_RECEIPT_SHA256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt=json.loads(Path('audit/V820_POSTPUBLICATION_AUDIT.json').read_text())
          assert receipt['result']=='passed'
          assert receipt['tag']=='v8.2.0'
          assert receipt['tag_commit']==os.environ['ACTIVE_COMMIT']
          assert receipt['package_source_commit']==os.environ['PACKAGE_SOURCE_COMMIT']
          assert receipt['release_assets_verified']==14
          assert receipt['package_rebuilt'] is False
          assert receipt['clean_source_install']=='passed'
          assert receipt['clean_wheel_install']=='passed'
          assert receipt['rollback_v810_restoration']=='passed'
          assert receipt['historical_v800_verification']=='passed'
          assert receipt['production_schema_changes']==0
          assert receipt['provider_writes']==0
          assert receipt['notion_writes']==0
          assert receipt['todoist_writes']==0
          PY

      - name: Emit activation validation receipt
        run: |
          mkdir -p authority-activation-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt={
            'schema_version':'v820-authority-activation-validation-v1',
            'status':'passed',
            'active_version':os.environ['ACTIVE_VERSION'],
            'active_commit':os.environ['ACTIVE_COMMIT'],
            'package_source_commit':os.environ['PACKAGE_SOURCE_COMMIT'],
            'immediate_rollback_version':os.environ['ROLLBACK_VERSION'],
            'immediate_rollback_commit':os.environ['ROLLBACK_COMMIT'],
            'historical_rollback_version':os.environ['HISTORICAL_VERSION'],
            'historical_rollback_commit':os.environ['HISTORICAL_COMMIT'],
            'release_index_sha256':os.environ['RELEASE_INDEX_SHA256'],
            'authority_integrity_sha256':os.environ['AUTHORITY_INTEGRITY_SHA256'],
            'publication_audit_run':int(os.environ['AUDIT_RUN_ID']),
            'publication_audit_artifact':int(os.environ['AUDIT_ARTIFACT_ID']),
            'production_schema_changes':0,
            'provider_writes':0,
            'notion_writes':0,
            'todoist_writes':0,
          }
          Path('authority-activation-evidence/V820_AUTHORITY_ACTIVATION_VALIDATION.json').write_text(
            json.dumps(receipt,indent=2,sort_keys=True)+'\n'
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v820-authority-activation-validation-${{ github.run_id }}
          path: authority-activation-evidence/V820_AUTHORITY_ACTIVATION_VALIDATION.json
          if-no-files-found: error
          retention-days: 90
