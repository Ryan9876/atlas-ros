name: Materialize v8.2.0 natural comment source

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: v820-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/v8.2.0-natural-comment-reconciliation' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify and apply exact source patch
        run: |
          set -euo pipefail
          cat release/V820_SOURCE_PATCH.part* > /tmp/v820.patch.gz.b64
          base64 -d /tmp/v820.patch.gz.b64 > /tmp/v820.patch.gz
          test "$(sha256sum /tmp/v820.patch.gz | cut -d' ' -f1)" = "c66ffe4d5b69ee39c2e19808ae0db912cefce05591e60b23483d510127130a0b"
          gzip -dc /tmp/v820.patch.gz > /tmp/v820.patch
          test "$(sha256sum /tmp/v820.patch | cut -d' ' -f1)" = "40f51878f2be1f9db2cc313f533b3e318c5e5d819a49c620dd8446331bdc5670"
          git apply --check /tmp/v820.patch
          git apply /tmp/v820.patch
          rm .github/workflows/v820-materialize-natural-comment-source.yml
          rm release/V820_SOURCE_PATCH.part*
          git diff --check
      - name: Commit materialized candidate source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Atlas ROS v8.2.0 natural comment reconciliation"
          git push origin HEAD:agent/v8.2.0-natural-comment-reconciliation
