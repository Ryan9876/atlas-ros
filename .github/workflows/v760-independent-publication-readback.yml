name: v7.6.0 independent publication readback

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v760-independent-publication-readback.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: v7.6.0
      EXPECTED_TAG_COMMIT: a177bcebd1e97d784822e378b661a5ec17aee7d5
      PACKAGE_SOURCE_COMMIT: 9454f229bc489890b308b083050260dd69995899
      ARTIFACT_ID: '8739787363'
      ARTIFACT_SHA256: 1b70f6d73b7aabea37247369544f7790d09949feaa1dad3a7932a3af4469c382
      SOURCE_SHA256: 45bbb603278a54d8385f5ac244a556e0d15aa1f1d6ce7716a3ee34aa85049db7
      WHEEL_SHA256: 0aa3adc3f5cab33de15778e92211258fe6910ea9ca75191de5483e0d3c46a0b9
      SBOM_SHA256: 63f832a34a4cfe37b03205358769530740231eac86d1539844e49eaf2d6d1cd8
      SOURCE_MANIFEST_SHA256: 0b11225c44c27ae623af1b8fc80a51c08116001cb75124e0d44e4cb8ab360ef1
      VALIDATION_SHA256: 2760f23872efe3068dfbc1c1c61e58d7e02000c58fecd2fb5b37ffd93ec84139
      RELEASE_MANIFEST_SHA256: 06ae394a1dc06fbaa3db4d141f0719de9acb93bf2f27653e43e15f46e3541341
      AUTHORIZATION_SHA256: 15b91f58ddd795a18b6dc5fc82af6136c1ab80013c1d2d7a9706f78a8a71d4c4
      SCHEMA_PLAN_SHA256: 7059751eea962e7d8b83c4cfe2491206a500891943a6353de73b763a2eb869ed
      SCHEMA_PLAN_DIGEST: 7d8f3c0a70aee998751a19e304ffc5559916c05935b03fe0726bea04f7c431d1
      MIGRATION_INPUT_DIGEST: a1a6567da9371aad00ba8f5ed430cd6acbade0b35c4d5e53b6e4613a924d5335
      MIGRATION_OUTPUT_DIGEST: 896836a00823a2321add076ca3682c43b0846b1c4dd3dfe66009e82f4f411810
      FEATURE_POLICY_SHA256: 5ec9f7ecd7e871c2992437d0106f42fcfcd5af6226666daf46ab0eb2db3adab4
      FEATURE_POLICY_DIGEST: dc2578c08a2d5eb15a333dda434a445a8802b788a721ca8f1185c3e3a9386ad9
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Verify immutable tag target and manifest
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$TAG")" = "$EXPECTED_TAG_COMMIT"
          git show "$TAG:release/RELEASE_MANIFEST_V760.md" > RELEASE_MANIFEST_V760.md
          git show "$TAG:release/V760_EXACT_PACKAGE_AUTHORIZATION.md" > V760_EXACT_PACKAGE_AUTHORIZATION.md
          test "$(sha256sum RELEASE_MANIFEST_V760.md | cut -d' ' -f1)" = "$RELEASE_MANIFEST_SHA256"
          test "$(sha256sum V760_EXACT_PACKAGE_AUTHORIZATION.md | cut -d' ' -f1)" = "$AUTHORIZATION_SHA256"
          for required in \
            "$PACKAGE_SOURCE_COMMIT" "$ARTIFACT_ID" "$ARTIFACT_SHA256" \
            "$SOURCE_SHA256" "$WHEEL_SHA256" "$SBOM_SHA256" \
            "$SOURCE_MANIFEST_SHA256" "$VALIDATION_SHA256" \
            "$SCHEMA_PLAN_SHA256" "$SCHEMA_PLAN_DIGEST" \
            "$MIGRATION_INPUT_DIGEST" "$MIGRATION_OUTPUT_DIGEST" \
            "$FEATURE_POLICY_SHA256" "$FEATURE_POLICY_DIGEST" \
            'collection://46af021f-eb9a-4eba-b10c-4523e70df0c3' \
            'V4D-57' 'V4V-99'; do
            grep -F "$required" RELEASE_MANIFEST_V760.md
          done

      - name: Download and verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 35
          for asset in \
            atlas_ros-7.6.0.tar.gz \
            atlas_ros-7.6.0-py3-none-any.whl \
            CHECKSUMS.sha256 EVIDENCE_CHECKSUMS.sha256 NESTED_CHECKSUMS.sha256 \
            SBOM.spdx.json SOURCE_COMMIT.txt SOURCE_MANIFEST.sha256 SOURCE_TREE.txt \
            ACTIVE_RESTORATION_COMMIT.txt ROLLBACK_RESTORATION_COMMIT.txt BUILD_COUNT.txt \
            V760_ACTIONS_UTILIZATION.json V760_CONTRACT_SCHEMAS.json \
            V760_DEFINITION_OF_DONE_RECEIPT.json V760_DRAFT_IMMUTABLE_MANIFEST.md \
            V760_EXACT_AUTHORIZATION_BLOCK_TEMPLATE.md V760_FEATURE_POLICY_TARGET.json \
            V760_MIGRATION_PROPOSAL.json V760_NON_PUBLISHING_CONTROLLER.json \
            V760_PACKAGE_INDEX.json V760_PIP_AUDIT_OSV.json V760_PIP_AUDIT_PYPI.json \
            V760_PRIVACY_REVIEW_RECEIPT.json V760_PROPOSAL_EVIDENCE_INDEX.json \
            V760_SCHEMA_PLAN.json V760_SECRET_SCAN.json V760_VALIDATION_RECEIPT.json \
            V760_ZERO_PROVIDER_WRITE_RECEIPT.json \
            sdist-status.json sdist-verify.json wheel-status.json wheel-verify.json \
            RELEASE_MANIFEST_V760.md V760_EXACT_PACKAGE_AUTHORIZATION.md; do
            test -f "release-assets/$asset"
          done
          (cd release-assets && sed 's#  dist/#  #' CHECKSUMS.sha256 | sha256sum -c -)
          (cd release-assets && sed 's#  build/#  #' EVIDENCE_CHECKSUMS.sha256 | sha256sum -c -)
          (cd release-assets && sed 's#  build/#  #' NESTED_CHECKSUMS.sha256 | sha256sum -c -)
          test "$(sha256sum release-assets/atlas_ros-7.6.0.tar.gz | cut -d' ' -f1)" = "$SOURCE_SHA256"
          test "$(sha256sum release-assets/atlas_ros-7.6.0-py3-none-any.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum release-assets/SBOM.spdx.json | cut -d' ' -f1)" = "$SBOM_SHA256"
          test "$(sha256sum release-assets/SOURCE_MANIFEST.sha256 | cut -d' ' -f1)" = "$SOURCE_MANIFEST_SHA256"
          test "$(sha256sum release-assets/V760_VALIDATION_RECEIPT.json | cut -d' ' -f1)" = "$VALIDATION_SHA256"
          test "$(sha256sum release-assets/V760_SCHEMA_PLAN.json | cut -d' ' -f1)" = "$SCHEMA_PLAN_SHA256"
          test "$(sha256sum release-assets/V760_FEATURE_POLICY_TARGET.json | cut -d' ' -f1)" = "$FEATURE_POLICY_SHA256"
          test "$(sha256sum release-assets/RELEASE_MANIFEST_V760.md | cut -d' ' -f1)" = "$RELEASE_MANIFEST_SHA256"
          test "$(sha256sum release-assets/V760_EXACT_PACKAGE_AUTHORIZATION.md | cut -d' ' -f1)" = "$AUTHORIZATION_SHA256"
          cmp RELEASE_MANIFEST_V760.md release-assets/RELEASE_MANIFEST_V760.md
          cmp V760_EXACT_PACKAGE_AUTHORIZATION.md release-assets/V760_EXACT_PACKAGE_AUTHORIZATION.md

      - name: Clean install and verify published packages
        run: |
          set -euo pipefail
          for kind in wheel sdist; do
            python -m venv "$kind-env"
            if [ "$kind" = wheel ]; then
              package=release-assets/atlas_ros-7.6.0-py3-none-any.whl
            else
              package=release-assets/atlas_ros-7.6.0.tar.gz
            fi
            "$kind-env/bin/python" -m pip install --disable-pip-version-check "$package"
            "$kind-env/bin/python" -c "import atlas_ros; assert atlas_ros.__version__ == '7.6.0'"
            "$kind-env/bin/atlas" status --json > "$kind-status.json"
            "$kind-env/bin/atlas" verify --json > "$kind-verify.json"
          done

      - name: Verify deterministic evidence and zero-write receipts
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('release-assets')
          receipt = json.loads((root / 'V760_VALIDATION_RECEIPT.json').read_text())
          assert receipt['status'] == 'passed'
          assert receipt['candidate_commit'] == os.environ['PACKAGE_SOURCE_COMMIT']
          assert receipt['candidate_version'] == '7.6.0'
          assert receipt['active_restoration_commit'] == '28f317f89f717bbf7c8df4832cea82aee26649f2'
          assert receipt['active_restoration_version'] == '7.5.2'
          assert receipt['rollback_restoration_commit'] == '379892900e1c82f84a6716f46a8180d83c836aa7'
          assert receipt['rollback_restoration_version'] == '7.5.1'
          assert receipt['schema_plan_sha256'] == os.environ['SCHEMA_PLAN_SHA256']
          assert receipt['schema_plan_digest'] == os.environ['SCHEMA_PLAN_DIGEST']
          assert receipt['migration_input_snapshot_digest'] == os.environ['MIGRATION_INPUT_DIGEST']
          assert receipt['migration_output_digest'] == os.environ['MIGRATION_OUTPUT_DIGEST']
          assert receipt['feature_policy_sha256'] == os.environ['FEATURE_POLICY_SHA256']
          assert receipt['build_count'] == 1
          assert receipt['provider_writes'] == 0
          assert receipt['todoist_writes'] == 0

          schema = json.loads((root / 'V760_SCHEMA_PLAN.json').read_text())
          assert schema['schema_plan_digest'] == os.environ['SCHEMA_PLAN_DIGEST']
          assert len(schema['create_targets']) == 3
          assert schema['modify_targets'] == []

          migration = json.loads((root / 'V760_MIGRATION_PROPOSAL.json').read_text())
          assert migration['input_snapshot_digest'] == os.environ['MIGRATION_INPUT_DIGEST']
          assert migration['proposed_output_digest'] == os.environ['MIGRATION_OUTPUT_DIGEST']
          assert migration['create_count'] == 0
          assert migration['update_count'] == 0
          assert migration['skip_count'] == 13
          assert migration['idempotency_proof']['duplicates_created'] == 0

          policy = json.loads((root / 'V760_FEATURE_POLICY_TARGET.json').read_text())
          assert policy['feature_policy_digest'] == os.environ['FEATURE_POLICY_DIGEST']
          assert policy['after_release_activation'] == 'disabled'
          assert policy['after_schema_and_migration_readback'] == 'inspection'
          assert policy['inference_enable_target'] == 'disabled_pending_separate_exact_authorization'
          assert policy['forgetting_execution_enabled'] is False

          secret = json.loads((root / 'V760_SECRET_SCAN.json').read_text())
          assert secret['passed'] is True
          assert secret['finding_count'] == 0
          for audit_name in ('V760_PIP_AUDIT_PYPI.json', 'V760_PIP_AUDIT_OSV.json'):
              audit = json.loads((root / audit_name).read_text())
              assert audit['dependencies'] == [] or all(not item.get('vulns') for item in audit['dependencies'])

          zero = json.loads((root / 'V760_ZERO_PROVIDER_WRITE_RECEIPT.json').read_text())
          for field in (
              'provider_writes', 'todoist_writes', 'notion_writes',
              'credential_actions', 'messages_sent', 'calendar_actions',
              'scheduled_actions', 'deletions', 'forgetting_executions',
          ):
              assert zero[field] == 0, field
          PY

      - name: Retain independent publication readback evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          payload = {
              'schema_version': 'v760-independent-publication-readback-v1',
              'status': 'passed',
              'tag': 'v7.6.0',
              'tag_commit': 'a177bcebd1e97d784822e378b661a5ec17aee7d5',
              'package_source_commit': '9454f229bc489890b308b083050260dd69995899',
              'artifact_id': 8739787363,
              'artifact_sha256': '1b70f6d73b7aabea37247369544f7790d09949feaa1dad3a7932a3af4469c382',
              'source_sha256': '45bbb603278a54d8385f5ac244a556e0d15aa1f1d6ce7716a3ee34aa85049db7',
              'wheel_sha256': '0aa3adc3f5cab33de15778e92211258fe6910ea9ca75191de5483e0d3c46a0b9',
              'sbom_sha256': '63f832a34a4cfe37b03205358769530740231eac86d1539844e49eaf2d6d1cd8',
              'source_manifest_sha256': '0b11225c44c27ae623af1b8fc80a51c08116001cb75124e0d44e4cb8ab360ef1',
              'validation_receipt_sha256': '2760f23872efe3068dfbc1c1c61e58d7e02000c58fecd2fb5b37ffd93ec84139',
              'manifest_sha256': '06ae394a1dc06fbaa3db4d141f0719de9acb93bf2f27653e43e15f46e3541341',
              'schema_plan_digest': '7d8f3c0a70aee998751a19e304ffc5559916c05935b03fe0726bea04f7c431d1',
              'migration_input_snapshot_digest': 'a1a6567da9371aad00ba8f5ed430cd6acbade0b35c4d5e53b6e4613a924d5335',
              'migration_output_digest': '896836a00823a2321add076ca3682c43b0846b1c4dd3dfe66009e82f4f411810',
              'feature_policy_digest': 'dc2578c08a2d5eb15a333dda434a445a8802b788a721ca8f1185c3e3a9386ad9',
              'decision_id': 'V4D-57',
              'review_id': 'V4V-99',
              'provider_writes': 0,
              'todoist_writes': 0,
              'authority_changes': 0,
              'production_schema_migrations': 0,
          }
          text = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          Path('V760_INDEPENDENT_READBACK.json').write_text(text)
          Path('V760_INDEPENDENT_READBACK.sha256').write_text(
              hashlib.sha256(text.encode()).hexdigest()
              + '  V760_INDEPENDENT_READBACK.json\n'
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v760-independent-publication-readback
          path: |
            V760_INDEPENDENT_READBACK.json
            V760_INDEPENDENT_READBACK.sha256
            wheel-status.json
            wheel-verify.json
            sdist-status.json
            sdist-verify.json
          if-no-files-found: error
          retention-days: 90
