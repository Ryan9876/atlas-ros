name: v7.3.0 branch bootstrap

on:
  push:
    branches: [agent/v730-operational-awareness-impl]
    paths:
      - '.github/v730-bootstrap/**'
      - '.github/workflows/v730-bootstrap.yml'
      - 'bootstrap_payload/**'
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - '.github/v730-bootstrap/**'
      - '.github/workflows/v730-bootstrap.yml'
      - 'bootstrap_payload/**'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: v730-bootstrap-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/v730-operational-awareness-impl'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out development branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/v730-operational-awareness-impl
          fetch-depth: 1
          persist-credentials: true

      - name: Fetch, verify, and apply exact development payload
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_BLOB_SHA: dce029c2d7f8177e752ef487a88c4fc639b72b48
          PAYLOAD_SHA256: 8268263d27a538a2225f06f760ffe0109eb0df1f845fb1946c8b3ade29195d36
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PAYLOAD_BLOB_SHA}" \
            | python -c 'import base64, json, sys; payload=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(payload["content"]))' \
            > /tmp/v730-payload.tar.gz.b64
          base64 --decode /tmp/v730-payload.tar.gz.b64 > /tmp/v730-payload.tar.gz
          echo "${PAYLOAD_SHA256}  /tmp/v730-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v730-payload.tar.gz
          rm -rf .github/v730-bootstrap .github/workflows/v730-bootstrap.yml bootstrap_payload
          python -m compileall -q src scripts tests/unit/test_v730_operational_awareness.py tests/unit/test_v730_release_controls.py
          PYTHONPATH=src:. pytest -q -o addopts='' tests/unit/test_v730_operational_awareness.py tests/unit/test_v730_release_controls.py

      - name: Commit coherent v7.3.0 implementation
        run: |
          set -euo pipefail
          git config user.name 'atlas-ros-bot'
          git config user.email 'atlas-ros-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement v7.3.0 operational awareness'
          git push origin HEAD:agent/v730-operational-awareness-impl
