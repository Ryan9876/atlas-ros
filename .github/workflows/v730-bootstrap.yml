name: v7.3.0 branch bootstrap

on:
  push:
    branches: [agent/v730-operational-awareness-impl]
    paths:
      - 'bootstrap_payload/**'
      - '.github/v730-bootstrap/**'
      - '.github/workflows/v730-bootstrap.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'bootstrap_payload/**'
      - '.github/v730-bootstrap/**'
      - '.github/workflows/v730-bootstrap.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: v730-bootstrap-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/v730-operational-awareness-impl'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out development branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/v730-operational-awareness-impl
          fetch-depth: 1
          persist-credentials: true

      - name: Reconstruct and verify exact development payload
        run: |
          set -euo pipefail
          cat bootstrap_payload/payload.part*.b64 > /tmp/v730-payload.b64
          base64 --decode /tmp/v730-payload.b64 > /tmp/v730-payload.tar.gz
          echo '8268263d27a538a2225f06f760ffe0109eb0df1f845fb1946c8b3ade29195d36  /tmp/v730-payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v730-payload.tar.gz
          git checkout HEAD -- .github/workflows
          rm -rf bootstrap_payload .github/v730-bootstrap

      - name: Install focused validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[ci]'

      - name: Run focused zero-write validation
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests/unit/test_v730_operational_awareness.py tests/unit/test_v730_release_controls.py
          PYTHONPATH=src:. pytest -q -o addopts='' tests/unit/test_v730_operational_awareness.py tests/unit/test_v730_release_controls.py

      - name: Commit coherent v7.3.0 implementation
        run: |
          set -euo pipefail
          git config user.name 'atlas-ros-bot'
          git config user.email 'atlas-ros-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement v7.3.0 operational awareness'
          git push origin HEAD:agent/v730-operational-awareness-impl
