name: v700-exact-artifact-validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-exact-v700-artifact:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/v700-canonical-architecture')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install exact-artifact validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Resolve successful prerequisite runs at the exact head
        id: prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100")"
            candidate_run="$(jq -r '[.workflow_runs[] | select(.name == "v700-release-candidate" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            standard_run="$(jq -r '[.workflow_runs[] | select(.name == "ci" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            architecture_run="$(jq -r '[.workflow_runs[] | select(.name == "v700-architecture-diagnostics" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            if [[ -n "$candidate_run" && -n "$standard_run" && -n "$architecture_run" ]]; then
              echo "candidate_run_id=$candidate_run" >> "$GITHUB_OUTPUT"
              echo "standard_run_id=$standard_run" >> "$GITHUB_OUTPUT"
              echo "architecture_run_id=$architecture_run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Exact-head prerequisite workflows did not all pass" >&2
          exit 1
      - name: Download and verify exact build-once artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_RUN_ID: ${{ steps.prerequisites.outputs.candidate_run_id }}
        run: |
          set -euo pipefail
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts")"
          name="atlas-ros-v700-candidate-${HEAD_SHA}"
          artifact_id="$(jq -r --arg name "$name" '[.artifacts[] | select(.name == $name and .expired == false)] | last | .id // empty' <<<"$artifacts")"
          artifact_digest="$(jq -r --arg name "$name" '[.artifacts[] | select(.name == $name and .expired == false)] | last | .digest // empty' <<<"$artifacts")"
          [[ -n "$artifact_id" && -n "$artifact_digest" ]]
          normalized_digest="${artifact_digest#sha256:}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > exact-candidate.zip
          echo "${normalized_digest}  exact-candidate.zip" | sha256sum -c -
          rm -rf exact-artifact
          mkdir exact-artifact
          unzip -q exact-candidate.zip -d exact-artifact
          publication_checksums="$(find exact-artifact -name PUBLICATION_CHECKSUMS.sha256 -print -quit)"
          [[ -n "$publication_checksums" ]]
          artifact_root="$(dirname "$publication_checksums")"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$normalized_digest" >> "$GITHUB_OUTPUT"
          echo "artifact_root=$artifact_root" >> "$GITHUB_OUTPUT"
      - name: Verify publication and nested evidence checksums
        env:
          ARTIFACT_ROOT: ${{ steps.artifact.outputs.artifact_root }}
        run: |
          set -euo pipefail
          (cd "$ARTIFACT_ROOT" && sha256sum -c PUBLICATION_CHECKSUMS.sha256)
          (cd "$ARTIFACT_ROOT/evidence" && sha256sum -c EVIDENCE_CHECKSUMS.sha256)
      - name: Install exact candidate and immutable rollback releases
        id: installations
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ROOT: ${{ steps.artifact.outputs.artifact_root }}
        run: |
          set -euo pipefail
          candidate_wheel="$(find "$ARTIFACT_ROOT" -maxdepth 1 -name 'atlas_ros-7.0.0rc1-*.whl' -print -quit)"
          [[ -n "$candidate_wheel" ]]
          python -m venv exact-v700
          exact-v700/bin/python -m pip install --disable-pip-version-check "$candidate_wheel"
          exact-v700/bin/python -c "import atlas_ros; assert atlas_ros.__version__ == '7.0.0rc1'"
          exact-v700/bin/atlas status --json > exact-v700-status.json

          mkdir -p v650-assets v620-assets
          gh release download v6.5.0 --repo "$GITHUB_REPOSITORY" --dir v650-assets
          gh release download v6.2.0 --repo "$GITHUB_REPOSITORY" --dir v620-assets
          (cd v650-assets && sha256sum -c CHECKSUMS.sha256)
          (cd v620-assets && sha256sum -c CHECKSUMS.sha256)
          v650_wheel="$(find v650-assets -name 'atlas_ros-6.5.0*.whl' -print -quit)"
          v620_wheel="$(find v620-assets -name 'atlas_ros-6.2.0*.whl' -print -quit)"
          [[ -n "$v650_wheel" && -n "$v620_wheel" ]]
          python -m venv exact-v650
          exact-v650/bin/python -m pip install --disable-pip-version-check "$v650_wheel"
          exact-v650/bin/python -c "import atlas_ros; assert atlas_ros.__version__ == '6.5.0'"
          python -m venv exact-v620
          exact-v620/bin/python -m pip install --disable-pip-version-check "$v620_wheel"
          exact-v620/bin/python -c "import atlas_ros; assert atlas_ros.__version__ == '6.2.0'"
      - name: Reconcile immutable v6.5 rollback evidence
        run: |
          set -euo pipefail
          mkdir -p v700-exact-evidence
          clean_version="$(exact-v650/bin/python -c 'import atlas_ros; print(atlas_ros.__version__)')"
          python -m scripts.validate_v650_rollback_evidence \
            --repository-root . \
            --source-commit bb6d6fea70d6824c9bc6a42e63ba36cc88029260 \
            --release-assets-dir v650-assets \
            --clean-install-version "$clean_version" \
            --restoration-passed \
            --metadata-exception-record-url https://app.notion.com/p/3aab8344ad2c81efad29c12b9b132374 \
            --output v700-exact-evidence/V650_ROLLBACK_EVIDENCE.json \
            2>&1 | tee v700-exact-evidence/V650_ROLLBACK_RECONCILIATION.log
      - name: Compare equivalent v7 and v6.5 performance
        run: |
          python scripts/compare_v700_performance.py \
            --candidate-python exact-v700/bin/python \
            --baseline-python exact-v650/bin/python \
            --dataset benchmarks/execution-planning-v1.json \
            --iterations 7 \
            --max-regression 0.10 \
            --output v700-exact-evidence/V700_V650_PERFORMANCE.json
      - name: Validate recursive Drive folder and file evidence
        run: |
          python -m scripts.validate_v700_drive_folder_tree \
            --input release/v700-drive-folder-traversal.json \
            --output v700-exact-evidence/V700_DRIVE_FOLDER_TRAVERSAL_VALIDATION.json
          python -m scripts.validate_v700_drive_file_inventory \
            --inventory release/v700-drive-file-inventory.json \
            --folder-tree release/v700-drive-folder-traversal.json \
            --output v700-exact-evidence/V700_DRIVE_FILE_INVENTORY_VALIDATION.json
          python -m scripts.validate_v700_drive_file_listing_receipts \
            --receipts release/v700-drive-file-listing-receipts.json \
            --inventory release/v700-drive-file-inventory.json \
            --folder-tree release/v700-drive-folder-traversal.json \
            --output v700-exact-evidence/V700_DRIVE_FILE_LISTING_RECEIPTS_VALIDATION.json
          python -m scripts.validate_v700_drive_release_supplement \
            --supplement release/v700-drive-v500-file-supplement.json \
            --inventory release/v700-drive-file-inventory.json \
            --receipts release/v700-drive-file-listing-receipts.json \
            --folder-tree release/v700-drive-folder-traversal.json \
            --output v700-exact-evidence/V700_DRIVE_V500_SUPPLEMENT_VALIDATION.json
          python -m scripts.validate_v700_drive_release_supplement_chain \
            --supplement release/v700-drive-v500-file-supplement.json \
            --supplement release/v700-drive-v453-file-supplement.json \
            --inventory release/v700-drive-file-inventory.json \
            --receipts release/v700-drive-file-listing-receipts.json \
            --folder-tree release/v700-drive-folder-traversal.json \
            --output v700-exact-evidence/V700_DRIVE_RELEASE_SUPPLEMENT_CHAIN_VALIDATION.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('v700-exact-evidence')
          folders = json.loads(
              (root / 'V700_DRIVE_FOLDER_TRAVERSAL_VALIDATION.json')
              .read_text(encoding='utf-8')
          )
          files = json.loads(
              (root / 'V700_DRIVE_FILE_INVENTORY_VALIDATION.json')
              .read_text(encoding='utf-8')
          )
          receipts = json.loads(
              (root / 'V700_DRIVE_FILE_LISTING_RECEIPTS_VALIDATION.json')
              .read_text(encoding='utf-8')
          )
          supplement = json.loads(
              (root / 'V700_DRIVE_V500_SUPPLEMENT_VALIDATION.json')
              .read_text(encoding='utf-8')
          )
          chain = json.loads(
              (root / 'V700_DRIVE_RELEASE_SUPPLEMENT_CHAIN_VALIDATION.json')
              .read_text(encoding='utf-8')
          )
          assert folders['status'] == (
              'folder_traversal_complete_item_inventory_incomplete'
          )
          assert folders['folder_count'] == 93
          assert folders['promotion_ready'] is False
          assert folders['provider_writes'] == 0
          assert folders['drive_retirement_authorized'] is False
          assert files['status'] == 'partial_file_inventory'
          assert files['known_folder_count'] == 93
          assert files['scanned_folder_count'] == 5
          assert files['unscanned_folder_count'] == 88
          assert files['file_count'] == 16
          assert files['content_hashed_count'] == 15
          assert files['sensitive_item_count'] == 1
          assert files['verified_github_equivalence_count'] == 1
          assert files['governed_legacy_exception_count'] == 14
          assert files['promotion_ready'] is False
          assert files['provider_writes'] == 0
          assert files['drive_retirement_authorized'] is False
          assert files['credential_action_authorized'] is False
          assert receipts['status'] == 'partial_file_listing_receipts'
          assert receipts['known_folder_count'] == 93
          assert receipts['listed_folder_count'] == 5
          assert receipts['unscanned_folder_count'] == 88
          assert receipts['file_count'] == 16
          assert receipts['bound_file_count'] == 16
          assert receipts['enumeration_complete'] is False
          assert receipts['provider_writes'] == 0
          assert receipts['drive_retirement_authorized'] is False
          assert supplement['status'] == (
              'partial_file_inventory_with_complete_v500_supplement'
          )
          assert supplement['supplement_sha256'] == (
              'de6d34904f1e926da1b9e27d7be4502ab255a50662dcc5b70da89ea081de1196'
          )
          assert supplement['v500_scanned_folder_count'] == 1
          assert supplement['v500_file_count'] == 18
          assert supplement['v500_content_hashed_count'] == 18
          assert supplement['v500_listing_count'] == 1
          assert supplement['v500_candidate_checksum_reconciled'] is True
          assert supplement['combined_known_folder_count'] == 93
          assert supplement['combined_scanned_folder_count'] == 6
          assert supplement['combined_unscanned_folder_count'] == 87
          assert supplement['combined_file_count'] == 34
          assert supplement['combined_content_hashed_count'] == 33
          assert supplement['combined_sensitive_item_count'] == 1
          assert supplement['combined_verified_github_equivalence_count'] == 1
          assert supplement['combined_governed_legacy_exception_count'] == 32
          assert supplement['promotion_ready'] is False
          assert supplement['provider_writes'] == 0
          assert supplement['drive_retirement_authorized'] is False
          assert supplement['credential_action_authorized'] is False
          assert chain['status'] == (
              'partial_file_inventory_with_complete_release_supplement_chain'
          )
          assert chain['supplement_count'] == 2
          assert chain['releases'] == ['5.0', '4.5.3']
          assert chain['supplements'][0]['supplement_sha256'] == (
              'de6d34904f1e926da1b9e27d7be4502ab255a50662dcc5b70da89ea081de1196'
          )
          assert chain['supplements'][1]['supplement_sha256'] == (
              '20d51011071c1a976c52756b1f1d667075e7d60a0001e692daf290209e9ab6d6'
          )
          assert chain['combined_known_folder_count'] == 93
          assert chain['combined_scanned_folder_count'] == 7
          assert chain['combined_unscanned_folder_count'] == 86
          assert chain['combined_file_count'] == 47
          assert chain['combined_content_hashed_count'] == 46
          assert chain['combined_sensitive_item_count'] == 1
          assert chain['combined_verified_github_equivalence_count'] == 1
          assert chain['combined_governed_legacy_exception_count'] == 45
          assert chain['enumeration_complete'] is False
          assert chain['content_checksums_complete'] is False
          assert chain['promotion_ready'] is False
          assert chain['provider_writes'] == 0
          assert chain['drive_retirement_authorized'] is False
          assert chain['credential_action_authorized'] is False
          PY
      - name: Validate exact artifact and simulate release transactions
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ARTIFACT_ROOT: ${{ steps.artifact.outputs.artifact_root }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          CANDIDATE_RUN_ID: ${{ steps.prerequisites.outputs.candidate_run_id }}
          STANDARD_RUN_ID: ${{ steps.prerequisites.outputs.standard_run_id }}
          ARCHITECTURE_RUN_ID: ${{ steps.prerequisites.outputs.architecture_run_id }}
        run: |
          args=(
            --artifact-root "$ARTIFACT_ROOT"
            --candidate-sha "$HEAD_SHA"
            --artifact-id "$ARTIFACT_ID"
            --artifact-digest "$ARTIFACT_DIGEST"
            --candidate-run-id "$CANDIDATE_RUN_ID"
            --standard-ci-run-id "$STANDARD_RUN_ID"
            --architecture-run-id "$ARCHITECTURE_RUN_ID"
            --performance v700-exact-evidence/V700_V650_PERFORMANCE.json
            --integration-snapshot release/v700-integration-readiness.json
            --rollback-evidence v700-exact-evidence/V650_ROLLBACK_EVIDENCE.json
            --output-dir v700-exact-evidence
          )
          if [[ -f release/v700-drive-migration-inventory.json ]]; then
            args+=(--drive-inventory release/v700-drive-migration-inventory.json)
          fi
          python -m scripts.validate_v700_exact_artifact "${args[@]}"
          (
            cd v700-exact-evidence
            find . -type f ! -name EXACT_ARTIFACT_CHECKSUMS.sha256 -print0 | sort -z |
              xargs -0 sha256sum > EXACT_ARTIFACT_CHECKSUMS.sha256
            sha256sum -c EXACT_ARTIFACT_CHECKSUMS.sha256
          )
      - name: Retain exact-artifact Full Validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v700-exact-artifact-${{ github.event.pull_request.head.sha || github.sha }}
          path: v700-exact-evidence/
          if-no-files-found: warn
          retention-days: 90
