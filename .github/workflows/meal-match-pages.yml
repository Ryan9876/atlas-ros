name: Deploy Meal Match to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "meal-match/**"
      - ".github/workflows/meal-match-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: meal-match-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: touch meal-match/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: meal-match
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
