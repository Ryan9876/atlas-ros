name: v8.2.0 post-publication audit

on:
  pull_request:
    paths:
      - .github/workflows/v820-postpublication-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TAG: v8.2.0
      TAG_COMMIT: 64c38eb4e83f6edf2d6cff28f7c7556a2c84c0c9
      PACKAGE_SOURCE_COMMIT: 887ac2e58e69bcba9ad4bac8ef4345819f88a70a
      CANDIDATE_ZIP_SHA256: 03ea656ece8e548907ced312c99166376cc7f0c482a9c5ec21cd8b08b2411a72
      SOURCE_SHA256: f38c4b71f9d64be8bb76f61f9519209ee02fb0038827bef7f10ec4c03b345bfe
      WHEEL_SHA256: a227516a3918d666f29abeb7e1ccc4d0c6a4db5f4564305477aaad8bad6aca45
      SBOM_SHA256: 13e78efabe79e2ca0dc9f6a3243e18bc004adc0942119890ecf455ee5bf0aa40
      VALIDATION_SHA256: a3f730672bfad61ae7aead57ce08db31787e3d9827589e3c666fa2ec152fdfa6
      NATURAL_COMMENT_SHA256: fd32950b6c72e3a209423b4d2b05c04bd19e8d6efd2c8c28c0696742cf3843ee
      NO_MIGRATION_SHA256: 2173ea523da83c1e4f233ce6527a09aa026e72123445fe32bdb23a965558b53f
      SCHEMA_READBACK_SHA256: 360b31c0b7fe6ce67a86433f924dc048b9b294be16da8a7e5d8c0d3c820590c6
      PACKAGE_INDEX_SHA256: 8b2deed9355bd268ca396852ceb03acae91de9ce93c9ac52a759a53969949121
      SOURCE_TREE_SHA256: be0f6f2609476cabec185ae6fcc74b5b5600139be7a7be5fb5877debd76dc42a
      PACKAGE_CHECKSUMS_SHA256: 5be3da86c84d874644d524ac723d6edbbe48d0b5b995d468e5dfd322ec99cb60
      EVIDENCE_CHECKSUMS_SHA256: 890600bc52fb7501fc97c72bb7d99ae04bf381af67c383e2f76e7c0c2aaca49f
      MANIFEST_SHA256: e7f083d16516a12fa1061ebfa59725e9d651f723e294f958adfecbbb0d8ea250
      AUTHORIZATION_SHA256: 012c69017261fe1db5fe0b8804bf3462e8fe9dd788ab0ac1f1bbf01a7d182993
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Verify published tag, Release metadata, and preactivation authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          test "$(git rev-list -n 1 "$TAG")" = "$TAG_COMMIT"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish,assets > release.json
          test "$(jq -r .tagName release.json)" = "$TAG"
          test "$(jq -r .isDraft release.json)" = "false"
          test "$(jq -r .isPrerelease release.json)" = "false"
          test "$(jq -r .targetCommitish release.json)" = "$TAG_COMMIT"
          test "$(jq '.assets | length' release.json)" = "14"
          git show origin/main:governance/AUTHORITY.json > LIVE_AUTHORITY.json
          python - <<'PY'
          import json
          from pathlib import Path
          authority = json.loads(Path('LIVE_AUTHORITY.json').read_text())
          assert authority['active_release']['version'] == '8.1.0'
          assert authority['active_release']['immutable_commit'] == 'a46619c4b806a63ea1426f06171b53ee219d9d77'
          assert authority['immediate_rollback']['version'] == '8.0.0'
          assert authority['immediate_rollback']['immutable_commit'] == '6f05b24fd410ab1f00578019e5336185181ee265'
          PY

      - name: Download and verify every published v8.2.0 asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit/v820/candidate clean-install
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir audit/v820
          expected=(
            EVIDENCE_CHECKSUMS.sha256
            PACKAGE_CHECKSUMS.sha256
            RELEASE_MANIFEST_V820.md
            SOURCE_TREE.txt
            V820_EXACT_PACKAGE_AUTHORIZATION.md
            V820_NATURAL_COMMENT_EVIDENCE.json
            V820_NO_MIGRATION_RECEIPT.json
            V820_PACKAGE_INDEX.json
            V820_RECONCILIATION_STATE_SCHEMA_READBACK.json
            V820_SBOM.spdx.json
            V820_VALIDATION_RECEIPT.json
            atlas-ros-v820-candidate.zip
            atlas_ros-8.2.0-py3-none-any.whl
            atlas_ros-8.2.0.tar.gz
          )
          for asset in "${expected[@]}"; do test -f "audit/v820/$asset"; done
          test "$(find audit/v820 -maxdepth 1 -type f | wc -l)" = "14"
          test "$(sha256sum audit/v820/atlas-ros-v820-candidate.zip | cut -d' ' -f1)" = "$CANDIDATE_ZIP_SHA256"
          test "$(sha256sum audit/v820/atlas_ros-8.2.0.tar.gz | cut -d' ' -f1)" = "$SOURCE_SHA256"
          test "$(sha256sum audit/v820/atlas_ros-8.2.0-py3-none-any.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum audit/v820/V820_SBOM.spdx.json | cut -d' ' -f1)" = "$SBOM_SHA256"
          test "$(sha256sum audit/v820/V820_VALIDATION_RECEIPT.json | cut -d' ' -f1)" = "$VALIDATION_SHA256"
          test "$(sha256sum audit/v820/V820_NATURAL_COMMENT_EVIDENCE.json | cut -d' ' -f1)" = "$NATURAL_COMMENT_SHA256"
          test "$(sha256sum audit/v820/V820_NO_MIGRATION_RECEIPT.json | cut -d' ' -f1)" = "$NO_MIGRATION_SHA256"
          test "$(sha256sum audit/v820/V820_RECONCILIATION_STATE_SCHEMA_READBACK.json | cut -d' ' -f1)" = "$SCHEMA_READBACK_SHA256"
          test "$(sha256sum audit/v820/V820_PACKAGE_INDEX.json | cut -d' ' -f1)" = "$PACKAGE_INDEX_SHA256"
          test "$(sha256sum audit/v820/SOURCE_TREE.txt | cut -d' ' -f1)" = "$SOURCE_TREE_SHA256"
          test "$(sha256sum audit/v820/PACKAGE_CHECKSUMS.sha256 | cut -d' ' -f1)" = "$PACKAGE_CHECKSUMS_SHA256"
          test "$(sha256sum audit/v820/EVIDENCE_CHECKSUMS.sha256 | cut -d' ' -f1)" = "$EVIDENCE_CHECKSUMS_SHA256"
          test "$(sha256sum audit/v820/RELEASE_MANIFEST_V820.md | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          test "$(sha256sum audit/v820/V820_EXACT_PACKAGE_AUTHORIZATION.md | cut -d' ' -f1)" = "$AUTHORIZATION_SHA256"
          unzip -q audit/v820/atlas-ros-v820-candidate.zip -d audit/v820/candidate
          (cd audit/v820/candidate && sha256sum -c build/PACKAGE_CHECKSUMS.sha256)
          (cd audit/v820/candidate && sha256sum -c build/EVIDENCE_CHECKSUMS.sha256)
          test "$(jq -r .candidate_commit audit/v820/V820_VALIDATION_RECEIPT.json)" = "$PACKAGE_SOURCE_COMMIT"
          test "$(jq -r .version audit/v820/V820_VALIDATION_RECEIPT.json)" = "8.2.0"
          test "$(jq -r .build_count audit/v820/V820_VALIDATION_RECEIPT.json)" = "1"
          test "$(jq -r .provider_writes audit/v820/V820_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .notion_writes audit/v820/V820_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .todoist_writes audit/v820/V820_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .production_schema_changes audit/v820/V820_VALIDATION_RECEIPT.json)" = "0"
          test "$(jq -r .production_notion_migration_required audit/v820/V820_NO_MIGRATION_RECEIPT.json)" = "false"
          test "$(jq -r .attended_authorization_required audit/v820/V820_NATURAL_COMMENT_EVIDENCE.json)" = "true"
          test "$(jq -r .replay_mutation_count audit/v820/V820_NATURAL_COMMENT_EVIDENCE.json)" = "0"

      - name: Independently clean-install source and wheel
        run: |
          set -euo pipefail
          for kind in sdist wheel; do
            package=audit/v820/atlas_ros-8.2.0.tar.gz
            [ "$kind" = wheel ] && package=audit/v820/atlas_ros-8.2.0-py3-none-any.whl
            python -m venv "clean-install/$kind"
            "clean-install/$kind/bin/python" -m pip install --disable-pip-version-check "$package"
            "clean-install/$kind/bin/python" -c "import atlas_ros; assert atlas_ros.__version__ == '8.2.0'"
            "clean-install/$kind/bin/atlas" status --json
            "clean-install/$kind/bin/atlas" verify --json
          done

      - name: Restore current Active v8.1.0 and verify historical v8.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit/v810 audit/v800
          gh release download v8.1.0 --repo "$GITHUB_REPOSITORY" --dir audit/v810
          gh release download v8.0.0 --repo "$GITHUB_REPOSITORY" --dir audit/v800
          test "$(sha256sum audit/v810/atlas_ros-8.1.0.tar.gz | cut -d' ' -f1)" = "f95eb2bcfc7875f6920061d9c5124c5be2cd5dc6dbbbce1cb671f5acdd1bec95"
          test "$(sha256sum audit/v810/atlas_ros-8.1.0-py3-none-any.whl | cut -d' ' -f1)" = "97a3da1e1e239f5c8fd5af89b38a5c4c1005459e0fc77f830ba4915c6f81fa31"
          test "$(sha256sum audit/v800/atlas_ros-8.0.0.tar.gz | cut -d' ' -f1)" = "2bfd6fda0879b9508809bdb28a41f43a664bee1098ce3325b3574223cd864047"
          test "$(sha256sum audit/v800/atlas_ros-8.0.0-py3-none-any.whl | cut -d' ' -f1)" = "0a308d4b4d23a86b99fe66a1e17b89340ff5ab84091b9eca277f461d13f8f8a5"

      - name: Emit independent post-publication receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = {
              'schema_version': 'v820-postpublication-audit-v1',
              'tag': 'v8.2.0',
              'tag_commit': '64c38eb4e83f6edf2d6cff28f7c7556a2c84c0c9',
              'package_source_commit': '887ac2e58e69bcba9ad4bac8ef4345819f88a70a',
              'release_assets_verified': 14,
              'package_rebuilt': False,
              'clean_source_install': 'passed',
              'clean_wheel_install': 'passed',
              'rollback_v810_restoration': 'passed',
              'historical_v800_verification': 'passed',
              'production_schema_changes': 0,
              'authority_activated': False,
              'provider_writes': 0,
              'notion_writes': 0,
              'todoist_writes': 0,
              'result': 'passed',
          }
          Path('audit/V820_POSTPUBLICATION_AUDIT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v820-postpublication-audit-${{ github.run_id }}
          path: audit/V820_POSTPUBLICATION_AUDIT.json
          if-no-files-found: error
          retention-days: 90
