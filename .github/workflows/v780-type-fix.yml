name: v7.8.0 scoped type correction

on:
  push:
    branches: [agent/v7.8.0-corrective-hardening]
    paths:
      - '.github/workflows/v780-type-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/v7.8.0-corrective-hardening
          fetch-depth: 0
      - name: Apply exact type corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(content.replace(old, new))

          archetypes = 'src/atlas_ros/engines/archetypes_v62.py'
          replace(archetypes, '            evidence: list[str] = []\n', '            evidence_codes_for_archetype: list[str] = []\n')
          replace(archetypes, '                evidence.append("canonical_intent_type")\n', '                evidence_codes_for_archetype.append("canonical_intent_type")\n')
          replace(archetypes, '                evidence.extend(f"trigger:{term}" for term in matched)\n', '                evidence_codes_for_archetype.extend(f"trigger:{term}" for term in matched)\n')
          replace(archetypes, '                evidence.append("v611_cloudvision_acceptance_contract")\n', '                evidence_codes_for_archetype.append("v611_cloudvision_acceptance_contract")\n')
          replace(archetypes, '            scores.append((score, archetype, tuple(evidence or ("fallback_similarity",))))\n', '            scores.append(\n                (\n                    score,\n                    archetype,\n                    tuple(evidence_codes_for_archetype or ("fallback_similarity",)),\n                )\n            )\n')
          replace(archetypes, '        evidence = tuple(\n', '        evidence_references = tuple(\n')
          replace(archetypes, '            "evidence": [item.model_dump(mode="json") for item in evidence],\n', '            "evidence": [item.model_dump(mode="json") for item in evidence_references],\n')
          replace(archetypes, '            evidence=evidence,\n', '            evidence=evidence_references,\n')

          intent_graph = 'src/atlas_ros/engines/intent_graph_v62.py'
          replace(intent_graph, 'from typing import Any\n', 'from typing import Any, Literal\n')
          replace(intent_graph, '            horizon = "blocked" if outcome.role.value == "competing" else "current"\n', '            horizon: Literal["blocked", "current"] = (\n                "blocked" if outcome.role.value == "competing" else "current"\n            )\n')

          domain = 'src/atlas_ros/engines/domain_knowledge_v62.py'
          replace(domain, '        missing = ()\n', '        missing: tuple[str, ...] = ()\n')
          PY
          git diff --check
          git diff --exit-code --quiet && { echo 'No changes produced'; exit 1; } || true
      - name: Commit scoped corrections
        run: |
          git config user.name 'atlas-ros-governed-bot'
          git config user.email 'atlas-ros-governed-bot@users.noreply.github.com'
          git add src/atlas_ros/engines/archetypes_v62.py \
                  src/atlas_ros/engines/intent_graph_v62.py \
                  src/atlas_ros/engines/domain_knowledge_v62.py
          git commit -m 'fix: satisfy strict typing across v6.2 engines'
          git push origin HEAD:agent/v7.8.0-corrective-hardening
