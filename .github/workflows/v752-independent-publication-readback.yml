name: v7.5.2 independent publication readback

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v752-independent-publication-readback.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: v7.5.2
      EXPECTED_TAG_COMMIT: 28f317f89f717bbf7c8df4832cea82aee26649f2
      PACKAGE_SOURCE_COMMIT: b9ff553e7c53d735b91e6d535f8daafa28f97076
      SOURCE_SHA256: 0b3ba57b26a8d9709a6df6f9b1de0105d0c181e2740d89a9d2dae5c2b4afbca1
      WHEEL_SHA256: 039221d810850d424c10754a0ba38b60f63f55a32c853f28f7ac6415d8a74281
      SBOM_SHA256: 40ca8133d02990cedb30eb364c8e323ecdafc32be6767059c63990db12e47000
      SOURCE_MANIFEST_SHA256: 90da5a0fd71ad10305235f3d5955fb297cf25a349db2cb6132b9f4a27c8b14f8
      VALIDATION_SHA256: d021e51abae05e7bab3c1350925fe1547df69926b714affdfbe15123db8dc92d
      BASELINE_DIGEST: 288094e15a70b866be204c20d06a541c357ecbe4d32746aec1afa61171c6df16
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Verify immutable tag target and manifest
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$TAG")" = "$EXPECTED_TAG_COMMIT"
          git show "$TAG:release/RELEASE_MANIFEST_V752.md" > RELEASE_MANIFEST_V752.md
          for required in \
            "$PACKAGE_SOURCE_COMMIT" \
            '8736952867' \
            'e8d5eb816d332874daf214b4e326952d958f2ab7820d46039057dda9149456ee' \
            "$SOURCE_SHA256" \
            "$WHEEL_SHA256" \
            "$SBOM_SHA256" \
            "$SOURCE_MANIFEST_SHA256" \
            "$VALIDATION_SHA256" \
            "$BASELINE_DIGEST" \
            'collection://46af021f-eb9a-4eba-b10c-4523e70df0c3' \
            'V4D-56' \
            'V4V-98'; do
            grep -F "$required" RELEASE_MANIFEST_V752.md
          done

      - name: Download and verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          for asset in \
            atlas_ros-7.5.2.tar.gz \
            atlas_ros-7.5.2-py3-none-any.whl \
            CHECKSUMS.sha256 \
            EVIDENCE_CHECKSUMS.sha256 \
            NESTED_CHECKSUMS.sha256 \
            SBOM.spdx.json \
            SOURCE_COMMIT.txt \
            SOURCE_MANIFEST.sha256 \
            SOURCE_TREE.txt \
            ACTIVE_RESTORATION_COMMIT.txt \
            ROLLBACK_RESTORATION_COMMIT.txt \
            BUILD_COUNT.txt \
            V752_ACTIONS_UTILIZATION.json \
            V752_BASELINE_REPORT.json \
            V752_CONTRACT_SCHEMAS.json \
            V752_DATA_MINIMIZATION_RECEIPT.json \
            V752_DEFINITION_OF_DONE_RECEIPT.json \
            V752_NON_PUBLISHING_CONTROLLER.json \
            V752_PACKAGE_INDEX.json \
            V752_PIP_AUDIT_OSV.json \
            V752_PIP_AUDIT_PYPI.json \
            V752_SECRET_SCAN.json \
            V752_VALIDATION_RECEIPT.json \
            V752_ZERO_PROVIDER_WRITE_RECEIPT.json \
            sdist-status.json \
            sdist-verify.json \
            wheel-status.json \
            wheel-verify.json \
            RELEASE_MANIFEST_V752.md; do
            test -f "release-assets/$asset"
          done
          (cd release-assets && sed 's#  dist/#  #' CHECKSUMS.sha256 | sha256sum -c -)
          (cd release-assets && sed 's#  build/#  #' EVIDENCE_CHECKSUMS.sha256 | sha256sum -c -)
          (cd release-assets && sed 's#  build/#  #' NESTED_CHECKSUMS.sha256 | sha256sum -c -)
          test "$(sha256sum release-assets/atlas_ros-7.5.2.tar.gz | cut -d' ' -f1)" = "$SOURCE_SHA256"
          test "$(sha256sum release-assets/atlas_ros-7.5.2-py3-none-any.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum release-assets/SBOM.spdx.json | cut -d' ' -f1)" = "$SBOM_SHA256"
          test "$(sha256sum release-assets/SOURCE_MANIFEST.sha256 | cut -d' ' -f1)" = "$SOURCE_MANIFEST_SHA256"
          test "$(sha256sum release-assets/V752_VALIDATION_RECEIPT.json | cut -d' ' -f1)" = "$VALIDATION_SHA256"
          cmp RELEASE_MANIFEST_V752.md release-assets/RELEASE_MANIFEST_V752.md

      - name: Clean install and verify published packages
        run: |
          set -euo pipefail
          for kind in wheel sdist; do
            python -m venv "$kind-env"
            if [ "$kind" = wheel ]; then
              package=release-assets/atlas_ros-7.5.2-py3-none-any.whl
            else
              package=release-assets/atlas_ros-7.5.2.tar.gz
            fi
            "$kind-env/bin/python" -m pip install --disable-pip-version-check "$package"
            "$kind-env/bin/python" -c "import atlas_ros; assert atlas_ros.__version__ == '7.5.2'"
            "$kind-env/bin/atlas" status --json > "$kind-status.json"
            "$kind-env/bin/atlas" verify --json > "$kind-verify.json"
          done

      - name: Verify deterministic evidence and zero-write receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('release-assets/V752_VALIDATION_RECEIPT.json').read_text())
          assert receipt['status'] == 'passed'
          assert receipt['candidate_commit'] == 'b9ff553e7c53d735b91e6d535f8daafa28f97076'
          assert receipt['candidate_version'] == '7.5.2'
          assert receipt['active_restoration_commit'] == '379892900e1c82f84a6716f46a8180d83c836aa7'
          assert receipt['active_restoration_version'] == '7.5.1'
          assert receipt['rollback_restoration_commit'] == 'f2a14c1e401debe77040d0db836e343be6f337e3'
          assert receipt['rollback_restoration_version'] == '7.5.0'
          assert receipt['baseline_report_deterministic_digest'] == '288094e15a70b866be204c20d06a541c357ecbe4d32746aec1afa61171c6df16'
          assert receipt['build_count'] == 1
          assert receipt['provider_writes'] == 0
          assert receipt['todoist_writes'] == 0

          baseline = json.loads(Path('release-assets/V752_BASELINE_REPORT.json').read_text())
          assert baseline['deterministic_digest'] == '288094e15a70b866be204c20d06a541c357ecbe4d32746aec1afa61171c6df16'
          assert baseline['provider_write_count'] == 0
          assert baseline['todoist_write_count'] == 0

          schemas = json.loads(Path('release-assets/V752_CONTRACT_SCHEMAS.json').read_text())
          assert set(schemas) == {
              'ClarificationEventV1',
              'ClarificationEvaluationCaseV1',
              'CounterfactualDecisionV1',
              'QuestionQualityAssessmentV1',
              'ClarificationOutcomeV1',
              'ClarificationMetricsV1',
              'ClarificationEvaluationReportV1',
          }

          minimization = json.loads(Path('release-assets/V752_DATA_MINIMIZATION_RECEIPT.json').read_text())
          assert minimization['status'] == 'passed'
          assert minimization['fixture_count'] >= 12
          assert minimization['provider_writes'] == 0
          assert minimization['todoist_writes'] == 0

          controller = json.loads(Path('release-assets/V752_NON_PUBLISHING_CONTROLLER.json').read_text())
          for field in (
              'provider_writes', 'todoist_writes', 'authority_changes',
              'production_schema_migrations', 'release_publications',
              'production_tags_created_or_moved', 'integration_scope_expansions',
              'credential_actions', 'messages_sent', 'calendar_actions',
              'scheduled_actions', 'deletions',
          ):
              assert controller[field] == 0, field

          zero = json.loads(Path('release-assets/V752_ZERO_PROVIDER_WRITE_RECEIPT.json').read_text())
          for field in (
              'provider_writes', 'todoist_writes', 'notion_writes',
              'credential_actions', 'messages_sent', 'calendar_actions',
              'scheduled_actions', 'deletions',
          ):
              assert zero[field] == 0, field

          secret = json.loads(Path('release-assets/V752_SECRET_SCAN.json').read_text())
          assert secret['status'] == 'passed'
          assert secret['findings'] == []
          for audit_name in ('V752_PIP_AUDIT_PYPI.json', 'V752_PIP_AUDIT_OSV.json'):
              audit = json.loads(Path('release-assets', audit_name).read_text())
              assert audit['dependencies'] == [] or all(not item.get('vulns') for item in audit['dependencies'])
          PY

      - name: Retain independent publication readback evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_sha = hashlib.sha256(Path('release-assets/RELEASE_MANIFEST_V752.md').read_bytes()).hexdigest()
          payload = {
              'schema_version': 'v752-independent-publication-readback-v1',
              'status': 'passed',
              'tag': 'v7.5.2',
              'tag_commit': '28f317f89f717bbf7c8df4832cea82aee26649f2',
              'package_source_commit': 'b9ff553e7c53d735b91e6d535f8daafa28f97076',
              'artifact_id': 8736952867,
              'artifact_sha256': 'e8d5eb816d332874daf214b4e326952d958f2ab7820d46039057dda9149456ee',
              'source_sha256': '0b3ba57b26a8d9709a6df6f9b1de0105d0c181e2740d89a9d2dae5c2b4afbca1',
              'wheel_sha256': '039221d810850d424c10754a0ba38b60f63f55a32c853f28f7ac6415d8a74281',
              'sbom_sha256': '40ca8133d02990cedb30eb364c8e323ecdafc32be6767059c63990db12e47000',
              'source_manifest_sha256': '90da5a0fd71ad10305235f3d5955fb297cf25a349db2cb6132b9f4a27c8b14f8',
              'validation_receipt_sha256': 'd021e51abae05e7bab3c1350925fe1547df69926b714affdfbe15123db8dc92d',
              'manifest_sha256': manifest_sha,
              'baseline_report_deterministic_digest': '288094e15a70b866be204c20d06a541c357ecbe4d32746aec1afa61171c6df16',
              'integration_inventory_data_source': 'collection://46af021f-eb9a-4eba-b10c-4523e70df0c3',
              'decision_id': 'V4D-56',
              'review_id': 'V4V-98',
              'provider_writes': 0,
              'todoist_writes': 0,
              'authority_changes': 0,
              'production_schema_migrations': 0,
          }
          text = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          Path('V752_INDEPENDENT_READBACK.json').write_text(text)
          Path('V752_INDEPENDENT_READBACK.sha256').write_text(
              hashlib.sha256(text.encode()).hexdigest()
              + '  V752_INDEPENDENT_READBACK.json\n'
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v752-independent-publication-readback
          path: |
            V752_INDEPENDENT_READBACK.json
            V752_INDEPENDENT_READBACK.sha256
            wheel-status.json
            wheel-verify.json
            sdist-status.json
            sdist-verify.json
          if-no-files-found: error
          retention-days: 90