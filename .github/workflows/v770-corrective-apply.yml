name: v7.7.0 scoped corrective apply

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/v770-corrective-apply.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/v770-initialization-circuit-breaker'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact Ruff UP038 correction
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/atlas_ros/kernel/initialization_circuit_breaker.py')
          text = path.read_text()
          old = '''        return isinstance(\n            error,\n            (TransientInitializationReadError, TimeoutError, ConnectionError),\n        ) and not isinstance(error, PermissionError)\n'''
          new = '''        return isinstance(\n            error,\n            TransientInitializationReadError | TimeoutError | ConnectionError,\n        ) and not isinstance(error, PermissionError)\n'''
          if old not in text:
              raise SystemExit('expected Ruff correction target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'atlas-ros-release-bot'
          git config user.email 'atlas-ros-release-bot@users.noreply.github.com'
          git add src/atlas_ros/kernel/initialization_circuit_breaker.py
          git commit -m 'Fix v7.7.0 retry classifier lint'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
