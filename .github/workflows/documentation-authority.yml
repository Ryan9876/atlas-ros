name: Documentation Authority

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "README.md"
      - "docs/**"
      - "release/**"
      - "scripts/validate_documentation_authority.py"
      - ".github/workflows/documentation-authority.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "release/**"
      - "scripts/validate_documentation_authority.py"
      - ".github/workflows/documentation-authority.yml"
  workflow_dispatch:

concurrency:
  group: documentation-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-documentation-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Validate current documentation authority
        run: python scripts/validate_documentation_authority.py
