name: Documentation Authority

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "release/**"
      - "scripts/validate_documentation_authority.py"
      - ".github/workflows/documentation-authority.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "release/**"
      - "scripts/validate_documentation_authority.py"
      - ".github/workflows/documentation-authority.yml"

permissions:
  contents: read

jobs:
  validate-documentation-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate current documentation authority
        run: python scripts/validate_documentation_authority.py
