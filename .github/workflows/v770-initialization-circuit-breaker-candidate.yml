name: v7.7.0 initialization circuit breaker candidate

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact frozen candidate commit SHA
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/v770-initialization-circuit-breaker-candidate.yml'
      - 'pyproject.toml'
      - 'src/atlas_ros/__init__.py'
      - 'src/atlas_ros/contracts/authority.py'
      - 'src/atlas_ros/entry_points/main.py'
      - 'src/atlas_ros/kernel/bootstrap.py'
      - 'src/atlas_ros/kernel/initialization_circuit_breaker.py'
      - 'schemas/authority/initialization-receipt.schema.json'
      - 'scripts/build_v770_*'
      - 'tests/unit/test_v770_*'
      - 'tests/unit/test_v711_fast_initialization.py'
      - 'tests/unit/test_v711_initialization_schemas.py'
      - 'tests/unit/test_v700_entry_points.py'
      - 'tests/unit/test_v710_lazy_warm_runtime.py'
      - 'docs/**/V770_*'
      - 'release/RELEASE_NOTES_V770.md'
      - 'release/RELEASE_MANIFEST_V770_DRAFT_TEMPLATE.md'
      - 'release/specifications/V770.yaml'

concurrency:
  group: v770-initialization-${{ github.event.pull_request.number || inputs.candidate_commit || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_VERSION: 7.7.0

jobs:
  lean:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[ci]'
      - name: Targeted static validation
        run: |
          ruff check \
            src/atlas_ros/contracts/authority.py \
            src/atlas_ros/entry_points/main.py \
            src/atlas_ros/kernel/bootstrap.py \
            src/atlas_ros/kernel/initialization_circuit_breaker.py \
            scripts/build_v770_candidate_evidence.py \
            scripts/build_v770_initialization_evidence.py \
            tests/unit/test_v770_initialization_circuit_breaker.py
          mypy \
            src/atlas_ros/contracts/authority.py \
            src/atlas_ros/kernel/bootstrap.py \
            src/atlas_ros/kernel/initialization_circuit_breaker.py
      - name: Targeted tests and evidence
        run: |
          test ! -d .atlas-v770-bootstrap
          test ! -f .github/workflows/v770-bootstrap-apply.yml
          pytest --no-cov -q \
            tests/unit/test_v700_entry_points.py \
            tests/unit/test_v710_lazy_warm_runtime.py \
            tests/unit/test_v711_fast_initialization.py \
            tests/unit/test_v711_initialization_schemas.py \
            tests/unit/test_v770_initialization_circuit_breaker.py
          python scripts/build_v770_initialization_evidence.py \
            --output-directory build/lean-v770-evidence

  full-candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start elapsed-time record
        run: echo "WORKFLOW_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Bind exact source and live restoration authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          mkdir -p build dist clean-install restoration
          git rev-parse HEAD > build/SOURCE_COMMIT.txt
          git ls-tree -r --full-tree HEAD > build/SOURCE_TREE.txt
          git fetch --no-tags origin main:refs/remotes/origin/main
          git show origin/main:governance/AUTHORITY.json > build/LIVE_AUTHORITY.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          authority = json.loads(Path('build/LIVE_AUTHORITY.json').read_text())
          active = authority['active_release']
          rollback = authority['immediate_rollback']
          assert active['version'] == '7.6.1', active
          assert rollback['version'] == '7.6.0', rollback
          values = {
              'ACTIVE_VERSION': active['version'],
              'ACTIVE_TAG': active['tag'],
              'ACTIVE_COMMIT': active['immutable_commit'],
              'ROLLBACK_VERSION': rollback['version'],
              'ROLLBACK_TAG': rollback['tag'],
              'ROLLBACK_COMMIT': rollback['immutable_commit'],
          }
          for key, value in values.items():
              print(f'{key}={value}')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Complete correctness gates
        run: |
          test ! -d .atlas-v770-bootstrap
          test ! -f .github/workflows/v770-bootstrap-apply.yml
          ruff check .
          mypy src/atlas_ros
          python scripts/validate_architecture.py
          python scripts/validate_devtools_boundary.py
          pytest
      - name: Deterministic circuit-breaker evidence
        run: |
          python scripts/build_v770_initialization_evidence.py --output-directory build
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('build/V770_INITIALIZATION_EVIDENCE_INDEX.json').read_text())
          cold = json.loads(Path('build/V770_COLD_INITIALIZATION_RECEIPT.json').read_text())
          warm = json.loads(Path('build/V770_WARM_INITIALIZATION_RECEIPT.json').read_text())
          assert index['status'] == 'passed'
          assert cold['external_read_count'] == 6 and cold['execution_path'] == 'cold'
          assert warm['external_read_count'] == 4 and warm['execution_path'] == 'warm'
          assert index['provider_writes'] == 0
          assert index['google_drive_reads'] == 0
          assert index['post_terminal_executed_calls'] == 0
          assert index['general_searches'] == 0
          assert index['plugin_skill_reads'] == 0
          PY
      - name: Secret and dependency audits
        run: |
          rm -rf secret-scan-root && mkdir secret-scan-root
          while IFS= read -r -d '' file; do
            mkdir -p "secret-scan-root/$(dirname "$file")"
            cp "$file" "secret-scan-root/$file"
          done < <(git diff --name-only -z --diff-filter=ACMR origin/main...HEAD -- \
            '*.cfg' '*.ini' '*.json' '*.md' '*.py' '*.toml' '*.txt' '*.yaml' '*.yml')
          python scripts/scan_candidate_secrets.py \
            --root secret-scan-root \
            --output build/V770_SECRET_SCAN.json
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service pypi \
            --requirement requirements.runtime.lock --format json \
            --output build/V770_PIP_AUDIT_PYPI.json
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service osv \
            --requirement requirements.runtime.lock --format json \
            --output build/V770_PIP_AUDIT_OSV.json
          python scripts/evaluate_dependency_audit.py \
            build/V770_PIP_AUDIT_PYPI.json build/V770_PIP_AUDIT_OSV.json
      - name: Build exact package once
        run: |
          rm -rf dist
          python -m build
          test -f dist/atlas_ros-7.7.0.tar.gz
          test -f dist/atlas_ros-7.7.0-py3-none-any.whl
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          printf '1\n' > build/BUILD_COUNT.txt
      - name: Clean source and wheel installation
        run: |
          for kind in sdist wheel; do
            package=dist/atlas_ros-7.7.0.tar.gz
            [ "$kind" = wheel ] && package=dist/atlas_ros-7.7.0-py3-none-any.whl
            python -m venv "clean-install/$kind"
            "clean-install/$kind/bin/python" -m pip install \
              --disable-pip-version-check "$package"
            "clean-install/$kind/bin/python" -c \
              "import atlas_ros; assert atlas_ros.__version__ == '7.7.0'"
            "clean-install/$kind/bin/atlas" status --json > "build/${kind}-status.json"
            "clean-install/$kind/bin/atlas" verify --json > "build/${kind}-verify.json"
          done
      - name: Restore Active predecessor and preserved rollback
        run: |
          mkdir -p "restoration/active-${ACTIVE_VERSION}" \
            "restoration/rollback-${ROLLBACK_VERSION}"
          gh release download "$ACTIVE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "restoration/active-${ACTIVE_VERSION}"
          gh release download "$ROLLBACK_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "restoration/rollback-${ROLLBACK_VERSION}"
          (cd "restoration/active-${ACTIVE_VERSION}" && \
            sed 's#  dist/#  #' CHECKSUMS.sha256 | sha256sum -c -)
          (cd "restoration/rollback-${ROLLBACK_VERSION}" && \
            sed 's#  dist/#  #' CHECKSUMS.sha256 | sha256sum -c -)
          active_wheel=$(find "restoration/active-${ACTIVE_VERSION}" -name '*.whl' -print -quit)
          rollback_wheel=$(find "restoration/rollback-${ROLLBACK_VERSION}" -name '*.whl' -print -quit)
          python -m venv restoration/active-clean
          python -m venv restoration/rollback-clean
          restoration/active-clean/bin/python -m pip install \
            --disable-pip-version-check "$active_wheel"
          restoration/rollback-clean/bin/python -m pip install \
            --disable-pip-version-check "$rollback_wheel"
          restoration/active-clean/bin/python -c \
            "import atlas_ros; assert atlas_ros.__version__ == '${ACTIVE_VERSION}'"
          restoration/rollback-clean/bin/python -c \
            "import atlas_ros; assert atlas_ros.__version__ == '${ROLLBACK_VERSION}'"
          printf '%s\n' "$ACTIVE_COMMIT" > build/ACTIVE_RESTORATION_COMMIT.txt
          printf '%s\n' "$ROLLBACK_COMMIT" > build/ROLLBACK_RESTORATION_COMMIT.txt
      - name: Complete exact candidate evidence
        run: |
          python scripts/build_v770_candidate_evidence.py
          sha256sum -c build/CHECKSUMS.sha256
          sha256sum -c build/EVIDENCE_CHECKSUMS.sha256
          sha256sum -c build/NESTED_CHECKSUMS.sha256
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v770-initialization-${{ inputs.candidate_commit }}
          path: |
            dist/
            build/
          if-no-files-found: error
          retention-days: 90
      - name: Record retained artifact identity
        run: |
          {
            echo '## v7.7.0 retained candidate artifact'
            echo "- Artifact ID: ${{ steps.upload.outputs.artifact-id }}"
            echo "- Artifact digest: ${{ steps.upload.outputs.artifact-digest }}"
            echo "- Candidate commit: $CANDIDATE_COMMIT"
            echo '- Publication authorized: false'
            echo '- Production activation authorized: false'
          } >> "$GITHUB_STEP_SUMMARY"
