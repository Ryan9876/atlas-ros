name: v700-full-ci

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  workflow_dispatch:

concurrency:
  group: v700-full-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-full-v700:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/v700-canonical-architecture')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install full validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate exact source identity
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Ruff
        run: ruff check .
      - name: Validate architecture boundaries
        run: python scripts/validate_architecture.py
      - name: Validate deterministic dependency policy
        run: |
          python scripts/validate_dependency_lock.py requirements.runtime.lock
          python scripts/validate_vulnerability_exceptions.py
      - name: Strict MyPy
        run: mypy src
      - name: Test
        run: pytest
      - name: Evaluate Execution Planning and Task Economy
        run: |
          mkdir -p v700-full-ci-evidence
          python scripts/evaluate_execution_planning.py \
            --dataset benchmarks/execution-planning-v1.json \
            --output v700-full-ci-evidence/EXECUTION_PLANNING_REPORT.json
      - name: Build package
        run: python -m build
      - name: Validate configuration loading
        run: python -c "from atlas_ros.config.loader import load_config; assert load_config('todoist')['version']"
      - name: Audit against PyPI advisory service
        id: pypi_audit
        continue-on-error: true
        run: |
          mkdir -p v700-dependency-audit
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service pypi \
            --requirement requirements.runtime.lock --format json \
            --output v700-dependency-audit/pip-audit-pypi.json \
            >v700-dependency-audit/pip-audit-pypi.stdout \
            2>v700-dependency-audit/pip-audit-pypi.stderr
      - name: Audit against OSV advisory service
        id: osv_audit
        continue-on-error: true
        run: |
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service osv \
            --requirement requirements.runtime.lock --format json \
            --output v700-dependency-audit/pip-audit-osv.json \
            >v700-dependency-audit/pip-audit-osv.stdout \
            2>v700-dependency-audit/pip-audit-osv.stderr
      - name: Enforce current advisory and exception policy
        run: |
          python scripts/evaluate_dependency_audit.py \
            v700-dependency-audit/pip-audit-pypi.json \
            v700-dependency-audit/pip-audit-osv.json
      - name: Create exact-head validation evidence
        if: always()
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp requirements.runtime.lock v700-dependency-audit/
          cp security/vulnerability-exceptions.yml v700-dependency-audit/
          printf 'target_sha=%s\nPyPI step outcome=%s\nOSV step outcome=%s\nprovider_writes=0\n' \
            "$TARGET_SHA" '${{ steps.pypi_audit.outcome }}' '${{ steps.osv_audit.outcome }}' \
            > v700-dependency-audit/workflow-outcomes.txt
          (cd v700-dependency-audit && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
          printf '{"target_sha":"%s","provider_writes":0,"publication_performed":false}\n' \
            "$TARGET_SHA" > v700-full-ci-evidence/FULL_CI_STATUS.json
          (cd v700-full-ci-evidence && sha256sum * > FULL_CI_CHECKSUMS.sha256 && sha256sum -c FULL_CI_CHECKSUMS.sha256)
      - name: Retain dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-audit-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: v700-dependency-audit/
          if-no-files-found: error
          retention-days: 90
      - name: Retain full CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v700-full-ci-${{ github.event.pull_request.head.sha || github.sha }}
          path: v700-full-ci-evidence/
          if-no-files-found: error
          retention-days: 90
