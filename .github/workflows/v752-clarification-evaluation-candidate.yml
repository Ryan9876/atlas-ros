name: v7.5.2 clarification evaluation candidate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - '.github/workflows/v752-clarification-evaluation-candidate.yml'
      - 'pyproject.toml'
      - 'src/atlas_ros/__init__.py'
      - 'src/atlas_ros/entry_points/main.py'
      - 'src/atlas_ros/clarification_*_v752.py'
      - 'tests/test_v752_clarification_evaluation.py'
      - 'tests/unit/test_v700_entry_points.py'
      - 'tests/unit/test_v710_lazy_warm_runtime.py'
      - 'tests/fixtures/v752_clarification_cases.json'
      - 'docs/**/V752_*'

concurrency:
  group: v752-clarification-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_VERSION: 7.5.2

jobs:
  lean:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[ci]'
      - run: ruff check src/atlas_ros/clarification_*_v752.py tests/test_v752_clarification_evaluation.py
      - run: mypy src/atlas_ros/clarification_*_v752.py
      - run: pytest --no-cov -q tests/test_v752_clarification_evaluation.py

  full-candidate:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Bind source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          mkdir -p build dist clean-install restoration
          git rev-parse HEAD > build/SOURCE_COMMIT.txt
          git ls-tree -r --full-tree HEAD > build/SOURCE_TREE.txt

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Install validation environment
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Resolve live restoration authority
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          authority = json.loads(Path('governance/AUTHORITY.json').read_text())
          print(f"ACTIVE_VERSION={authority['active_release']['version']}")
          print(f"ACTIVE_TAG={authority['active_release']['tag']}")
          print(f"ACTIVE_COMMIT={authority['active_release']['immutable_commit']}")
          print(f"ROLLBACK_VERSION={authority['immediate_rollback']['version']}")
          print(f"ROLLBACK_TAG={authority['immediate_rollback']['tag']}")
          print(f"ROLLBACK_COMMIT={authority['immediate_rollback']['immutable_commit']}")
          PY

      - name: Run complete correctness gates
        run: |
          set -euo pipefail
          ruff check .
          mypy src/atlas_ros
          python scripts/validate_architecture.py
          python scripts/validate_devtools_boundary.py
          pytest

      - name: Validate clarification evaluation boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fixture_document = json.loads(
              Path('tests/fixtures/v752_clarification_cases.json').read_text()
          )
          assert fixture_document['schema_version'] == '1.0'
          cases = fixture_document['cases']
          assert len(cases) >= 12
          assert len({case['case_id'] for case in cases}) == len(cases)
          assert all(case['capture'] for case in cases)
          assert all(case['provenance'] for case in cases)
          assert all(case['expected'] for case in cases)
          PY
          pytest --no-cov -q \
            tests/test_v752_clarification_evaluation.py::test_provider_writes_are_rejected \
            tests/test_v752_clarification_evaluation.py::test_shadow_evaluation_is_inert_and_digest_bound

      - name: Scan source and audit dependencies
        run: |
          python scripts/scan_candidate_secrets.py --root . --output build/V752_SECRET_SCAN.json
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service pypi \
            --requirement requirements.runtime.lock --format json \
            --output build/V752_PIP_AUDIT_PYPI.json
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service osv \
            --requirement requirements.runtime.lock --format json \
            --output build/V752_PIP_AUDIT_OSV.json
          python scripts/evaluate_dependency_audit.py \
            build/V752_PIP_AUDIT_PYPI.json build/V752_PIP_AUDIT_OSV.json

      - name: Build exact package once
        run: |
          set -euo pipefail
          rm -rf dist
          python -m build
          test -f dist/atlas_ros-7.5.2.tar.gz
          test -f dist/atlas_ros-7.5.2-py3-none-any.whl
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          printf '1\n' > build/BUILD_COUNT.txt
          sha256sum dist/* > build/CHECKSUMS.sha256

      - name: Generate source manifest and SPDX SBOM
        run: |
          git ls-files -z | sort -z | xargs -0 sha256sum > build/SOURCE_MANIFEST.sha256
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest_lines = Path('build/SOURCE_MANIFEST.sha256').read_text().splitlines()
          files = []
          relationships = []
          for index, line in enumerate(manifest_lines, start=1):
              digest, path = line.split(maxsplit=1)
              spdx_id = f'SPDXRef-File-{index}'
              files.append(
                  {
                      'fileName': path,
                      'SPDXID': spdx_id,
                      'checksums': [
                          {'algorithm': 'SHA256', 'checksumValue': digest}
                      ],
                      'licenseConcluded': 'NOASSERTION',
                      'copyrightText': 'NOASSERTION',
                  }
              )
              relationships.append(
                  {
                      'spdxElementId': 'SPDXRef-Package-atlas-ros',
                      'relationshipType': 'CONTAINS',
                      'relatedSpdxElement': spdx_id,
                  }
              )
          created = subprocess.check_output(
              ['git', 'show', '-s', '--format=%cI', 'HEAD'], text=True
          ).strip()
          package = {
              'name': 'atlas-ros',
              'SPDXID': 'SPDXRef-Package-atlas-ros',
              'versionInfo': os.environ['CANDIDATE_VERSION'],
              'downloadLocation': 'NOASSERTION',
              'filesAnalyzed': True,
              'licenseConcluded': 'NOASSERTION',
              'licenseDeclared': 'NOASSERTION',
              'copyrightText': 'NOASSERTION',
          }
          sbom = {
              'spdxVersion': 'SPDX-2.3',
              'dataLicense': 'CC0-1.0',
              'SPDXID': 'SPDXRef-DOCUMENT',
              'name': 'atlas-ros-v7.5.2-candidate',
              'documentNamespace': (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/spdx/{os.environ['CANDIDATE_COMMIT']}"
              ),
              'creationInfo': {
                  'created': created,
                  'creators': ['Tool: Atlas ROS v7.5.2 candidate workflow'],
              },
              'documentDescribes': ['SPDXRef-Package-atlas-ros'],
              'packages': [package],
              'files': files,
              'relationships': relationships,
          }
          Path('build/SBOM.spdx.json').write_text(
              json.dumps(sbom, indent=2, sort_keys=True) + '\n'
          )
          PY
          sha256sum build/SOURCE_MANIFEST.sha256 build/SBOM.spdx.json \
            > build/EVIDENCE_CHECKSUMS.sha256

      - name: Clean install exact artifacts
        run: |
          set -euo pipefail
          for kind in sdist wheel; do
            if [ "$kind" = wheel ]; then
              package=dist/atlas_ros-7.5.2-py3-none-any.whl
            else
              package=dist/atlas_ros-7.5.2.tar.gz
            fi
            env_dir="clean-install/$kind"
            python -m venv "$env_dir"
            "$env_dir/bin/python" -m pip install --disable-pip-version-check "$package"
            "$env_dir/bin/python" -c \
              "import atlas_ros; assert atlas_ros.__version__ == '7.5.2'"
            "$env_dir/bin/atlas" status --json > "build/${kind}-status.json"
            "$env_dir/bin/atlas" verify --json > "build/${kind}-verify.json"
          done

      - name: Restore Active and immediate rollback
        run: |
          set -euo pipefail
          mkdir -p "restoration/active-${ACTIVE_VERSION}" \
            "restoration/rollback-${ROLLBACK_VERSION}"
          gh release download "$ACTIVE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "restoration/active-${ACTIVE_VERSION}"
          gh release download "$ROLLBACK_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "restoration/rollback-${ROLLBACK_VERSION}"
          (
            cd "restoration/active-${ACTIVE_VERSION}"
            sed 's#  dist/#  #' CHECKSUMS.sha256 | sha256sum -c -
          )
          (
            cd "restoration/rollback-${ROLLBACK_VERSION}"
            sed 's#  dist/#  #' CHECKSUMS.sha256 | sha256sum -c -
          )
          active_wheel=$(find "restoration/active-${ACTIVE_VERSION}" -name '*.whl' -print -quit)
          rollback_wheel=$(find "restoration/rollback-${ROLLBACK_VERSION}" -name '*.whl' -print -quit)
          test -n "$active_wheel"
          test -n "$rollback_wheel"
          python -m venv restoration/active-clean
          python -m venv restoration/rollback-clean
          restoration/active-clean/bin/python -m pip install \
            --disable-pip-version-check "$active_wheel"
          restoration/rollback-clean/bin/python -m pip install \
            --disable-pip-version-check "$rollback_wheel"
          restoration/active-clean/bin/python -c \
            "import atlas_ros; assert atlas_ros.__version__ == '${ACTIVE_VERSION}'"
          restoration/rollback-clean/bin/python -c \
            "import atlas_ros; assert atlas_ros.__version__ == '${ROLLBACK_VERSION}'"
          printf '%s\n' "$ACTIVE_COMMIT" > build/ACTIVE_RESTORATION_COMMIT.txt
          printf '%s\n' "$ROLLBACK_COMMIT" > build/ROLLBACK_RESTORATION_COMMIT.txt

      - name: Create non-publishing receipts
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def digest(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          dist_files = sorted(Path('dist').iterdir())
          source = next(path for path in dist_files if path.suffix == '.gz')
          wheel = next(path for path in dist_files if path.suffix == '.whl')
          controller = {
              'schema_version': 'v752-non-publishing-controller-v1',
              'status': 'passed',
              'candidate_commit': os.environ['CANDIDATE_COMMIT'],
              'candidate_version': '7.5.2',
              'active_version_unchanged': os.environ['ACTIVE_VERSION'],
              'rollback_version_verified': os.environ['ROLLBACK_VERSION'],
              'provider_writes': 0,
              'todoist_writes': 0,
              'authority_changes': 0,
              'production_schema_migrations': 0,
              'release_publications': 0,
              'production_tags_created_or_moved': 0,
              'integration_scope_expansions': 0,
              'credential_actions': 0,
              'messages_sent': 0,
              'calendar_actions': 0,
              'scheduled_actions': 0,
              'deletions': 0,
          }
          actions = {
              'schema_version': 'actions-utilization-report-v1',
              'candidate_commit': os.environ['CANDIDATE_COMMIT'],
              'build_count': 1,
              'exact_artifacts_reused': True,
              'duplicate_builds_avoided': True,
              'stale_run_cancellation_enabled': True,
              'dependency_cache_enabled': True,
              'provider_writes': 0,
              'todoist_writes': 0,
          }
          dod = {
              'schema_version': 'feature-dod-receipt-v1',
              'feature_id': 'clarification-calibration-evaluation',
              'candidate_commit': os.environ['CANDIDATE_COMMIT'],
              'status': 'passed',
              'mandatory_gates_complete': True,
              'exact_build_count': 1,
              'production_unchanged': True,
          }
          validation = {
              'schema_version': 'v752-validation-receipt-v1',
              'status': 'passed',
              'candidate_commit': os.environ['CANDIDATE_COMMIT'],
              'candidate_version': os.environ['CANDIDATE_VERSION'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'source_distribution': source.name,
              'source_distribution_sha256': digest(str(source)),
              'wheel': wheel.name,
              'wheel_sha256': digest(str(wheel)),
              'sbom_sha256': digest('build/SBOM.spdx.json'),
              'source_manifest_sha256': digest('build/SOURCE_MANIFEST.sha256'),
              'secret_scan_sha256': digest('build/V752_SECRET_SCAN.json'),
              'active_restoration_commit': os.environ['ACTIVE_COMMIT'],
              'rollback_restoration_commit': os.environ['ROLLBACK_COMMIT'],
              'provider_writes': 0,
              'todoist_writes': 0,
          }
          outputs = {
              'build/V752_NON_PUBLISHING_CONTROLLER.json': controller,
              'build/V752_ACTIONS_UTILIZATION.json': actions,
              'build/V752_DEFINITION_OF_DONE_RECEIPT.json': dod,
              'build/V752_VALIDATION_RECEIPT.json': validation,
          }
          for path, payload in outputs.items():
              Path(path).write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          sha256sum build/V752_NON_PUBLISHING_CONTROLLER.json \
            build/V752_ACTIONS_UTILIZATION.json \
            build/V752_DEFINITION_OF_DONE_RECEIPT.json \
            build/V752_VALIDATION_RECEIPT.json \
            >> build/EVIDENCE_CHECKSUMS.sha256

      - name: Retain exact candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v752-clarification-evaluation-${{ env.CANDIDATE_COMMIT }}
          path: |
            dist/
            build/
          if-no-files-found: error
          retention-days: 90
