name: v7.3.0 full-gate Ruff repair

on:
  push:
    branches: [agent/v730-operational-awareness]
    paths:
      - '.github/workflows/v730-full-ruff-fix.yml'

permissions:
  contents: write

concurrency:
  group: v730-full-ruff-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out canonical candidate branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/v730-operational-awareness
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Install pinned CI environment
        run: python -m pip install --disable-pip-version-check -e '.[ci]'

      - name: Apply and verify full-gate Ruff repair
        run: |
          set -euo pipefail
          ruff check --fix src/atlas_ros/contracts/schemas.py
          ruff check .

      - name: Commit source-only repair
        run: |
          set -euo pipefail
          git config user.name 'atlas-ros-bot'
          git config user.email 'atlas-ros-bot@users.noreply.github.com'
          git add src/atlas_ros/contracts/schemas.py
          git diff --cached --quiet && exit 0
          git commit -m 'style: organize v7.3.0 schema imports'
          git push origin HEAD:agent/v730-operational-awareness
