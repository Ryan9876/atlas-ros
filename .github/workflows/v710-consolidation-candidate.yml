name: v710-consolidation-candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: v710-consolidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  full-validation:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/v710-consolidation'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install pinned validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Quality architecture typing and complete tests
        run: |
          set -euo pipefail
          mkdir -p v710-evidence
          ruff check .
          python scripts/validate_architecture.py
          python scripts/validate_legacy_isolation.py
          mypy src
          pytest --junitxml=v710-evidence/pytest.xml --cov-report=json:v710-evidence/coverage.json
      - name: Validate Drive independence and compiler fixtures
        run: |
          set -euo pipefail
          python scripts/validate_v710_candidate.py --skip-tests --source-commit "${{ github.event.pull_request.head.sha || github.sha }}" 2>&1 | tee v710-evidence/validate-v710.log
      - name: Validate deterministic dependency policy
        run: |
          set -euo pipefail
          python scripts/validate_dependency_lock.py requirements.runtime.lock 2>&1 | tee v710-evidence/dependency-policy.log
          python scripts/validate_vulnerability_exceptions.py 2>&1 | tee v710-evidence/vulnerability-exceptions.log
      - name: Scan candidate secrets
        run: |
          set -euo pipefail
          python scripts/scan_candidate_secrets.py --root . --output v710-evidence/secret-scan.json
      - name: Audit PyPI vulnerabilities
        run: |
          set -euo pipefail
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 --progress-spinner off --vulnerability-service pypi --requirement requirements.runtime.lock --format json --output v710-evidence/pip-audit-pypi.json
      - name: Audit OSV vulnerabilities
        run: |
          set -euo pipefail
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 --progress-spinner off --vulnerability-service osv --requirement requirements.runtime.lock --format json --output v710-evidence/pip-audit-osv.json
          python scripts/evaluate_dependency_audit.py v710-evidence/pip-audit-pypi.json v710-evidence/pip-audit-osv.json
      - name: Deterministic compiler outputs and build-once artifacts
        run: |
          set -euo pipefail
          python scripts/compile_release.py release/specifications/V710.yaml --source-commit "${{ github.event.pull_request.head.sha || github.sha }}" --output v710-evidence/compiler-output
          python -m build
          python -m venv v710-clean
          v710-clean/bin/python -m pip install --disable-pip-version-check dist/atlas_ros-7.1.0-py3-none-any.whl
          v710-clean/bin/atlas status --json > v710-evidence/runtime-status.json
          v710-clean/bin/atlas verify --json > v710-evidence/runtime-verify.json
          python scripts/measure_startup_performance.py --candidate-python v710-clean/bin/python --iterations 7 --output v710-evidence/startup-performance.json
      - name: Rollback restoration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v701-assets v650-assets v620-assets
          gh release download v7.0.1 --repo "$GITHUB_REPOSITORY" --dir v701-assets
          gh release download v6.5.0 --repo "$GITHUB_REPOSITORY" --dir v650-assets
          gh release download v6.2.0 --repo "$GITHUB_REPOSITORY" --dir v620-assets
          (cd v701-assets && sha256sum -c CHECKSUMS.sha256)
          (cd v650-assets && sha256sum -c CHECKSUMS.sha256)
          (cd v620-assets && sha256sum -c CHECKSUMS.sha256)
          for pair in 'v701-assets 7.0.1' 'v650-assets 6.5.0' 'v620-assets 6.2.0'; do
            set -- $pair
            wheel=$(find "$1" -name "atlas_ros-$2*.whl" -print -quit)
            test -n "$wheel"
            envname="restore-${2//./-}"
            python -m venv "$envname"
            "$envname/bin/python" -m pip install --disable-pip-version-check "$wheel"
            "$envname/bin/python" -c "import atlas_ros; assert atlas_ros.__version__ == '$2'"
          done
          python scripts/measure_startup_performance.py --candidate-python v710-clean/bin/python --baseline-python restore-7-0-1/bin/python --iterations 7 --max-startup-regression 0.10 --max-module-regression 0 --output v710-evidence/startup-comparison.json
      - name: Evidence and package checksums
        if: always()
        run: |
          set -euo pipefail
          cp dist/atlas_ros-7.1.0* v710-evidence/ 2>/dev/null || true
          (cd v710-evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd v710-evidence && sha256sum -c SHA256SUMS)
      - name: Retain non-publishing candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v710-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: v710-evidence/
          if-no-files-found: error
          retention-days: 90
