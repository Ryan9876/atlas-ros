name: v7.5.0 independent publication readback

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v750-independent-publication-readback.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: v7.5.0
      EXPECTED_TAG_COMMIT: f2a14c1e401debe77040d0db836e343be6f337e3
      SOURCE_SHA256: e6327b2f77e293cad543c6b1fec1d2c8ceff5b3321a05828f586c5b9ef52660d
      WHEEL_SHA256: 037b229c0e0e006202c6cceec916c67313664f1e7ae9a1c2e685bfd10bb729bd
      VALIDATION_SHA256: 4b084a6d96324234720a4864eeb25acf2fb65f3c1f62bf0ac5600b0d6ef5970c
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Verify immutable tag target and manifest
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-list -n 1 "$TAG")" = "$EXPECTED_TAG_COMMIT"
          git show "$TAG:release/RELEASE_MANIFEST_V750.md" > RELEASE_MANIFEST_V750.md
          grep -F 'e5b828d40e63e6d3106ae6bddbcc08b48273f74b' RELEASE_MANIFEST_V750.md
          grep -F '8728012606' RELEASE_MANIFEST_V750.md
      - name: Download and verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          test -f release-assets/atlas_ros-7.5.0.tar.gz
          test -f release-assets/atlas_ros-7.5.0-py3-none-any.whl
          test -f release-assets/CHECKSUMS.sha256
          (cd release-assets && sed 's#dist/##' CHECKSUMS.sha256 | sha256sum -c -)
          test "$(sha256sum release-assets/atlas_ros-7.5.0.tar.gz | cut -d' ' -f1)" = "$SOURCE_SHA256"
          test "$(sha256sum release-assets/atlas_ros-7.5.0-py3-none-any.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum release-assets/V750_FULL_VALIDATION.json | cut -d' ' -f1)" = "$VALIDATION_SHA256"
      - name: Clean install and verify published packages
        run: |
          set -euo pipefail
          for kind in wheel sdist; do
            python -m venv "$kind-env"
            if [ "$kind" = wheel ]; then
              package=release-assets/atlas_ros-7.5.0-py3-none-any.whl
            else
              package=release-assets/atlas_ros-7.5.0.tar.gz
            fi
            "$kind-env/bin/python" -m pip install --disable-pip-version-check "$package"
            "$kind-env/bin/python" -c "import atlas_ros; assert atlas_ros.__version__ == '7.5.0'"
            "$kind-env/bin/atlas" verify --json > "$kind-verify.json"
          done
      - name: Verify non-publishing receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('release-assets/V750_FULL_VALIDATION.json').read_text())
          assert receipt['status'] == 'passed'
          assert receipt['candidate_commit'] == 'e5b828d40e63e6d3106ae6bddbcc08b48273f74b'
          assert receipt['provider_writes'] == 0
          assert receipt['todoist_writes'] == 0
          assert receipt['authority_changes'] == 0
          assert receipt['release_publications'] == 0
          assert receipt['feature_enabled_by_default'] is False
          PY
      - name: Retain independent readback evidence
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          payload = {
              'schema_version': 'v750-independent-publication-readback-v1',
              'status': 'passed',
              'tag': 'v7.5.0',
              'tag_commit': 'f2a14c1e401debe77040d0db836e343be6f337e3',
              'package_source_commit': 'e5b828d40e63e6d3106ae6bddbcc08b48273f74b',
              'source_sha256': 'e6327b2f77e293cad543c6b1fec1d2c8ceff5b3321a05828f586c5b9ef52660d',
              'wheel_sha256': '037b229c0e0e006202c6cceec916c67313664f1e7ae9a1c2e685bfd10bb729bd',
              'provider_writes': 0,
              'authority_changes': 0,
          }
          text = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          Path('V750_INDEPENDENT_READBACK.json').write_text(text)
          Path('V750_INDEPENDENT_READBACK.sha256').write_text(hashlib.sha256(text.encode()).hexdigest() + '  V750_INDEPENDENT_READBACK.json\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v750-independent-publication-readback
          path: |
            V750_INDEPENDENT_READBACK.json
            V750_INDEPENDENT_READBACK.sha256
            wheel-verify.json
            sdist-verify.json
          if-no-files-found: error
          retention-days: 90
