name: v7.7.0 bootstrap candidate payload

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.atlas-v770-bootstrap/**'
      - '.github/workflows/v770-bootstrap-apply.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: v770-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/v770-initialization-circuit-breaker'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify exact payload
        shell: bash
        run: |
          set -euo pipefail
          cat .atlas-v770-bootstrap/chunk-*.b64 | tr -d '\n' | base64 --decode > /tmp/v770-payload.tar.gz
          echo 'd77171e4a9a62adc5fcbc5ac8aa8d2ebf5aa3809a9a4147aec168ffea8f2c903  /tmp/v770-payload.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/v770-payload.tar.gz \
            --exclude='.github/workflows/v770-initialization-circuit-breaker-candidate.yml'
          rm -rf .atlas-v770-bootstrap

      - name: Commit exact non-workflow implementation payload
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'atlas-ros-release-bot'
          git config user.email 'atlas-ros-release-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No payload changes were reconstructed.' >&2
            exit 1
          fi
          git commit -m 'Implement v7.7.0 initialization circuit breaker'
          git push origin "HEAD:${HEAD_BRANCH}"
