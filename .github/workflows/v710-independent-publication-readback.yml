name: v710-independent-publication-readback

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: v710-independent-readback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify-published-release:
    if: github.head_ref == 'release/v710-independent-readback'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FINAL_SOURCE_COMMIT: 0711b045f34f5ab7b03f7a61bc80653e0d815463
      FINAL_ARTIFACT_DIGEST: bb1d2a735ef6c175dd5a41fda067c8d1301883eaa9d413b38fa56346ae8fa483
      EXPECTED_SOURCE_SHA256: fb69bef625125bf477bb3dda3d1b09dfec43af0ccf6a3d78c998bf9df8139834
      EXPECTED_WHEEL_SHA256: 7e199f44463b6c2f646441cac4d50b47b0fe4bdb92b0837492013063cb8b976a
      EXPECTED_MANIFEST_CANONICAL_SHA256: 13d277c6244657d1f4379a19c36ba532d0ffd7aa23f339fcdbca896edbfb9733
      EXPECTED_MANIFEST_RAW_SHA256: 687d8374841d62f3c119f6970b418559d044d04d28088d76b5c7d2c26ff6738b
      EXPECTED_SBOM_SHA256: ea20c3717eeb22415847ff57a6953378139d69fbd78950f010ab75115c46a7b7
      EXPECTED_SOURCE_MANIFEST_SHA256: 6d9d326a97723b8c5ad3741caced3bd8a26d1508c3f66e46c7b2bf1e9082bcb3
      RELEASE_TAG: v7.1.0
    steps:
      - name: Check out exact published source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 0711b045f34f5ab7b03f7a61bc80653e0d815463
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install exact-source validation tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Verify immutable publication independently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SOURCE_COMMIT"
          mkdir -p independent-readback/release-assets
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,url \
            > independent-readback/RELEASE_METADATA.json
          git fetch --tags --force
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$FINAL_SOURCE_COMMIT"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir independent-readback/release-assets
          (cd independent-readback/release-assets && sha256sum -c CHECKSUMS.sha256)
          test "$(sha256sum independent-readback/release-assets/atlas-ros-v7.1.0-final-package.zip | awk '{print $1}')" = "$FINAL_ARTIFACT_DIGEST"
          test "$(sha256sum independent-readback/release-assets/atlas_ros-7.1.0.tar.gz | awk '{print $1}')" = "$EXPECTED_SOURCE_SHA256"
          test "$(sha256sum independent-readback/release-assets/atlas_ros-7.1.0-py3-none-any.whl | awk '{print $1}')" = "$EXPECTED_WHEEL_SHA256"
          test "$(sha256sum independent-readback/release-assets/RELEASE_MANIFEST_V710.md | awk '{print $1}')" = "$EXPECTED_MANIFEST_RAW_SHA256"
          unzip -q independent-readback/release-assets/atlas-ros-v7.1.0-final-package.zip \
            -d independent-readback/final-package
          (cd independent-readback/final-package && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from atlas_ros.contracts.digests import sha256_digest

          root = Path('independent-readback/release-assets')
          meta = json.loads(Path('independent-readback/RELEASE_METADATA.json').read_text(encoding='utf-8'))
          assert meta['tagName'] == 'v7.1.0'
          assert meta['isDraft'] is False
          assert meta['isPrerelease'] is False
          assert sha256_digest((root / 'RELEASE_MANIFEST_V710.md').read_text(encoding='utf-8')) == os.environ['EXPECTED_MANIFEST_CANONICAL_SHA256']
          assert hashlib.sha256((root / 'SBOM.spdx.json').read_bytes()).hexdigest() == os.environ['EXPECTED_SBOM_SHA256']
          assert hashlib.sha256((root / 'SOURCE_MANIFEST_FINAL.json').read_bytes()).hexdigest() == os.environ['EXPECTED_SOURCE_MANIFEST_SHA256']
          identity = json.loads((root / 'FINAL_IDENTITY.json').read_text(encoding='utf-8'))
          assert identity['source_commit'] == os.environ['FINAL_SOURCE_COMMIT']
          assert identity['production_authorized'] is True
          assert identity['published'] is True
          assert identity['authority_activated'] is False
          assert identity['required_integrations'] == ['GitHub', 'Notion', 'Todoist']
          assert identity['optional_integrations'] == ['Google Drive']
          assert identity['immediate_rollback_after_promotion'] == '7.0.1'
          assert identity['historical_rollbacks'] == ['6.5.0', '6.2.0']
          PY
          python -m venv independent-readback/clean-v710
          independent-readback/clean-v710/bin/python -m pip install \
            --disable-pip-version-check \
            independent-readback/release-assets/atlas_ros-7.1.0-py3-none-any.whl
          independent-readback/clean-v710/bin/python -c \
            "import atlas_ros; assert atlas_ros.__version__ == '7.1.0'"
          for pair in "v7.0.1 7.0.1" "v6.5.0 6.5.0" "v6.2.0 6.2.0"; do
            set -- $pair
            tag="$1"; expected="$2"
            dir="independent-readback/rollback-${expected//./-}"
            envdir="independent-readback/venv-${expected//./-}"
            mkdir -p "$dir"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "atlas_ros-${expected}*.whl" --dir "$dir"
            wheel="$(find "$dir" -name '*.whl' -print -quit)"
            test -n "$wheel"
            python -m venv "$envdir"
            "$envdir/bin/python" -m pip install --disable-pip-version-check "$wheel"
            "$envdir/bin/python" -c \
              "import atlas_ros; assert atlas_ros.__version__ == '${expected}'"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = {
              'schema_version': '1.0',
              'status': 'independent_publication_readback_passed',
              'release_tag': 'v7.1.0',
              'source_commit': os.environ['FINAL_SOURCE_COMMIT'],
              'artifact_digest': os.environ['FINAL_ARTIFACT_DIGEST'],
              'source_sha256': os.environ['EXPECTED_SOURCE_SHA256'],
              'wheel_sha256': os.environ['EXPECTED_WHEEL_SHA256'],
              'manifest_canonical_sha256': os.environ['EXPECTED_MANIFEST_CANONICAL_SHA256'],
              'immediate_rollback': 'v7.0.1',
              'historical_rollbacks': ['v6.5.0', 'v6.2.0'],
              'required_integrations': ['GitHub', 'Notion', 'Todoist'],
              'google_drive_required': False,
              'authority_activation_permitted_next': True,
              'provider_writes': 0,
          }
          Path('independent-readback/PUBLICATION_READBACK.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          (cd independent-readback && \
            find . -type f ! -name READBACK_CHECKSUMS.sha256 -print0 | \
            sort -z | xargs -0 sha256sum > READBACK_CHECKSUMS.sha256)
          (cd independent-readback && sha256sum -c READBACK_CHECKSUMS.sha256)
      - name: Retain independent readback evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v710-independent-publication-readback-0711b045f34f5ab7b03f7a61bc80653e0d815463
          path: independent-readback/
          if-no-files-found: error
          retention-days: 90
