name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy: {matrix: {python: ['3.12.10']}}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '${{ matrix.python }}', cache: pip}
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff
        id: ruff
        run: |
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ruff-output.txt
      - name: Retain Ruff diagnostics
        if: failure() && steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-diagnostics
          path: ruff-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Validate architecture boundaries
        run: python scripts/validate_architecture.py
      - name: Strict MyPy
        id: mypy
        run: |
          set -o pipefail
          mypy src 2>&1 | tee mypy-output.txt
      - name: Retain MyPy diagnostics
        if: failure() && steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mypy-diagnostics
          path: mypy-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Test
        id: pytest
        run: |
          set -o pipefail
          pytest 2>&1 | tee pytest-output.txt
      - name: Evaluate Execution Planning and Task Economy
        run: |
          mkdir -p execution-planning-evidence
          python scripts/evaluate_execution_planning.py \
            --dataset benchmarks/execution-planning-v1.json \
            --output execution-planning-evidence/EXECUTION_PLANNING_REPORT.json
      - name: Retain pytest diagnostics
        if: failure() && steps.pytest.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-diagnostics
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 7
      - run: python -m build
      - run: python -c "from atlas_ros.config.loader import load_config; assert load_config('todoist')['version']"

  dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.10', cache: pip}
      - name: Install pinned audit tooling
        run: python -m pip install --disable-pip-version-check 'pip-audit==2.9.0' 'PyYAML==6.0.3'
      - name: Validate deterministic lock and exception policy
        run: |
          python scripts/validate_dependency_lock.py requirements.runtime.lock
          python scripts/validate_vulnerability_exceptions.py
      - name: Audit against PyPI advisory service
        id: pypi_audit
        continue-on-error: true
        run: |
          mkdir -p audit
          set -o pipefail
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service pypi \
            --requirement requirements.runtime.lock --format json \
            --output audit/pip-audit-pypi.json \
            >audit/pip-audit-pypi.stdout 2>audit/pip-audit-pypi.stderr
      - name: Audit against OSV advisory service
        id: osv_audit
        continue-on-error: true
        run: |
          set -o pipefail
          pip-audit --disable-pip --require-hashes --no-deps --timeout 15 \
            --progress-spinner off --vulnerability-service osv \
            --requirement requirements.runtime.lock --format json \
            --output audit/pip-audit-osv.json \
            >audit/pip-audit-osv.stdout 2>audit/pip-audit-osv.stderr
      - name: Enforce current advisory and exception policy
        run: |
          python scripts/evaluate_dependency_audit.py \
            audit/pip-audit-pypi.json audit/pip-audit-osv.json
      - name: Create evidence checksums
        if: always()
        run: |
          cp requirements.runtime.lock audit/
          cp security/vulnerability-exceptions.yml audit/
          printf 'PyPI step outcome: %s\nOSV step outcome: %s\n' \
            '${{ steps.pypi_audit.outcome }}' '${{ steps.osv_audit.outcome }}' \
            > audit/workflow-outcomes.txt
          (cd audit && sha256sum * > SHA256SUMS)
      - name: Retain dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-audit-evidence
          path: audit/
          if-no-files-found: error
          retention-days: 90


  validate-v650-final-controller:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v650-ci-publisher'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check --upgrade pip && python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate exact v6.5 publication controller without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_COMMIT: 1412e615726e27fd1880222598c1271d4e466058
          CANDIDATE_MERGE_COMMIT: 4247baf812eae3635408af2fb61761685ea1115f
          CANDIDATE_ARTIFACT_ID: '8654164435'
          CANDIDATE_ARTIFACT_DIGEST: cc46bd3725717a620c9872ac0da81667e31298b444bab8a125ae94506c9ac040
          RELEASE_TAG: v6.5.0
          ROLLBACK_TAG: v6.2.0
          PUBLISH: 'false'
        run: bash scripts/publish_v650_final.sh
      - name: Upload v6.5 final-controller evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v650-final-controller-${{ github.event.pull_request.head.sha }}
          path: |
            final-publication/
            final-evidence/
          if-no-files-found: warn
          retention-days: 90


  validate-v650-final-candidate:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v650-final-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check --upgrade pip && python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate exact v6.5.0 candidate without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_MERGE_COMMIT: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_ARTIFACT_ID: 'pending-workflow-artifact'
          CANDIDATE_ARTIFACT_DIGEST: pending-workflow-artifact
          RELEASE_TAG: v6.5.0
          ROLLBACK_TAG: v6.2.0
          PUBLISH: 'false'
        run: bash scripts/publish_v650_final.sh
      - name: Upload exact v6.5.0 candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v650-final-candidate-${{ github.event.pull_request.head.sha }}
          path: |
            final-publication/
            final-evidence/
          if-no-files-found: error
          retention-days: 90


  publish-v650-final:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      startsWith(github.event.head_commit.message, 'release: execute exact Atlas ROS v6.5 publication')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check --upgrade pip && python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Publish and read back exact v6.5.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          CANDIDATE_COMMIT: 1412e615726e27fd1880222598c1271d4e466058
          CANDIDATE_MERGE_COMMIT: 4247baf812eae3635408af2fb61761685ea1115f
          CANDIDATE_ARTIFACT_ID: '8654164435'
          CANDIDATE_ARTIFACT_DIGEST: cc46bd3725717a620c9872ac0da81667e31298b444bab8a125ae94506c9ac040
          RELEASE_TAG: v6.5.0
          ROLLBACK_TAG: v6.2.0
          PUBLISH: 'true'
        run: bash scripts/publish_v650_final.sh
      - name: Upload v6.5 final-publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v650-final-publication-${{ github.sha }}
          path: |
            final-publication/
            final-evidence/
            release-readback/
          if-no-files-found: warn
          retention-days: 90
