name: v710-candidate-bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: v710-candidate-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-candidate-bundle:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/v710-consolidation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact candidate source bundle
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          encoded = Path('tools/v710_candidate_bundle.b64').read_text(encoding='ascii')
          payload = base64.b64decode(encoded, validate=True)
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              members = archive.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
              archive.extractall('.', filter='data')
          PY
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              /*|*../*|../*) echo "unsafe deletion path: $path" >&2; exit 1 ;;
            esac
            rm -rf -- "$path"
          done < .atlas-deletions.txt
          rm -f .atlas-deletions.txt
          git status --short
      - name: Commit candidate implementation atomically
        run: |
          set -euo pipefail
          git config user.name 'Atlas ROS Development'
          git config user.email 'atlas-ros@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'candidate bundle produced no changes' >&2; exit 1; }
          git commit -m 'release: prepare Atlas ROS v7.1.0 consolidation candidate'
          git push origin HEAD:${{ github.head_ref }}
