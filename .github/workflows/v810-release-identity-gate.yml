name: v8.1.0 release identity gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'pyproject.toml'
      - 'src/atlas_ros/__init__.py'
      - 'src/atlas_ros/entry_points/main.py'
      - 'governance/capability-catalog.yaml'
      - 'src/atlas_ros/capabilities/operational_awareness/context_aware_clarification/**'
      - 'tests/unit/test_v700_capability_compiler.py'
      - 'tests/unit/test_v700_entry_points.py'
      - 'tests/unit/test_v710_lazy_warm_runtime.py'
      - '.github/workflows/v810-release-identity-gate.yml'

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[ci]'
      - name: Validate candidate identity and governed capability count
        run: |
          ruff check \
            src/atlas_ros/entry_points/main.py \
            tests/unit/test_v700_capability_compiler.py \
            tests/unit/test_v700_entry_points.py \
            tests/unit/test_v710_lazy_warm_runtime.py
          pytest --no-cov -q \
            tests/unit/test_v700_capability_compiler.py \
            tests/unit/test_v700_entry_points.py \
            tests/unit/test_v710_lazy_warm_runtime.py
          python - <<'PY'
          import atlas_ros
          from atlas_ros.entry_points.main import EXPECTED_INSTALLED_VERSION
          assert atlas_ros.__version__ == '8.1.0'
          assert EXPECTED_INSTALLED_VERSION == '8.1.0'
          PY
