name: v7.4.0 feature delivery candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: v740-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  lean:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[ci]'
      - run: ruff check src/atlas_ros/devtools_cli src/atlas_ros/entry_points/dev.py tests/unit/test_v740_feature_delivery.py
      - run: python scripts/validate_devtools_boundary.py
      - run: pytest --no-cov -q tests/unit/test_v740_feature_delivery.py
      - run: atlas-dev explain-impact governance/architecture.yaml

  full-candidate:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: atlas-dev validate --tier candidate --execute --receipt build/v740-validation-receipt.json
      - run: python scripts/validate_devtools_boundary.py
      - run: python scripts/scan_candidate_secrets.py --root . --output build/v740-secret-scan.json
      - name: Build exact candidate once
        run: |
          rm -rf dist
          python -m build
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          printf '1\n' > build/BUILD_COUNT.txt
          sha256sum dist/* > build/CHECKSUMS.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v740-candidate-${{ github.sha }}
          path: |
            dist/
            build/
          if-no-files-found: error
          retention-days: 14
