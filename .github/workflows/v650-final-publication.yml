name: v650-final-publication
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/v650-final-publication.yml','scripts/publish_v650_final.sh']
  push:
    branches: [main]
    paths: ['.github/workflows/v650-final-publication.yml','scripts/publish_v650_final.sh']
permissions:
  contents: write
concurrency:
  group: v650-final-publication
  cancel-in-progress: false
env:
  CANDIDATE_COMMIT: 203f080f93321a903cb0a7577838234f3d783500
  CANDIDATE_MERGE_COMMIT: 9ece6e1f9b2ef8cdbd852f190fbcd6f3ff04287e
  CANDIDATE_ARTIFACT_ID: '8644606530'
  CANDIDATE_ARTIFACT_DIGEST: e2704700a47d2b971e6ecfee06f929af1efa437f9724a82a135482af04618487
  RELEASE_TAG: v6.5.0
  ROLLBACK_TAG: v6.2.0
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  validate-and-publish:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_name == 'main' &&
       startsWith(github.event.head_commit.message, 'release: activate v6.5 final publication controller'))
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {ref: ${{ github.event.pull_request.head.sha || github.sha }}, fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.10', cache: pip}
      - run: python -m pip install --disable-pip-version-check --upgrade pip && python -m pip install --disable-pip-version-check -e '.[dev]'
      - env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' }}
        run: bash scripts/publish_v650_final.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v6.5.0-final-publication-${{ github.run_attempt }}
          path: final-publication/
          retention-days: 90
