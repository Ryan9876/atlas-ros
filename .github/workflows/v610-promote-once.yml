name: v610-promote-once

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: v610-promote-once
  cancel-in-progress: false

jobs:
  publish-and-restore:
    if: contains(github.event.head_commit.message, '[publish-v6.1.0]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FINAL_TAG: v6.1.0
      RELEASE_NAME: Atlas ROS v6.1.0 Semantic Fidelity
      EXPECTED_CANDIDATE: 7cfa5e20fc3f30abf02d1a428c4ca3632811c1d7
      EXPECTED_MERGE: bbed48eb3d00427486a480cf27eea493af9e9538
      EXPECTED_CANDIDATE_PACKAGE_SHA256: 9aa9e6fd0447879881bce5c91ce8decefe5e6685e6c9ddc3b9dc8d1809c02237
      EXPECTED_ROLLBACK_TAG: v6.0.0

    steps:
      - name: Check out exact final source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Verify authorization and source identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          manifest = Path('release/RELEASE_MANIFEST.md').read_text(encoding='utf-8')
          assert version == '6.1.0'
          assert '# Atlas ROS v6.1.0 Release Manifest' in manifest
          assert '7cfa5e20fc3f30abf02d1a428c4ca3632811c1d7' in manifest
          assert 'bbed48eb3d00427486a480cf27eea493af9e9538' in manifest
          assert 'V4V-38' in manifest and 'V4D-31' in manifest
          assert 'Promotion authorized: Yes' in manifest
          assert 'Atlas ROS v6.0.0' in manifest
          PY
          git merge-base --is-ancestor "${EXPECTED_CANDIDATE}" "${GITHUB_SHA}"
          git merge-base --is-ancestor "${EXPECTED_MERGE}" "${GITHUB_SHA}"

      - name: Install locked development dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Run static, architecture, and test gates
        run: |
          set -euo pipefail
          ruff check .
          python scripts/validate_architecture.py
          mypy src
          mkdir -p final-evidence/test-results
          pytest --junitxml=final-evidence/test-results/pytest.xml --cov-report=json:final-evidence/test-results/coverage.json

      - name: Run semantic and execution benchmarks
        run: |
          set -euo pipefail
          mkdir -p final-evidence
          python scripts/evaluate_semantic_fidelity.py --dataset benchmarks/semantic-fidelity-v1.json --output final-evidence/V610_SEMANTIC_FIDELITY_REPORT.json
          python scripts/evaluate_execution_planning.py --dataset benchmarks/execution-planning-v1.json --output final-evidence/V610_EXECUTION_PLANNING_REPORT.json
          python scripts/evaluate_execution_orchestration.py --dataset benchmarks/execution-orchestration-v1.json --output final-evidence/V610_EXECUTION_ORCHESTRATION_REPORT.json
          python scripts/evaluate_canonical_reconciliation.py --dataset benchmarks/canonical-reconciliation-v1.json --output final-evidence/V610_CANONICAL_RECONCILIATION_REPORT.json
          python scripts/evaluate_knowledge_management.py --dataset benchmarks/knowledge-management-v2.json --output final-evidence/V610_KNOWLEDGE_MANAGEMENT_REPORT.json

      - name: Build final source and wheel before generated evidence
        run: |
          set -euo pipefail
          rm -rf dist build
          python -m build
          test -f dist/atlas_ros-6.1.0.tar.gz
          test -f dist/atlas_ros-6.1.0-py3-none-any.whl
          python -m venv clean-wheel
          clean-wheel/bin/python -m pip install --disable-pip-version-check dist/atlas_ros-6.1.0-py3-none-any.whl
          clean-wheel/bin/python - <<'PY'
          from importlib.metadata import version
          from atlas_ros.contracts import ExecutionPlanV3, IntentPartitionV1, ManagementPackageV3, ReasoningPackageV4, SemanticFidelityResultV1
          from atlas_ros.engines import IntentPartitioner
          from atlas_ros.planning import SemanticExecutionPlanner
          assert version('atlas-ros') == '6.1.0'
          assert all((ExecutionPlanV3, IntentPartitionV1, ManagementPackageV3, ReasoningPackageV4, SemanticFidelityResultV1, IntentPartitioner, SemanticExecutionPlanner))
          PY

      - name: Verify v6.0 rollback compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p rollback-source
          gh release download "${EXPECTED_ROLLBACK_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern 'atlas_ros-6.0*.tar.gz' --dir rollback-source
          baseline_archive="$(find rollback-source -maxdepth 1 -type f -name 'atlas_ros-6.0*.tar.gz' -print -quit)"
          test -n "${baseline_archive}"
          tar -xzf "${baseline_archive}" -C rollback-source
          baseline_source="$(find rollback-source -maxdepth 1 -type d -name 'atlas_ros-6.0*' -print -quit)"
          test -n "${baseline_source}"
          python scripts/evaluate_v61_differential.py --rollback-source "${baseline_source}" --output final-evidence/V610_DIFFERENTIAL_REPORT.json

      - name: Assemble final immutable publication package
        run: |
          set -euo pipefail
          rm -rf publication
          mkdir -p publication/reports publication/schemas publication/restoration
          cp dist/atlas_ros-6.1.0.tar.gz publication/
          cp dist/atlas_ros-6.1.0-py3-none-any.whl publication/
          cp release/RELEASE_NOTES_V610.md publication/
          cp release/RELEASE_SCOPE_V610.md publication/
          cp release/SBOM_V610_CURRENT.cdx.json publication/SBOM.cdx.json
          cp docs/adr/ADR-010-SEMANTIC-INTENT-SEPARATION-AND-OUTPUT-FIDELITY.md publication/
          cp docs/architecture/SEMANTIC_FIDELITY_ARCHITECTURE.md publication/
          cp docs/migration/V61_SEMANTIC_CONTRACT_MIGRATION.md publication/
          cp docs/migration/V6_ROLLBACK_GUIDE.md publication/
          cp final-evidence/*.json publication/reports/
          cp final-evidence/test-results/*.json publication/reports/
          cp final-evidence/test-results/*.xml publication/reports/
          cp -a release/atlas-ros-v4.1.0-restoration-companion/. publication/restoration/
          while IFS= read -r -d '' schema; do
            relative="${schema#schemas/}"
            mkdir -p "publication/schemas/$(dirname "${relative}")"
            cp "${schema}" "publication/schemas/${relative}"
          done < <(find schemas -name '*.schema.json' -print0 | sort -z)
          git ls-files -z | sort -z | xargs -0 sha256sum > publication/SOURCE_CHECKSUMS.sha256
          cat > publication/RELEASE_MANIFEST.md <<EOF
          # Atlas ROS v6.1.0 Final Publication Manifest

          Status: Final release published and restored under V4D-31; eligible for live authority switching after authoritative readback.

          - Package version: \`6.1.0\`
          - Validated candidate head: \`${EXPECTED_CANDIDATE}\`
          - Production merge commit: \`${EXPECTED_MERGE}\`
          - Final production source: \`${GITHUB_SHA}\`
          - Standard CI run: \`30190241909\`
          - Release-candidate run: \`30190241886\`
          - Draft staging/readback run: \`30191103157\`
          - Final publication/restoration run: \`${GITHUB_RUN_ID}\`
          - Exact-artifact review: \`V4V-38\` — Passed
          - Promotion decision: \`V4D-31\` — Active
          - Immediate immutable rollback: Atlas ROS v6.0.0
          - Required integrations: Google Drive, Notion, Todoist — scope unchanged

          Semantic Fidelity passed 12/12 cases and CloudVision invariance passed 7/7. Execution Planning passed 52/52, Execution Orchestration passed 64/64 with 54/54 critical fixtures, and Canonical Reconciliation passed 77/77. v6.0 compatibility produced zero unexplained drift and all validation used zero live provider writes.

          The release restores outcome-centered planning while preserving attended provider authority, exact authorization, idempotency, readback, reconciliation, and fail-closed rollback behavior. Delegated, conditional, evaluation, audit, provider-control, and system-evidence instructions remain outside Todoist unless explicitly requested as the primary business outcome.
          EOF
          python - <<'PY'
          from pathlib import Path
          path = Path('publication/RELEASE_MANIFEST.md')
          lines = path.read_text(encoding='utf-8').splitlines()
          path.write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n', encoding='utf-8')
          PY
          (cd publication && find . -type f ! -name CHECKSUMS.sha256 -print0 | sort -z | xargs -0 sha256sum > CHECKSUMS.sha256 && sha256sum -c CHECKSUMS.sha256)
          zip -q -X -r Atlas_ROS_v6.1.0_release.zip publication
          sha256sum Atlas_ROS_v6.1.0_release.zip > Atlas_ROS_v6.1.0_release.zip.sha256
          printf 'FINAL_PACKAGE_SHA256=%s\n' "$(sha256sum Atlas_ROS_v6.1.0_release.zip | awk '{print $1}')" >> "${GITHUB_ENV}"

      - name: Publish final GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${FINAL_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${FINAL_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest --title "${RELEASE_NAME}" --target "${GITHUB_SHA}" --notes-file publication/RELEASE_MANIFEST.md
          else
            gh release create "${FINAL_TAG}" --repo "${GITHUB_REPOSITORY}" --latest --title "${RELEASE_NAME}" --target "${GITHUB_SHA}" --notes-file publication/RELEASE_MANIFEST.md
          fi
          gh release upload "${FINAL_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
            Atlas_ROS_v6.1.0_release.zip \
            Atlas_ROS_v6.1.0_release.zip.sha256 \
            publication/RELEASE_MANIFEST.md \
            publication/CHECKSUMS.sha256 \
            publication/SOURCE_CHECKSUMS.sha256 \
            publication/SBOM.cdx.json \
            publication/atlas_ros-6.1.0.tar.gz \
            publication/atlas_ros-6.1.0-py3-none-any.whl

      - name: Download, verify, restore, and benchmark final release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf final-readback final-restored restored-source restored-venv
          mkdir final-readback final-restored restored-source
          gh release download "${FINAL_TAG}" --repo "${GITHUB_REPOSITORY}" --dir final-readback
          test "$(sha256sum final-readback/Atlas_ROS_v6.1.0_release.zip | awk '{print $1}')" = "${FINAL_PACKAGE_SHA256}"
          (cd final-readback && sha256sum -c Atlas_ROS_v6.1.0_release.zip.sha256)
          unzip -q final-readback/Atlas_ROS_v6.1.0_release.zip -d final-restored
          (cd final-restored/publication && sha256sum -c CHECKSUMS.sha256)
          tar -xzf final-restored/publication/atlas_ros-6.1.0.tar.gz -C restored-source
          source_root="$(find restored-source -maxdepth 1 -type d -name 'atlas_ros-6.1.0' -print -quit)"
          test -n "${source_root}"
          (cd final-restored/publication/restoration && sha256sum -c CHECKSUMS.sha256)
          python -m venv restored-venv
          restored-venv/bin/python -m pip install --disable-pip-version-check final-restored/publication/atlas_ros-6.1.0-py3-none-any.whl
          restored-venv/bin/python - <<'PY'
          from importlib.metadata import version
          from atlas_ros.contracts import ExecutionPlanV3, IntentPartitionV1, SemanticFidelityResultV1
          from atlas_ros.engines import IntentPartitioner
          from atlas_ros.planning import SemanticExecutionPlanner
          assert version('atlas-ros') == '6.1.0'
          assert all((ExecutionPlanV3, IntentPartitionV1, SemanticFidelityResultV1, IntentPartitioner, SemanticExecutionPlanner))
          PY
          restored_python="$(pwd)/restored-venv/bin/python"
          (
            cd "${source_root}"
            "${restored_python}" scripts/evaluate_semantic_fidelity.py --dataset benchmarks/semantic-fidelity-v1.json --output restored-semantic.json
            "${restored_python}" scripts/evaluate_execution_planning.py --dataset benchmarks/execution-planning-v1.json --output restored-planning.json
            "${restored_python}" scripts/evaluate_execution_orchestration.py --dataset benchmarks/execution-orchestration-v1.json --output restored-orchestration.json
            "${restored_python}" scripts/evaluate_canonical_reconciliation.py --dataset benchmarks/canonical-reconciliation-v1.json --output restored-reconciliation.json
          )
          python - <<PY
          import json
          from pathlib import Path
          root = Path('${source_root}')
          semantic = json.loads((root / 'restored-semantic.json').read_text())
          planning = json.loads((root / 'restored-planning.json').read_text())
          orchestration = json.loads((root / 'restored-orchestration.json').read_text())
          reconciliation = json.loads((root / 'restored-reconciliation.json').read_text())
          assert semantic['eligible'] and semantic['passed'] == 12
          assert semantic['metamorphic_invariance'] == {'cloudvision-invariance': True}
          assert semantic['live_provider_writes'] == 0
          assert planning['passed'] and planning['case_count'] == 52 and planning['zero_provider_writes']
          assert orchestration['passed'] and orchestration['case_count'] == 64
          assert orchestration['critical_passed_count'] == orchestration['critical_count'] == 54
          assert orchestration['zero_live_writes']
          assert reconciliation['eligible'] and reconciliation['case_count'] == 77
          assert reconciliation['live_provider_writes'] == 0
          PY
          metadata="$(gh release view "${FINAL_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isPrerelease,tagName,targetCommitish,url)"
          jq -e --arg tag "${FINAL_TAG}" --arg target "${GITHUB_SHA}" '.isDraft == false and .isPrerelease == false and .tagName == $tag and .targetCommitish == $target' <<<"${metadata}"
          git fetch --force origin "refs/tags/${FINAL_TAG}:refs/tags/${FINAL_TAG}"
          test "$(git rev-list -n 1 "${FINAL_TAG}")" = "${GITHUB_SHA}"
          printf '%s' "${metadata}" > final-readback/FINAL_RELEASE_METADATA.json

      - name: Create and retain final publication receipt
        run: |
          set -euo pipefail
          mkdir -p final-receipt
          cp final-readback/FINAL_RELEASE_METADATA.json final-receipt/
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = {
              'release': 'Atlas ROS v6.1.0',
              'tag': 'v6.1.0',
              'candidate_head': os.environ['EXPECTED_CANDIDATE'],
              'production_merge_commit': os.environ['EXPECTED_MERGE'],
              'production_source_commit': os.environ['GITHUB_SHA'],
              'final_publication_run': os.environ['GITHUB_RUN_ID'],
              'final_package_sha256': os.environ['FINAL_PACKAGE_SHA256'],
              'full_validation': 'V4V-38',
              'promotion_decision': 'V4D-31',
              'semantic_fidelity': '12/12',
              'cloudvision_invariance': '7/7',
              'execution_planning': '52/52',
              'execution_orchestration': '64/64',
              'critical_orchestration': '54/54',
              'canonical_reconciliation': '77/77',
              'rollback': 'Atlas ROS v6.0.0',
              'live_provider_writes': 0,
              'final_release_readback_verified': True,
              'drive_independent_restoration_verified': True,
              'live_authority_switch_pending': True,
          }
          Path('final-receipt/V610_FINAL_PUBLICATION_RECEIPT.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          (cd final-receipt && sha256sum * > CHECKSUMS.sha256 && sha256sum -c CHECKSUMS.sha256)

      - name: Upload final publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v6.1.0-final-publication-receipt
          path: final-receipt/
          if-no-files-found: error
          retention-days: 90

      - name: Record final publication success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          receipt_sha="$(sha256sum final-receipt/V610_FINAL_PUBLICATION_RECEIPT.json | awk '{print $1}')"
          release_url="$(gh release view "${FINAL_TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          gh pr comment 18 --repo "${GITHUB_REPOSITORY}" --body "Atlas ROS v6.1.0 final publication and Drive-independent restoration passed. Final run: \`${GITHUB_RUN_ID}\`. Production source: \`${GITHUB_SHA}\`. Final package SHA-256: \`${FINAL_PACKAGE_SHA256}\`. Receipt SHA-256: \`${receipt_sha}\`. Final release: ${release_url}. Live Release Index and System State switching remains pending authoritative readback."

      - name: Record fail-closed publication failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 18 --repo "${GITHUB_REPOSITORY}" --body "Atlas ROS v6.1.0 final publication failed closed. Run: \`${GITHUB_RUN_ID}\`. Proposed source: \`${GITHUB_SHA}\`. Release Index and System State must remain on v6.0.0 until a corrected final run passes."
