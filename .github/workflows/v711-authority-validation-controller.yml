name: v711-authority-validation-controller

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: v711-authority-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate-proposed-authority:
    if: github.head_ref == 'release/v711-authority-validation-controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_COMMIT: 8c2e65ce0bba62c534300d4542b5be2059a38d49
      ACTIVATION_COMMIT: d0552511da460b145a931e0c80a0b14b61aaee11
      FINAL_SOURCE_COMMIT: 7e18113b58fcd486b5c7e8eb9368c7c70bc83bcd
      EXPECTED_SOURCE_SHA256: 250113a5053e90c8be701bd638f2dac276b25b3115a377fd5c5a78bc40f52cf7
      EXPECTED_WHEEL_SHA256: 10caa8768675cff65d1cd2765e1c15374e6e3b78b59ef921e9d4d78f6d236d71
      EXPECTED_MANIFEST_CANONICAL_SHA256: 508a460cc373360ce722dde2788894a338f32b3b6869d172c1144e3a229179cc
      EXPECTED_AUTHORITY_INTEGRITY: 6bd3cbb9eeedfaa69bb456376fb78c764267f080d4e93414cd2b3613f231e133
      EXPECTED_AUTHORITY_CANONICAL_SHA256: 0e4c9c5232845e6c5b07500f02d51f7b8a4208a8ed95d1167574d9081c486b64
      EXPECTED_RELEASE_INDEX_DIGEST: 34f02428a4e21c3fe4c5d950c4686ed7d204edd257ff5a1ff3288aca25be9335
      RELEASE_TAG: v7.1.1
    steps:
      - name: Check out exact proposed authority
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: d0552511da460b145a931e0c80a0b14b61aaee11
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install validation tooling
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate exact two-file authority proposal
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ACTIVATION_COMMIT"
          mkdir -p authority-validation-evidence
          git diff --name-only "$BASE_COMMIT" "$ACTIVATION_COMMIT" \
            > authority-validation-evidence/CHANGED_FILES.txt
          test "$(wc -l < authority-validation-evidence/CHANGED_FILES.txt)" -eq 2
          grep -Fx 'governance/AUTHORITY.json' authority-validation-evidence/CHANGED_FILES.txt
          grep -Fx 'governance/RELEASE_INDEX.md' authority-validation-evidence/CHANGED_FILES.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from atlas_ros.kernel.authority import AuthorityRecord, canonical_authority_payload
          from atlas_ros.kernel.bootstrap import render_release_index
          from atlas_ros.kernel.digests import sha256_digest

          authority_path = Path('governance/AUTHORITY.json')
          index_path = Path('governance/RELEASE_INDEX.md')
          authority_text = authority_path.read_text(encoding='utf-8')
          authority = AuthorityRecord.model_validate_json(authority_text)
          index = index_path.read_text(encoding='utf-8')
          assert authority.active_release.version == '7.1.1'
          assert authority.active_release.status == 'Active'
          assert authority.active_release.immutable_commit == os.environ['FINAL_SOURCE_COMMIT']
          assert authority.active_release.tag == 'v7.1.1'
          assert authority.active_release.manifest_path == 'release/RELEASE_MANIFEST_V711.md'
          assert authority.active_release.manifest_sha256 == os.environ['EXPECTED_MANIFEST_CANONICAL_SHA256']
          assert authority.active_release.source_sha256 == os.environ['EXPECTED_SOURCE_SHA256']
          assert authority.active_release.wheel_sha256 == os.environ['EXPECTED_WHEEL_SHA256']
          assert authority.immediate_rollback.version == '7.1.0'
          assert authority.immediate_rollback.immutable_commit == '0711b045f34f5ab7b03f7a61bc80653e0d815463'
          assert [item.version for item in authority.historical_rollbacks] == ['7.0.1', '6.5.0', '6.2.0']
          assert authority.last_promotion_transaction_id == 'V4D-50-production-promotion'
          assert authority.integrity.content_sha256 == os.environ['EXPECTED_AUTHORITY_INTEGRITY']
          assert authority.release_index.sha256 == os.environ['EXPECTED_RELEASE_INDEX_DIGEST']
          assert sha256_digest(authority_text) == os.environ['EXPECTED_AUTHORITY_CANONICAL_SHA256']
          payload = authority.model_dump(mode='json', exclude={'integrity'}, exclude_defaults=True)
          assert sha256_digest(canonical_authority_payload(payload)) == os.environ['EXPECTED_AUTHORITY_INTEGRITY']
          assert sha256_digest(index) == os.environ['EXPECTED_RELEASE_INDEX_DIGEST']
          assert render_release_index(authority) == index
          evidence = {
              'schema_version': '1.0',
              'status': 'proposed_authority_validated',
              'activation_commit': os.environ['ACTIVATION_COMMIT'],
              'active_release': '7.1.1',
              'source_commit': os.environ['FINAL_SOURCE_COMMIT'],
              'immediate_rollback': '7.1.0',
              'historical_rollbacks': ['7.0.1', '6.5.0', '6.2.0'],
              'authority_integrity': os.environ['EXPECTED_AUTHORITY_INTEGRITY'],
              'authority_canonical_sha256': os.environ['EXPECTED_AUTHORITY_CANONICAL_SHA256'],
              'release_index_digest': os.environ['EXPECTED_RELEASE_INDEX_DIGEST'],
              'required_integrations': ['GitHub', 'Notion', 'Todoist'],
              'google_drive_required': False,
              'promotion_decision': 'V4D-50',
              'publication_readback': 'V4V-76',
          }
          Path('authority-validation-evidence/AUTHORITY_VALIDATION.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - name: Verify immutable publication against proposed authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$FINAL_SOURCE_COMMIT"
          mkdir -p authority-validation-evidence/release-assets
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,url \
            > authority-validation-evidence/RELEASE_METADATA.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir authority-validation-evidence/release-assets
          (cd authority-validation-evidence/release-assets && sha256sum -c CHECKSUMS.sha256)
          test "$(sha256sum authority-validation-evidence/release-assets/atlas_ros-7.1.1.tar.gz | awk '{print $1}')" = "$EXPECTED_SOURCE_SHA256"
          test "$(sha256sum authority-validation-evidence/release-assets/atlas_ros-7.1.1-py3-none-any.whl | awk '{print $1}')" = "$EXPECTED_WHEEL_SHA256"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from atlas_ros.kernel.digests import sha256_digest

          root = Path('authority-validation-evidence/release-assets')
          metadata = json.loads(Path('authority-validation-evidence/RELEASE_METADATA.json').read_text(encoding='utf-8'))
          assert metadata['tagName'] == 'v7.1.1'
          assert metadata['isDraft'] is False
          assert metadata['isPrerelease'] is False
          assert sha256_digest((root / 'RELEASE_MANIFEST_V711.md').read_text(encoding='utf-8')) == os.environ['EXPECTED_MANIFEST_CANONICAL_SHA256']
          identity = json.loads((root / 'FINAL_IDENTITY.json').read_text(encoding='utf-8'))
          assert identity['production_authorized'] is True
          assert identity['published'] is True
          assert identity['authority_activated'] is False
          assert identity['source_commit'] == os.environ['FINAL_SOURCE_COMMIT']
          assert identity['required_integrations'] == ['GitHub', 'Notion', 'Todoist']
          assert identity['promotion_decision'] == 'V4D-50'
          assert identity['package_review'] == 'V4V-74'
          assert identity['prepublication_review'] == 'V4V-75'
          PY
          python -m venv authority-validation-evidence/clean-v711
          authority-validation-evidence/clean-v711/bin/python -m pip install \
            --disable-pip-version-check \
            authority-validation-evidence/release-assets/atlas_ros-7.1.1-py3-none-any.whl
          authority-validation-evidence/clean-v711/bin/python -c \
            "import atlas_ros; assert atlas_ros.__version__ == '7.1.1'"
      - name: Validate source quality and authority documentation
        run: |
          set -euo pipefail
          ruff check .
          python scripts/validate_architecture.py
          python scripts/validate_legacy_isolation.py
          python scripts/validate_dependency_lock.py requirements.runtime.lock
          python scripts/validate_vulnerability_exceptions.py
          mypy src
          pytest
      - name: Finalize validation evidence
        if: always()
        run: |
          mkdir -p authority-validation-evidence
          (cd authority-validation-evidence && \
            find . -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd authority-validation-evidence && sha256sum -c SHA256SUMS)
      - name: Retain authority validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ros-v711-authority-validation-d0552511da460b145a931e0c80a0b14b61aaee11
          path: authority-validation-evidence/
          if-no-files-found: error
          retention-days: 90
