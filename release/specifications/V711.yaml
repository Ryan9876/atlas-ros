package_name: atlas-ros
identity:
  version: 7.1.1
  source_commit: __SOURCE_COMMIT__
  tag: v7.1.1
authority_model_version: '7.0'
release_scope:
  - Consolidate Quick Initialization behind one typed read-only operation and compact receipt.
  - Always read live GitHub authority while reusing digest-bound immutable Release Index and manifest snapshots when eligible.
  - Use compact live System State and direct Integration Inventory projections with only one Todoist liveness probe.
  - Add stage-level initialization telemetry and deterministic cold/warm equivalence evidence.
  - Minimize GitHub Actions jobs, builds, artifacts, matrices, and live connector use.
