required_integrations: [GitHub, Notion, Todoist]
optional_integrations: [Google Drive]
validation_profile:
  - focused Ruff and strict MyPy
  - architecture and legacy-isolation validation
  - complete pytest with branch coverage
  - deterministic cold and warm initialization equivalence
  - cache rejection and fail-closed fallback
  - compact projection and receipt schema validation
  - build-once source and wheel validation
  - dependency and vulnerability audits at final-candidate stage
  - startup and initialization performance comparison
  - immutable v7.1.0 rollback restoration
artifact_requirements:
  - build-once source distribution
  - build-once wheel
  - SPDX SBOM
  - source manifest
  - nested checksums
  - exact candidate identity
  - cold and warm initialization performance evidence
promotion_prerequisites:
  - build-once artifacts
  - independent post-publication readback
  - rollback restoration
  - exact Ryan authorization
publication_policy:
  - candidate validation and publication are separate transactions
  - immutable publication requires exact package authorization
  - publication performs no authority activation
authority_activation_policy:
  - activation follows independent publication readback
  - GitHub and Notion authority change transactionally
  - active authority remains unchanged during candidate validation
restoration_requirements:
  - Atlas ROS v7.1.0 restores from immutable assets
  - Atlas ROS v7.0.1 remains historical restoration evidence
  - Atlas ROS v6.5.0 and v6.2.0 remain historical restoration evidence
migration_requirements:
  - production Notion projection activation requires a separate exact transaction
  - existing initialization callers remain compatible
compatibility_rules:
  - public v7 initialization contracts remain supported
  - initialize and initialize_full retain cold canonical behavior
  - compact projections do not replace owned Notion authority fields
  - breaking changes require a future major release
