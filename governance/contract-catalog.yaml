schema_version: "1.0"
digest_algorithm: sha256
contracts:
  - id: atlas.capture-envelope
    schema_version: "1.0"
    owner: input_processing
    schema: schemas/capture/capture-envelope.schema.json
    readers: ["1.x"]
    writer: "1.0"
    compatibility: additive_only_within_major
  - id: atlas.intent-graph
    schema_version: "1.0"
    owner: input_processing
    schema: schemas/reasoning/intent-graph.schema.json
    readers: ["1.x"]
    writer: "1.0"
    compatibility: additive_only_within_major
  - id: atlas.proposed-execution-plan
    schema_version: "1.0"
    owner: execution_planning
    schema: schemas/execution/proposed-execution-plan.schema.json
    readers: ["1.x"]
    writer: "1.0"
    compatibility: additive_only_within_major
  - id: atlas.provider-operation-payload
    schema_version: "1.0"
    owner: attended_execution
    schema: schemas/execution/provider-operation-payload.schema.json
    readers: ["1.x"]
    writer: "1.0"
    compatibility: additive_only_within_major
  - id: atlas.authorized-execution-plan
    schema_version: "1.0"
    owner: attended_authorization
    schema: schemas/execution/authorized-execution-plan.schema.json
    readers: ["1.x"]
    writer: "1.0"
    compatibility: additive_only_within_major
  - id: atlas.execution-transaction-receipt
    schema_version: "1.0"
    owner: attended_execution
    schema: schemas/execution/execution-transaction-receipt.schema.json
    readers: ["1.x"]
    writer: "1.0"
    compatibility: additive_only_within_major
  - id: atlas.pipeline-run-envelope
    schema_version: "1.0"
    owner: canonical_processing
    schema: schemas/execution/pipeline-run-envelope.schema.json
    readers: ["1.x"]
    writer: "1.0"
    compatibility: additive_only_within_major
lifecycle:
  legacy_contracts:
    allowed_only_in: [src/atlas_ros/contracts/migrations, tests/migration]
    forbidden_from:
      - src/atlas_ros/application
      - src/atlas_ros/capabilities
      - src/atlas_ros/contracts/execution
      - src/atlas_ros/entry_points
      - src/atlas_ros/kernel
      - src/atlas_ros/policy
      - src/atlas_ros/ports
