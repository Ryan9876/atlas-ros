schema_version: "1.0"
digest_algorithm: sha256
contracts:
  - id: atlas.capture-envelope
    schema_version: "1.0"
    owner: input_processing
    schema: schemas/capture/capture-envelope.schema.json
    readers: ["1.x"]
    writer: "1.0"
    compatibility: additive_only_within_major
  - id: atlas.intent-graph
    schema_version: "1.0"
    owner: input_processing
    schema: schemas/reasoning/intent-graph.schema.json
    readers: ["1.x"]
    writer: "1.0"
    compatibility: explicit_migration
  - id: atlas.execution-plan
    schema_version: "3.0"
    owner: execution_planning
    schema: schemas/execution/execution-plan.schema.json
    readers: ["3.x"]
    writer: "3.0"
    migrations:
      - src/atlas_ros/contracts/migrations/v6_execution_plan.py
    compatibility: explicit_migration
  - id: atlas.pipeline-run-envelope
    schema_version: "1.0"
    owner: canonical_processing
    schema: schemas/execution/pipeline-run-envelope.schema.json
    readers: ["1.x"]
    writer: "1.0"
    compatibility: additive_only_within_major
lifecycle:
  legacy_contracts:
    allowed_only_in: [src/atlas_ros/contracts/migrations, tests/migration]
    forbidden_from: [src/atlas_ros/application, src/atlas_ros/capabilities, src/atlas_ros/cli]
