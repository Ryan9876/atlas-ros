schema_version: "1.0"
architecture_version: "7.0"
layers:
  - contracts
  - policy
  - capabilities
  - application
  - entry_points
  - adapters
  - tooling
dependency_rules:
  contracts:
    may_depend_on: []
    must_not_depend_on: [policy, capabilities, application, adapters, runtime, tooling]
  policy:
    may_depend_on: [contracts]
    must_not_depend_on: [application, adapters, runtime, tooling]
  capabilities:
    may_depend_on: [contracts, policy]
    must_not_depend_on: [adapters, tooling]
  application:
    may_depend_on: [contracts, policy, capabilities, ports]
    must_not_depend_on: [adapters, tooling]
  entry_points:
    may_depend_on: [application, kernel]
    must_not_depend_on: [adapters, tooling]
  adapters:
    may_depend_on: [contracts, ports]
    must_not_depend_on: [capabilities, application, tooling]
  tooling:
    may_depend_on: [contracts, policy, capabilities, application, ports, adapters, kernel]
    must_not_be_imported_by: [contracts, policy, capabilities, application, entry_points, adapters]
provider_boundaries:
  provider_writes_only_from: [src/atlas_ros/adapters]
  planning_only_from: [src/atlas_ros/capabilities/execution_planning]
  authorization_only_from: [src/atlas_ros/application]
  canonical_coordinator: src/atlas_ros/application/canonical_processing.py
prohibitions:
  - adapters_must_not_plan
  - planners_must_not_authorize
  - orchestration_must_not_mutate_authorized_plan
  - reconciliation_must_not_create_execution_intent
  - advisory_capabilities_must_not_mutate_records
  - production_runtime_must_not_import_legacy_compatibility
  - production_runtime_must_not_import_release_tooling
  - current_runtime_must_not_depend_on_google_drive
public_interfaces:
  - atlas_ros.kernel.bootstrap
  - atlas_ros.application.canonical_processing.CanonicalProcessingCoordinator
  - atlas_ros.contracts
  - atlas_ros.cli.main
validation:
  manifest_driven: true
  required_ci_check: architecture-validation
