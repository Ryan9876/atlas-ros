schema_version: "1.2"
release_family: "7.x"
authority_model_version: "7.0"
compiler:
  canonical: tools/release/release_compiler.py
  specification_contract: atlas.release-specification
  version_neutral: true
  release_family_paths_forbidden: true
  candidate_outputs_must_not_claim_active: true
  compatibility_registry: governance/release-workflow-compatibility.yaml
production_activation:
  requires_explicit_ryan_authorization: true
  candidate_pr_must_be_merged: true
  exact_final_source_required: true
  build_once_artifacts_required: true
  final_publication_controller_required: true
  post_publication_readback_required: true
  authority_activation_transaction_required: true
  allow_candidate_to_claim_active: false
rollback:
  immediate_version: "6.5.0"
  immediate_tag: "v6.5.0"
  immutable_commit: "bb6d6fea70d6824c9bc6a42e63ba36cc88029260"
  restoration_required: true
  historical_versions:
    - "6.2.0"
authority:
  canonical_record: governance/AUTHORITY.json
  generated_release_index: governance/RELEASE_INDEX.md
  immutable_manifest_pattern: release/RELEASE_MANIFEST_V*.md
  current_manifest_projection: release/RELEASE_MANIFEST.md
  integration_inventory_resolution: active-release-manifest
  notion_system_state_url: https://app.notion.com/p/3a0b8344ad2c81d1b545d0266b7cd809
  google_drive_bootstrap_forbidden: true
  initialization_reads:
    - github_authority_head
    - github_release_index_head
    - github_immutable_manifest
    - notion_system_state
    - notion_integration_inventory
  required_production_integrations:
    - GitHub
    - Notion
    - Todoist
  optional_integrations:
    - Google Drive
provider_boundaries:
  candidate_provider_writes: 0
  autonomous_scheduling: forbidden
  autonomous_messaging: forbidden
  autonomous_deletion: forbidden
  production_promotion_from_candidate_workflow: forbidden
drive:
  initialization_role: forbidden
  release_authority_role: forbidden
  runtime_role: forbidden
  required_integration: false
  optional_historical_access: permitted
  deletion_or_retirement_requires_separate_authorization: true
  preserve_release_family: "6.x_and_newer"
  historical_target_root_id: 1kkJBRR1cdIOolURmxnxM2SP_U611vlyf
  historical_target_folder_count: 92
  dependency_inventory_required: true
  retirement_simulation_required: true
  post_retirement_readback_required: true
pre_v6_deletion:
  permitted_before_v701_activation: false
  requires_v701_post_promotion_readback: true
  requires_v650_restoration: true
  requires_item_level_exclusion_review: true
  exclusion_classes:
    - legal_hold
    - security_record_required_for_v6_or_v7
    - decision_record_required_for_v6_or_v7
    - audit_record_required_for_v6_or_v7
  requires_exact_transaction_authorization: true
  provider_writes_during_validation: 0
  destructive_actions_during_validation: 0
drive_retirement:
  permitted_before_v701_activation: false
  requires_v701_post_promotion_readback: true
  requires_v650_restoration: true
  requires_zero_current_dependencies: true
  requires_exact_transaction_authorization: true
  account_and_credential_scope_required: true
  non_destructive_simulation_required: true
historical_cleanup:
  item_level_inventory_required: true
  immutable_digests_required: true
  unknown_classification: fail_closed
  exact_transaction_authorization_required: true
  object_and_byte_budgets_required: true
  dry_run_required: true
  idempotency_required: true
  uncertain_apply_readback_required: true
  partial_failure_receipts_required: true
  destructive_actions_during_validation: 0
lazy_loading:
  provider_adapters_deferred: true
  release_tooling_excluded_from_runtime: true
  migration_tooling_excluded_from_runtime: true
  cold_start_required: true
  optional_warm_runtime:
    authoritative: false
    provider_writes: false
    authentication_required: true
    freshness_required: true
    disposable: true
