schema_version: "1.0"
capabilities:
  - id: atlas.input-processing
    package: capabilities/input_processing
    owner: Atlas ROS Core
    writes_providers: false
    inputs: [CaptureEnvelope]
    outputs: [IntentGraph]
  - id: atlas.classification
    package: capabilities/classification
    owner: Atlas ROS Core
    writes_providers: false
  - id: atlas.knowledge-composition
    package: capabilities/knowledge_composition
    owner: Atlas ROS Core
    writes_providers: false
  - id: atlas.management-reasoning
    package: capabilities/management_reasoning
    owner: Atlas ROS Core
    writes_providers: false
  - id: atlas.management-structure
    package: capabilities/management_structure
    owner: Atlas ROS Core
    writes_providers: false
  - id: atlas.record-routing
    package: capabilities/record_routing
    owner: Atlas ROS Core
    writes_providers: false
  - id: atlas.execution-planning
    package: capabilities/execution_planning
    owner: Atlas ROS Core
    writes_providers: false
    inputs: [IntentGraph, PlannedProviderOperation]
    outputs: [ProposedExecutionPlan]
    sole_planning_authority: true
  - id: atlas.framework-composition
    package: capabilities/framework_composition
    owner: Atlas ROS Core
    writes_providers: false
  - id: atlas.minimum-effective-path
    package: capabilities/minimum_effective_path
    owner: Atlas ROS Core
    writes_providers: false
  - id: atlas.execution-intelligence
    package: capabilities/execution_intelligence
    owner: Atlas ROS Core
    writes_providers: false
    advisory_only: true
  - id: atlas.execution-presentation
    package: capabilities/execution_presentation
    owner: Atlas ROS Core
    writes_providers: false
  - id: atlas.scenario-intelligence
    package: capabilities/scenario_intelligence
    owner: Atlas ROS Core
    writes_providers: false
    advisory_only: true
  - id: atlas.decision-support
    package: capabilities/decision_support
    owner: Atlas ROS Core
    writes_providers: false
  - id: atlas.reconciliation
    package: capabilities/reconciliation
    owner: Atlas ROS Core
    writes_providers: false
    inputs: [ProposedExecutionPlan, ExecutionTransactionReceipt]
    outputs: [ReconciliationResult]
    may_create_execution_intent: false
